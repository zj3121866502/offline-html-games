#tt-panel{background:rgba(255,255,255,.68);border-radius:36px;padding:30px 52px 24px;box-shadow:0 14px 40px rgba(200,140,150,.22)}
.tt-foot{text-shadow:0 1px 0 #fff,0 0 8px #fff}
.tt-cat{line-height:1;animation:bob 2.6s ease-in-out infinite}
.tt-cat .ic{width:min(30vh,220px);height:min(30vh,220px);margin:0 auto}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-18px) rotate(3deg)}}
.tt-name{margin-top:10px;font-size:min(12vw,88px);font-weight:900;letter-spacing:.12em;
  color:#e2648f;text-shadow:0 4px 0 #fff}
.tt-sub{margin-top:10px;font-size:clamp(15px,2.4vw,22px);letter-spacing:.5em;text-indent:.5em;color:#b98a97}
.tt-btn{margin-top:44px;display:inline-block;padding:18px 64px;font-size:26px;font-weight:800;letter-spacing:.25em;text-indent:.25em;
  color:#fff;background:linear-gradient(135deg,#ff9db8,#ff7fa3);border-radius:60px;cursor:pointer;
  box-shadow:0 10px 0 #e56b8f;transition:transform .15s}
.tt-btn:hover{transform:translateY(-4px) scale(1.04)}
.tt-btn:active{transform:translateY(2px)}
.tt-foot{position:absolute;bottom:20px;width:100%;text-align:center;font-size:13px;color:#c9a6b1;letter-spacing:.2em}
.tt-deco{position:absolute;opacity:.75;animation:bob 3.4s ease-in-out infinite}
.tt-deco .ic{width:46px;height:46px}
.tt-modes{margin-top:22px;display:flex;gap:12px;justify-content:center}
.tt-mode{padding:11px 26px;border-radius:40px;font-size:16px;font-weight:800;letter-spacing:.1em;cursor:pointer;
  background:#fff;color:#c08a99;box-shadow:0 4px 0 rgba(200,140,150,.25);transition:all .15s}
.tt-mode:hover{transform:translateY(-2px)}
.tt-mode.on{background:linear-gradient(135deg,#ff9db8,#ff7fa3);color:#fff;box-shadow:0 5px 0 #e56b8f}
#s-title.work .tt-name{color:#4a6fa5}
#s-title.work .tt-mode.on{background:linear-gradient(135deg,#7fa8d9,#5b82b8);box-shadow:0 5px 0 #46688f}
#s-title.work .tt-btn{background:linear-gradient(135deg,#7fa8d9,#5b82b8);box-shadow:0 10px 0 #46688f}
#s-title.work{background:linear-gradient(160deg,#eaf1f8,#f4f0e8 55%,#e8eef5)}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;z-index:40;pointer-events:none}
.hud-chip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--card);
  border-radius:40px;padding:8px 22px 8px 12px;box-shadow:var(--shadow);font-size:22px;font-weight:800}
.hud-chip .ic{width:26px;height:26px}
.hud-chip small{font-size:13px;font-weight:600;color:#c08a99;letter-spacing:.05em}
.btns{display:flex;gap:10px;pointer-events:auto}
.hbtn{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;transition:transform .15s;color:var(--ink)}
.hbtn .ic{width:24px;height:24px}
.hbtn:hover{transform:scale(1.1)}
.hbtn:active{transform:scale(.92)}

/* ---------- shop grid ---------- */
#board-wrap{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:min(760px,94vw)}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;background:rgba(255,255,255,.65);
  border-radius:26px;padding:16px;box-shadow:var(--shadow)}
.slot{position:relative;aspect-ratio:1;border-radius:18px;background:linear-gradient(180deg,#fff3e2,#ffe3ec);
  box-shadow:inset 0 0 0 2px rgba(230,160,170,.25);display:grid;place-items:center}
.slot.locked{background:rgba(180,150,160,.12);box-shadow:inset 0 0 0 2px rgba(150,120,140,.15)}
.slot.locked::before{content:'';position:absolute;left:50%;top:50%;width:12px;height:7px;
  border:2.5px solid rgba(150,120,140,.4);border-bottom:none;border-radius:6px 6px 0 0;transform:translate(-50%,-118%)}
.slot.locked::after{content:'';position:absolute;left:50%;top:50%;width:18px;height:13px;
  background:rgba(150,120,140,.4);border-radius:4px;transform:translate(-50%,2%)}
.slot.drop-ok{box-shadow:inset 0 0 0 3px var(--pink)}
.item{position:absolute;inset:6px;border-radius:14px;background:var(--card);box-shadow:0 4px 10px rgba(200,140,150,.3);
  display:grid;place-items:center;cursor:grab;touch-action:none;transition:transform .12s;
  animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.item:hover{transform:scale(1.07)}
.item .em{width:74%;height:74%;pointer-events:none}
.item .em .ic{width:100%;height:100%}
.item .lv{position:absolute;top:4px;left:7px;font-size:11px;font-weight:800;color:#d98aa0;pointer-events:none}
.item .vv{position:absolute;bottom:3px;right:7px;font-size:11px;font-weight:700;color:#c9a05a;pointer-events:none}
.item.drag{position:fixed;inset:auto;z-index:60;width:84px;height:84px;cursor:grabbing;
  transform:scale(1.15) rotate(-4deg);box-shadow:0 16px 30px rgba(200,120,140,.45);transition:none;animation:none}
.item.t6{box-shadow:0 0 0 2px #ffd76e,0 4px 10px rgba(200,140,150,.3)}
.item.t8{box-shadow:0 0 0 2px #6be3ff,0 4px 10px rgba(200,140,150,.3)}
.item.pair{box-shadow:0 0 0 2px rgba(255,143,179,.55),0 4px 10px rgba(200,140,150,.3);
  animation:pairb 1.6s ease-in-out infinite}
@keyframes pairb{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ---------- cats ---------- */
#catwalk{position:absolute;left:0;right:0;bottom:8px;height:110px;z-index:30;pointer-events:none}
.cat{position:absolute;bottom:6px;transition:left 1.2s ease}
.cat .ic{width:56px;height:56px}
.cat .say{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:#fff;border-radius:14px;
  padding:4px 12px;font-size:15px;font-weight:700;color:#e2648f;box-shadow:0 3px 8px rgba(0,0,0,.12);
  opacity:0;transition:opacity .3s;white-space:nowrap}
.cat.talk .say{opacity:1}

/* ---------- shop modal（无毛玻璃：低配友好） ---------- */
#shop{position:absolute;inset:0;z-index:70;display:none;background:rgba(120,70,90,.55)}
#shop.on{display:grid;place-items:center}
#shop .panel{width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fffdf7;border-radius:26px;
  padding:26px 26px 30px;box-shadow:0 24px 60px rgba(120,60,80,.4);animation:cin .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes cin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#shop h2{text-align:center;font-size:30px;letter-spacing:.3em;text-indent:.3em;color:#e2648f;margin-bottom:4px}
#shop .stat{text-align:center;font-size:13px;color:#b98a97;margin-bottom:16px;letter-spacing:.05em}
.up{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;
  box-shadow:0 4px 12px rgba(200,140,150,.18)}
.up .ico{width:44px;text-align:center;flex:none}
.up .ico .ic{width:40px;height:40px;margin:0 auto}
.up .info{flex:1}
.up .nm{font-size:17px;font-weight:800}
.up .ds{font-size:12.5px;color:#b98a97;margin-top:2px;line-height:1.5}
.up .buy{min-width:104px;padding:10px 14px;border-radius:30px;text-align:center;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#ffcf5e,#f5a93c);color:#7a4d00;box-shadow:0 4px 0 #d98f22;transition:transform .12s;
  display:flex;align-items:center;justify-content:center;gap:5px}
.up .buy .ic{width:17px;height:17px;display:inline-block}
.up .buy:hover{transform:scale(1.05)}
.up .buy.off{background:#eee4e7;color:#c0a8b0;box-shadow:0 4px 0 #d5c3c9;cursor:not-allowed}
.up .buy.max{background:#e8f7e8;color:#4d9a5a;box-shadow:0 4px 0 #b9dcbf;cursor:default}
#shop .close{position:sticky;top:0;float:right;font-size:24px;font-weight:800;color:#c9a6b1;cursor:pointer;margin:-8px -6px 0 0}
#shop .reset{display:block;margin:14px auto 0;font-size:13px;color:#c9a6b1;cursor:pointer;text-decoration:underline}

/* ---------- 引导 & 提示 ---------- */
#hintbar{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);z-index:50;
  display:none;align-items:center;gap:10px;background:rgba(255,255,255,.96);color:#e2648f;
  border-radius:40px;padding:13px 28px;font-size:17px;font-weight:800;
  box-shadow:0 10px 28px rgba(220,120,150,.45);letter-spacing:.04em;pointer-events:none;white-space:nowrap}
#hintbar.on{display:flex;animation:cin .4s cubic-bezier(.2,1.5,.4,1)}
#hintbar .arrow{display:inline-block;color:#ff5d84;font-size:20px;animation:point 1s ease-in-out infinite}
@keyframes point{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
.ring{box-shadow:0 0 0 3px #ff8fb3,0 0 22px 6px rgba(255,143,179,.6)!important;
  animation:ringp 1.15s ease-in-out infinite}
@keyframes ringp{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.hbtn.ring{animation:ringp 1.15s ease-in-out infinite}
#help{position:absolute;inset:0;z-index:72;display:none;background:rgba(120,70,90,.55)}
#help.on{display:grid;place-items:center}
#help .panel{width:min(480px,92vw);background:#fffdf7;border-radius:24px;padding:28px 30px;
  box-shadow:0 24px 60px rgba(120,60,80,.4);animation:cin .35s cubic-bezier(.2,1.5,.4,1)}
#help h2{text-align:center;font-size:26px;color:#e2648f;letter-spacing:.25em;text-indent:.25em;margin-bottom:12px}
#help .row{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;margin:11px 0;line-height:1.65}
#help .row .ic{width:34px;height:34px;flex:none;margin-top:2px}
#help .go{display:block;margin:20px auto 0;padding:11px 40px;border-radius:30px;
  background:linear-gradient(135deg,#ff9db8,#ff7fa3);color:#fff;font-size:17px;font-weight:800;
  letter-spacing:.2em;text-indent:.2em;cursor:pointer;text-align:center;box-shadow:0 6px 0 #e56b8f}

/* ---------- toasts & floaters ---------- */
#toasts{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:10px 26px;background:rgba(255,255,255,.95);color:#e2648f;border-radius:30px;font-size:16px;font-weight:700;
  box-shadow:0 8px 22px rgba(200,140,150,.4);animation:tin 3.2s forwards;letter-spacing:.05em}
.toast.gold{background:linear-gradient(120deg,#ffd76e,#ffb64d);color:#7a4d00}
@keyframes tin{0%{opacity:0;transform:translateY(-14px) scale(.9)}8%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}
.floater{position:fixed;z-index:75;font-size:20px;font-weight:900;color:#e8a13c;pointer-events:none;
  text-shadow:0 2px 0 #fff;animation:fl 1.3s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}

/* ---------- 连击 & 金币飞行 & 任务 ---------- */
#combo{position:fixed;right:250px;top:76px;z-index:66;display:none;flex-direction:column;align-items:center;
  pointer-events:none}
#combo.on{display:flex}
#combo .cb-n{font-size:44px;font-weight:900;color:#ff5d84;text-shadow:0 3px 0 #fff,0 8px 18px rgba(220,90,130,.35);
  animation:cbp .3s cubic-bezier(.2,1.8,.4,1)}
@keyframes cbp{from{transform:scale(1.6)}to{transform:scale(1)}}
#combo .cb-x{font-size:15px;font-weight:800;color:#e8a13c;background:#fff;border-radius:20px;padding:3px 12px;
  box-shadow:0 4px 12px rgba(200,140,150,.3);margin-top:2px}
.coinfly{position:fixed;z-index:76;width:26px;height:26px;pointer-events:none;
  transition:transform .7s cubic-bezier(.5,-.2,.6,1),opacity .7s}
.coinfly svg{width:100%;height:100%}
#quests{position:absolute;left:14px;top:74px;z-index:40;width:196px;background:rgba(255,255,255,.92);
  border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);display:none}
#quests.on{display:block}
#quests h3{font-size:14px;color:#e2648f;letter-spacing:.2em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#quests h3 .qclose{cursor:pointer;color:#c9a6b1;font-size:15px;font-weight:800}
.qrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:7px 0;color:#8a7263}
.qrow .qbar{flex:1;height:8px;border-radius:8px;background:#ffe3ec;overflow:hidden}
.qrow .qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9db8,#ffcf5e);transition:width .4s}
.qrow .qtxt{width:76px;flex:none}
.qrow .qck{width:16px;flex:none;text-align:center;color:#9fe8c0;font-weight:900}
.qrow.done .qtxt{color:#c0a8b0;text-decoration:line-through}
#qbadge{position:absolute;left:2px;top:64px;width:22px;height:22px;border-radius:50%;background:#ff5d84;color:#fff;
  font-size:12px;font-weight:900;display:none;place-items:center;z-index:41}
#qbadge.on{display:grid}

/* ---------- 转生 & 成就 & 段位 ---------- */
.tt-rank{margin-top:14px;display:inline-block;font-size:15px;font-weight:800;color:#7a4d00;
  background:linear-gradient(120deg,#ffe9a8,#ffd76e);border-radius:30px;padding:8px 24px;
  box-shadow:0 6px 16px rgba(220,160,60,.35);letter-spacing:.1em}
#starchip{display:none;align-items:center;gap:6px}
#starchip.on{display:flex}
#starchip .ic{width:24px;height:24px}
#rebtn{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:42;display:none;
  padding:12px 30px;border-radius:40px;font-size:17px;font-weight:900;letter-spacing:.1em;cursor:pointer;
  color:#7a4d00;background:linear-gradient(120deg,#ffe9a8,#ffb64d);box-shadow:0 8px 0 #d98f22;
  animation:ringp 1.15s ease-in-out infinite}
#rebtn.on{display:block}
#achbtn-badge{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;background:#ff5d84;
  color:#fff;font-size:11px;font-weight:900;display:none;place-items:center}
#achbtn-badge.on{display:grid}
#ach{position:absolute;inset:0;z-index:71;display:none;background:rgba(120,70,90,.55)}
#ach.on{display:grid;place-items:center}
#ach .panel{width:min(600px,92vw);max-height:86vh;overflow:auto;background:#fffdf7;border-radius:26px;
  padding:26px 26px 30px;box-shadow:0 24px 60px rgba(120,60,80,.4);animation:cin .4s cubic-bezier(.2,1.5,.4,1)}
#ach h2{text-align:center;font-size:28px;letter-spacing:.3em;text-indent:.3em;color:#e2648f;margin-bottom:4px}
#ach .stat{text-align:center;font-size:13px;color:#b98a97;margin-bottom:14px}
#ach .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.arow{display:flex;gap:10px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;
  box-shadow:0 3px 10px rgba(200,140,150,.15);opacity:.55}
.arow.got{opacity:1;border:1.5px solid #ffd76e;background:#fffaf0}
.arow .medal{width:34px;height:34px;flex:none}
.arow .an{font-size:14.5px;font-weight:800}
.arow .ad{font-size:11.5px;color:#b98a97;margin-top:1px}
.arow.got .an{color:#c9860a}
#ach .close{position:sticky;top:0;float:right;font-size:24px;font-weight:800;color:#c9a6b1;cursor:pointer;margin:-8px -6px 0 0}
.item.t10{box-shadow:0 0 0 2px #c9a7ff,0 4px 10px rgba(200,140,150,.3)}
.item.t11{box-shadow:0 0 0 2px #ffb347,0 4px 10px rgba(200,140,150,.3)}
.item.t12{box-shadow:0 0 0 2px #ff7a2f,0 4px 10px rgba(200,140,150,.3)}

/* ---------- 订单板（顾客点单 / 甲方需求） ---------- */
#orders{position:absolute;right:14px;top:74px;z-index:40;width:216px;display:flex;flex-direction:column;gap:10px}
.ocard{background:rgba(255,255,255,.95);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);
  animation:cin .4s cubic-bezier(.2,1.5,.4,1)}
.ocard .ohead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ocard .oava{width:30px;height:30px;flex:none}
.ocard .onm{flex:1;font-size:13.5px;font-weight:800;color:#e2648f}
.ocard .ox{cursor:pointer;color:#c9a6b1;font-weight:900;font-size:14px;padding:0 2px}
.ocard .ox:hover{color:#ff5d84}
.ocard .oitems{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ocard .oi{position:relative;width:44px;height:44px;border-radius:12px;background:#fff3e2;
  box-shadow:inset 0 0 0 1.5px rgba(230,160,170,.3);display:grid;place-items:center}
.ocard .oi .ic{width:32px;height:32px}
.ocard .oi b{position:absolute;right:-4px;bottom:-4px;background:#ff8fb3;color:#fff;font-size:11px;
  border-radius:10px;padding:1px 6px;box-shadow:0 2px 4px rgba(200,120,140,.4)}
.ocard .oi.ok b{background:#43d6a0}
.ocard .otimer{height:7px;border-radius:7px;background:#ffe3ec;overflow:hidden;margin-bottom:8px}
.ocard .otimer i{display:block;height:100%;background:linear-gradient(90deg,#ff9db8,#ffcf5e);transition:width 1s linear}
.ocard .otimer.low i{background:#ff5d73;animation:tpulse .6s infinite}
@keyframes tpulse{0%,100%{opacity:1}50%{opacity:.5}}
.ocard .ogo{display:block;text-align:center;padding:8px 0;border-radius:24px;font-size:14px;font-weight:800;
  background:linear-gradient(135deg,#ffcf5e,#f5a93c);color:#7a4d00;box-shadow:0 4px 0 #d98f22;cursor:pointer}
.ocard .ogo:hover{transform:scale(1.04)}
.ocard .ogo.off{background:#eee4e7;color:#c0a8b0;box-shadow:0 4px 0 #d5c3c9;cursor:not-allowed}
#ohead-tip{font-size:12px;font-weight:800;color:#e2648f;letter-spacing:.15em;text-align:right;padding-right:4px}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:65}
</style>
</head>
<body>
<div id="app">
  <!-- 标题 -->
  <div class="screen on" id="s-title">
    <div class="tt-deco" style="left:8%;top:14%" id="deco-a"></div>

<script>
"use strict";
/* ================= 手绘 SVG 图标库（零字体依赖，老浏览器通吃） ================= */

 shop:{game:'猫猫甜品铺',sub:'合成 · 放置 · 软萌经营',coin:'币',sell:'出售',merge:'合成',cat:'猫猫',

function fmt(n){ n=Math.floor(n);

/* ================= 音效 ================= */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} return AC; }
function tone(f,delay,dur,type,vol,slide){ const c=ac(); if(!c||S.muted)return;
  const o=c.createOscillator(),g=c.createGain(); o.type=type||'sine';
  o.frequency.setValueAtTime(f,c.currentTime+delay);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+delay+dur);
  g.gain.setValueAtTime(0,c.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol||.15,c.currentTime+delay+.02);
  g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+delay+dur);
  o.connect(g).connect(c.destination); o.start(c.currentTime+delay); o.stop(c.currentTime+delay+dur+.05); }
function sDrop(){ tone(500,0,.12,'sine',.08,380); }
function sMerge(t){ tone(600+t*60,0,.18,'triangle',.14,900+t*80); tone(900+t*60,.09,.22,'sine',.1); }
function sSell(n){ const base=1200+Math.min((n||0)-1,8)*90;
  tone(base,0,.1,'sine',.1); tone(base*1.33,.07,.14,'sine',.08); }
function sBuy(){ [660,880,1100].forEach((f,i)=>tone(f,i*.07,.25,'triangle',.1)); }
function sMeow(){ tone(700,0,.25,'sine',.1,420); }
function sBig(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.09,.5,'sine',.12)); }

/* ================= 粒子 ================= */
const P={parts:[],run:false};
function fxGo(){ if(!P.run){P.run=true;requestAnimationFrame(loop);} }
function loop(){ fxc.clearRect(0,0,fx.width,fx.height);
  P.parts=P.parts.filter(p=>{ p.x+=p.vx;p.y+=p.vy;p.vy+=(p.g||0);p.life--;
    fxc.globalAlpha=Math.max(0,p.life/p.max);
    fxc.fillStyle=p.c;fxc.beginPath();fxc.arc(p.x,p.y,p.s,0,7);fxc.fill();
    fxc.globalAlpha=1; return p.life>0; });
  if(P.parts.length)requestAnimationFrame(loop); else P.run=false; }
function spark(x,y,n,cols){ for(let i=0;i<n;i++)P.parts.push({x,y,vx:rand(-2.4,2.4),vy:rand(-3.4,-.6),g:.12,
  s:rand(2.5,5.5),c:cols[i%cols.length],life:rand(30,55),max:55}); fxGo(); }
const PCOLS=['#ff8fb3','#ffd76e','#6be3ff','#c9a7ff','#9fe8c0'];
function confetti(n){ for(let i=0;i<n;i++)setTimeout(()=>P.parts.push({x:rand(0,innerWidth),y:-20,
  vx:rand(-.6,.6),vy:rand(1.6,3.4),g:.03,s:rand(3,7),c:PCOLS[i%PCOLS.length],life:rand(90,150),max:150}),i*60); fxGo(); }

/* ================= 工具 ================= */
function toast(msg,gold){ const t=document.createElement('div'); t.className='toast'+(gold?' gold':'');
  t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3300); }
function floatTxt(x,y,txt){ const d=document.createElement('div'); d.className='floater'; d.textContent=txt;
  d.style.left=x+'px'; d.style.top=y+'px'; document.body.appendChild(d); setTimeout(()=>d.remove(),1400); }
function slotRect(i){ return board.children[i].getBoundingClientRect(); }

/* ================= 棋盘渲染 ================= */
function renderBoard(){ board.innerHTML='';
  for(let i=0;i<24;i++){ const sl=document.createElement('div');
    sl.className='slot'+(i>=S.slots?' locked':''); sl.dataset.i=i; board.appendChild(sl); }
  S.grid.forEach((t,i)=>{ if(t!=null)renderItem(i); }); markPairs(); }
function renderItem(i){ const t=S.grid[i]; const sl=board.children[i];
  sl.querySelectorAll('.item').forEach(x=>x.remove()); if(t==null)return;
  const d=document.createElement('div'); d.className='item t'+t; d.dataset.i=i;
  d.innerHTML='<span class="lv">Lv'+(t+1)+'</span><span class="em">'+ic(itIc(t))+'</span><span class="vv">'+fmt(sellPrice(t))+TT('coin')+'</span>';
  sl.appendChild(d); bindItem(d,i); }
/* 可合成的对子：呼吸发光，一眼就知道该动谁 */
function markPairs(){ const seen={};
  for(let i=0;i<S.slots;i++){ const t=S.grid[i]; if(t==null||t>=MAXT)continue; (seen[t]=seen[t]||[]).push(i); }
  Object.values(seen).forEach(list=>{ if(list.length>1)
    list.forEach(i=>{ const el=board.children[i].querySelector('.item'); if(el)el.classList.add('pair'); }); });
  guideRefresh(); }

/* ================= 拖拽 / 点击 ================= */
let drag=null;
function bindItem(d,i0){
  d.addEventListener('pointerdown',e=>{
    ac(); if(S.locked)return;
    drag={d,i:i0,moved:false,sx:e.clientX,sy:e.clientY,ox:e.clientX,oy:e.clientY};
    d.setPointerCapture(e.pointerId);
  });
  d.addEventListener('pointermove',e=>{
    if(!drag||drag.d!==d)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){
      drag.moved=true; d.classList.add('drag');
      document.querySelectorAll('.slot.drop-ok').forEach(s=>s.classList.remove('drop-ok'));
    }
    if(drag.moved){ d.style.left=(e.clientX-42)+'px'; d.style.top=(e.clientY-42)+'px';
      const sl=slotUnder(e.clientX,e.clientY);
      document.querySelectorAll('.slot.drop-ok').forEach(s=>s.classList.remove('drop-ok'));
      if(sl!=null){ const j=+sl.dataset.i;
        if(j!==drag.i&&(S.grid[j]==null||S.grid[j]===S.grid[drag.i])) sl.classList.add('drop-ok'); } }
  });
  d.addEventListener('pointerup',e=>{
    if(!drag||drag.d!==d)return; const wasMoved=drag.moved; d.classList.remove('drag');
    document.querySelectorAll('.slot.drop-ok').forEach(s=>s.classList.remove('drop-ok'));
    const i=drag.i; drag=null;
    if(!wasMoved){ tapSell(i,e.clientX,e.clientY); return; }
    const sl=slotUnder(e.clientX,e.clientY);
    if(sl==null){ renderItem(i); return; }
    const j=+sl.dataset.i;
    if(j===i){ renderItem(i); return; }
    const a=S.grid[i];
    if(a==null){ renderItem(i); return; }
    if(S.grid[j]===a){ doMerge(i,j); }
    else if(S.grid[j]==null&&j<S.slots){ S.grid[j]=a; S.grid[i]=null; renderItem(i); renderItem(j); sDrop(); markPairs(); }
    else renderItem(i);
  });
}
function slotUnder(x,y){ const el=document.elementFromPoint(x,y); if(!el)return null;
  const sl=el.closest('.slot'); return (sl&&+sl.dataset.i<S.slots)?sl:null; }

/* ================= 合成 / 出售 ================= */
function doMerge(from,to){
  const t=S.grid[from]; S.grid[from]=null; S.grid[to]=Math.min(t+1,MAXT);
  renderItem(from); renderItem(to);
  const r=slotRect(to), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const nt=S.grid[to];
  spark(cx,cy,18,PCOLS);
  sMerge(nt); S.stats.merges++;
  if(S.stats.merges===1){ toast(S.theme==='work'?'卷成功了！两份相同的产出叠一起就能升级':'合成成功！相同的甜品拖到一起就能升级',true); floatTxt(cx,cy-30,'Lv'+(nt+1)+' '+itNm(nt)); }
  if(nt>S.stats.best){ S.stats.best=nt; }
  achCheck();
  if(nt===MAXT){ toast(S.theme==='work'?'财务自由！！打工喵的终极梦想实现了！':ITEMS[nt].n+'！！传说中的终极甜品诞生了！',true); sBig(); confetti(50);
    catSay('喵呜——！'); }
  else if(nt===8){ toast(S.theme==='work'?'上市敲钟！离财务自由只差三步':ITEMS[nt].n+'！已经摸到传说的门槛了',true); }
  else if(nt>=5){ catSay(S.theme==='work'?'这方案漂亮！':'哇，好香！'); }
  qProg('m',1); if(nt>=4)qProg('b',1);
  markPairs(); save();
}
let confirmSlot=-1,confirmTimer=null;
function tapSell(i,x,y){
  const t=S.grid[i]; if(t==null)return;
  if(t>=6&&confirmSlot!==i){ confirmSlot=i; toast(S.theme==='work'?('这份'+itNm(t)+'很重要！再点一次才交付哦'):('这个'+itNm(t)+'值钱！再点一次才卖哦'));
    clearTimeout(confirmTimer); confirmTimer=setTimeout(()=>confirmSlot=-1,2200); return; }
  confirmSlot=-1;
  bumpCombo();
  const mult=comboMult();
  const p=Math.round(sellPrice(t)*mult); S.coins+=p; S.stats.earned+=p; S.stats.sells++;
  S.grid[i]=null; renderItem(i);
  const r=slotRect(i);
  floatTxt(r.left+r.width/2-20,r.top,'+'+fmt(p)+' '+TT('coin')+(mult>1?' x'+comboN:''));
  flyCoins(r.left+r.width/2,r.top+r.height/2,Math.min(1+Math.floor(t/2),6));
  spark(r.left+r.width/2,r.top+r.height/2,8,['#ffd76e','#ffb1c8']);
  sSell(comboN); updateHud(); markPairs(); qProg('s',1); achCheck(); save();
}

/* ================= 掉落 ================= */
function emptySlots(){ const a=[]; for(let i=0;i<S.slots;i++)if(S.grid[i]==null)a.push(i); return a; }
function dropTier(){ // 培训生效：每级 7% 概率直接产出高级甜品
  if(S.train&&Math.random()<S.train*0.07){
    const cap=S.train>=8?3:S.train>=4?2:1; // 产出等级 1~cap → Lv2~Lv4
    return 1+Math.floor(Math.random()*cap); }
  return 0; }
function dropT1(n){ let count=0;
  for(let k=0;k<n;k++){ const es=emptySlots(); if(!es.length)break;
    const i=es[Math.floor(Math.random()*es.length)]; S.grid[i]=dropTier(); renderItem(i); count++; }
  if(count)markPairs(); return count; }
let catTimers=[];
function tick(){
  const now=Date.now(), iv=interval();
  if(catTimers.length!==S.cats)catTimers=Array.from({length:S.cats},(_,k)=>now+iv*(0.3+0.7*k/S.cats));
  for(let c=0;c<catTimers.length;c++){
    if(now>=catTimers[c]){ catTimers[c]=now+iv*rand(.8,1.2);
      if(dropT1(1)){ sDrop(); catDropAnim(c); }
      else if(Math.random()<.3){ catSay(S.theme==='work'?'工位满啦…':'货架满啦…'); } } }
}
setInterval(tick,200);

/* ================= 自动合成管家（1~5 名，越雇越快） ================= */
let butlerT=0;
setInterval(()=>{ if(!S.auto||!$('#s-game').classList.contains('on'))return;
  const now=Date.now(); if(now-butlerT<butlerGap())return; butlerT=now;
  let pairs=Math.min(S.auto,3); // 每名管家一轮合一对，最多一轮 3 对防卡顿
  for(let k=0;k<pairs;k++){ let done=false;
    outer:for(let a=0;a<S.slots;a++){ if(S.grid[a]==null||S.grid[a]>=MAXT)continue;
      for(let b=a+1;b<S.slots;b++){ if(S.grid[b]===S.grid[a]){ doMerge(a,b); done=true; break outer; } } }
    if(!done)break; } },500);

/* ================= 售货员（≥85% 满才上班；只清"凑不成对的多余件"，优先卖贵的） ================= */
function clerkRun(){ if(!S.clerk||!$('#s-game').classList.contains('on'))return 0;
  let used=0; for(let i=0;i<S.slots;i++)if(S.grid[i]!=null)used++;
  if(used<S.slots*0.85)return 0;
  const taste=S.clerk+2;
  const cnt={}; for(let i=0;i<S.slots;i++){ const t=S.grid[i]; if(t!=null)cnt[t]=(cnt[t]||0)+1; }
  // 每个等级留 2 个给玩家/管家合成，其余"多余件"才卖；按等级从高到低卖（贵的优先）
  const tiers=Object.keys(cnt).map(Number).filter(t=>t<=taste&&cnt[t]>=3).sort((a,b)=>b-a);
  let budget=S.clerk+1, total=0; // 每轮最多卖 售货员数+1 个
  for(const t of tiers){
    let surplus=cnt[t]-2;
    while(surplus-->0&&budget>0){
      let bi=-1; for(let i=0;i<S.slots;i++)if(S.grid[i]===t){bi=i;break;}
      if(bi<0)break;
      const p=sellPrice(t); S.coins+=p; S.stats.earned+=p; S.stats.sells++;
      S.grid[bi]=null; renderItem(bi);
      const r=slotRect(bi); floatTxt(r.left+r.width/2-20,r.top,'+'+fmt(p)+' '+TT('coin'));
      flyCoins(r.left+r.width/2,r.top+r.height/2,2);
      budget--; total++; cnt[t]--;
    }
    if(budget<=0)break;
  }
  if(total){ sSell(); updateHud(); markPairs(); qProg('s',total); save(); }
  return total; }
setInterval(clerkRun,1200);

function guideStepNow(){

function guideRefresh(){
  document.querySelectorAll('.ring').forEach(e=>e.classList.remove('ring'));
  const st=guideStepNow(), hb=$('#hintbar'), ht=$('#hint-txt');
  if(st>=3){ hb.classList.remove('on'); return; }
  $('#btn-help').classList.toggle('ring', st<3);
  const msgs=S.theme==='work'
    ?['把一份便利贴拖到另一份相同的上面 —— 卷它！','点一下产出，交付换薪资！','薪资攒够了，去内卷中心升职，让打工喵干得更快！']
    :['把一颗奶糖拖到另一颗相同的上面 —— 合成！','点一下甜品，卖掉换金币！','金币攒够了，去商店升级，让猫猫们干得更快！'];
  ht.textContent=msgs[st]; hb.classList.add('on');
  if(st===0){ const seen={};
    for(let i=0;i<S.slots;i++){ const t=S.grid[i]; if(t==null||t>=MAXT)continue;
      if(seen[t]!=null){ [seen[t],i].forEach(k=>{ const el=board.children[k].querySelector('.item'); if(el)el.classList.add('ring'); }); break; }
      seen[t]=i; } }
  else if(st===1){ let bi=-1,bt=-1;
    for(let i=0;i<S.slots;i++){ const t=S.grid[i]; if(t!=null&&t>bt){ bt=t; bi=i; } }
    if(bi>=0){ const el=board.children[bi].querySelector('.item'); if(el)el.classList.add('ring'); } }
  else if(st===2){ $('#btn-shop').classList.add('ring'); } }

/* ================= 连击（越点越上头） ================= */
let comboN=0,comboT=null;
function comboMult(){ return comboN>=8?1.5:comboN>=5?1.25:comboN>=3?1.1:1; }
function bumpCombo(){
  comboN++; clearTimeout(comboT);
  comboT=setTimeout(()=>{ comboN=0; $('#combo').classList.remove('on'); },3000);

const REBORN_COIN=1e6, REBORN_MAX=5; // 毕业 5 次封顶，之后进入自由模式
function shopMaxed(){ return S.cats>=6&&S.spd>=10&&S.slots>=24&&S.sell>=10&&S.auto>=5&&S.clerk>=5&&S.train>=10; }
function rebornNeed(){ return REBORN_COIN*Math.pow(2,S.reborn); } // 第1次100万，第2次200万，第3次400万…
function starGain(){ return 1; } // 每次转生固定 1 颗星
function isFree(){ return S.reborn>=REBORN_MAX; } // 自由模式：不再重置，无目标经营
function canReborn(){ return !isFree()&&shopMaxed()&&S.coins>=rebornNeed(); }
function doReborn(){ if(!canReborn())return;
  const last=S.reborn===REBORN_MAX-1, wk=S.theme==='work';
  if(!confirm((last?(wk?'这是最后一次跳槽！':'这是最后一次毕业！'):(wk?'跳槽成功，猫猫们为你欢呼。':'毕业啦！猫猫们为你骄傲。'))+'\n\n'+(wk?'跳槽':'转生')+'将清空薪资、重置团队与工位，\n获得 1 份'+(wk?'履历（每份永久 +5% 全局薪资）':'传说之星（每颗永久 +5% 全局收益）')+'。'

    +'\n\n确定'+(wk?'跳槽':'转生')+'吗？'))return;
  S.stars++; S.reborn++;

    S.coins=0; S.cats=1; S.spd=0; S.slots=12; S.sell=0; S.auto=0; S.clerk=0; S.train=0;

/* ================= 订单板（顾客点单 / 甲方需求）：给合成赋予方向 ================= */
let ORDERS=[],ordSeq=0,ordTimer=null,ordersStarted=false;
function countTier(t){ let c=0; for(let i=0;i<S.slots;i++)if(S.grid[i]===t)c++; return c; }
function orderReady(o){ return o.items.every(it=>countTier(it.t)>=it.n); }
function genOrder(){
  const inv=S.grid.reduce((m,t)=>(t!=null&&t>m)?t:m,0); // 货架现最高
  const floor=Math.min(2+S.reborn,10); // 每次转生抬高保底档
  const maxT=Math.max(2,Math.min(Math.max(S.stats.best||0,inv,floor),10)); // 客户看店里有什么就点什么
  const kinds=1+Math.floor(Math.random()*2);
  const items=[],used={};
  for(let k=0;k<kinds;k++){
    // 45% 直接点「招牌菜」（玩家做过的最高级），其余按高级偏斜分布
    let t=Math.random()<.45?maxT:maxT-Math.floor(Math.pow(Math.random(),1.6)*maxT);
    t=Math.max(1,Math.min(maxT,t));
    if(used[t]){ const up=t+1,dn=t-1; // 撞车优先升级，其次降级
      if(up<=maxT&&!used[up])t=up; else if(dn>=1&&!used[dn])t=dn; else continue; }
    used[t]=1;
    items.push({t,n:1+Math.floor(Math.random()*2)});
  }
  let sum=0; items.forEach(it=>sum+=sellPrice(it.t)*it.n);
  const reward=Math.round(sum*1.8)+80;
  const dur=(90+Math.floor(Math.random()*50))*1000;
  return {id:++ordSeq,ai:ordSeq%3,items,t0:Date.now(),dur,reward};
}
function fillOrders(){ while(ORDERS.length<3)ORDERS.push(genOrder()); }
function deliverOrder(o){
  if(!orderReady(o))return;
  o.items.forEach(it=>{ let need=it.n;
    for(let i=0;i<S.slots&&need>0;i++){ if(S.grid[i]===it.t){S.grid[i]=null;need--;renderItem(i);} } });
  S.coins+=o.reward; S.stats.earned+=o.reward;
  const r=$('#board-wrap').getBoundingClientRect();
  floatTxt(r.left+r.width/2-30,r.top+20,'+'+fmt(o.reward)+' '+TT('coin'),true);
  toast((S.theme==='work'?'甲方满意！需求交付 +':'顾客超赞！订单完成 +')+fmt(o.reward)+' '+TT('coin'),true);
  sBig(); confetti(24);
  ORDERS=ORDERS.filter(x=>x!==o);
  setTimeout(()=>{ if(ORDERS.length<3){ORDERS.push(genOrder());renderOrders();} },9000);
  renderOrders(); updateHud(); markPairs(); save();
}
function renderOrders(){ const box=$('#olist'); if(!box)return; box.innerHTML='';
  const wk=S.theme==='work';
  ORDERS.forEach(o=>{ const el=document.createElement('div'); el.className='ocard'; el.dataset.id=o.id;
    const AVA=wk?['boss','client','knight']:['guest','bunny','bear'];
    const head='<div class="ohead"><span class="oava">'+ic(AVA[o.ai%3])+'</span><span class="onm">'+(wk?'甲方 #':'顾客 #')+o.id+
      '</span><span class="ox" data-x="'+o.id+'">×</span></div>';
    const items='<div class="oitems">'+o.items.map(it=>{
      const have=countTier(it.t), ok=have>=it.n;
      return '<span class="oi'+(ok?' ok':'')+'">'+ic(itIc(it.t))+'<b>×'+it.n+'</b></span>'; }).join('')+'</div>';
    const left=Math.max(0,o.dur-(Date.now()-o.t0)), pct=left/o.dur*100;
    const timer='<div class="otimer'+(pct<25?' low':'')+'"><i style="width:'+pct+'%"></i></div>';
    const ready=orderReady(o);
    const go='<span class="ogo'+(ready?'':' off')+'" data-go="'+o.id+'">'+(wk?(ready?'提交需求':'还差货'):(ready?'交付订单':'还缺货'))+'</span>';
    el.innerHTML=head+items+timer+go; box.appendChild(el); });
}
function orderTick(){ if(!$('#s-game').classList.contains('on'))return;
  const now=Date.now(); let expired=false;
  ORDERS=ORDERS.filter(o=>{ if(now-o.t0>o.dur){expired=true;return false;} return true; });
  if(expired){ toast(S.theme==='work'?'甲方等不及走了…':'顾客等不及走了…');
    setTimeout(()=>{ if(ORDERS.length<3){ORDERS.push(genOrder());renderOrders();} },6000); }
  // 只更新进度条与按钮态，不重建卡片（省 layout）
  document.querySelectorAll('.ocard').forEach(el=>{ const o=ORDERS.find(x=>x.id===+el.dataset.id); if(!o)return;

    ['free','<b>终极目标</b>：一路卷到 Lv12「财务自由」。<b>买空内卷中心 + 手握 100 万薪</b>即可<b>跳槽</b>，攒履历当合伙人。'],
  ]:[
    ['merge','<b>拖拽合成</b>：把一个甜品拖到<b>相同</b>的甜品上，合成更高级的甜品。会呼吸发光的就是一对。'],
    ['tap','<b>点击出售</b>：点一下甜品就卖掉换金币（高级甜品会先跟你确认一下）。'],
    ['clip','<b>客户点单</b>：右侧顾客限时下单，凑齐货<b>交付订单</b>拿 1.8 倍金币。等太久顾客会走哦。'],
    ['cart','<b>升级店铺</b>：金币花在商店里——领猫猫、扩建货架、雇自动合成管家。'],
    ['catA','<b>猫猫打工</b>：猫猫每隔几秒自动掉一颗奶糖。关掉页面它们也继续营业，回来领离线收益。'],
    ['free','<b>终极目标</b>：一路合成到 Lv12「太阳棉花糖」。<b>买空商店 + 手握 100 万币</b>即可<b>毕业转生</b>，换永久星星。'],
  ];
  $('#help-rows').innerHTML=rows.map(r=>'<div class="row"><span class="ic">'+ic(r[0])+'</span><span>'+r[1]+'</span></div>').join(''); }
function applyTheme(){ const wk=S.theme==='work';
  document.body.style.background=wk?'linear-gradient(160deg,#eaf1f8,#f4f0e8 55%,#e8eef5)':'linear-gradient(160deg,#ffe9f0,#fff6e8 55%,#eaf6ff)';
  $('#s-title').classList.toggle('work',wk);
  $('#tt-name').textContent=wk?'职场喵喵':'猫猫甜品铺';
  $('#tt-sub').textContent=TT('sub');
  $('#btn-start').textContent=wk?(had?'继 续 上 班':'上 班 啦'):(had?'继 续 营 业':'开 店 啦');
  $('#tt-howto').innerHTML=wk
    ?'你要做的只有三件事：<br><b style="color:#4a6fa5">卷</b> 相同产出合成升级 · <b style="color:#4a6fa5">点</b> 交付产出赚薪资 · <b style="color:#4a6fa5">升</b> 职加薪让打工喵更快'
    :'你要做的只有三件事：<br><b style="color:#e2648f">拖</b> 相同甜品合成升级 · <b style="color:#e2648f">点</b> 甜品出售赚金币 · <b style="color:#e2648f">买</b> 升级让猫猫打工更快';
  $('#mode-shop').classList.toggle('on',!wk); $('#mode-work').classList.toggle('on',wk);
  $('#tt-cat').innerHTML=ic(wk?'catB':'catA');
  $('#deco-a').innerHTML=ic(wk?'note':ITEMS[0].e); $('#deco-b').innerHTML=ic(wk?'ppt':ITEMS[2].e);
  $('#deco-c').innerHTML=ic(wk?'report':ITEMS[5].e); $('#deco-d').innerHTML=ic(wk?'free':ITEMS[7].e);
  $('#qt').textContent=TT('quest'); $('#btn-quest').title=TT('quest');
  $('#ohead-tip').textContent=wk?'甲方需求':'客户点单';
  $('#btn-theme').innerHTML=ic(wk?'catA':'brief'); $('#btn-theme').title=wk?'回甜品铺':'去上班';
  $('#btn-shop').title=TT('shop');
  $('#tt-foot').textContent=wk?'纯离线单机 · 手绘矢量画面 · 关掉页面打工喵们也会继续加班':'纯离线单机 · 手绘矢量画面 · 关掉页面猫猫们也会继续营业';
  renderHelp(); renderBoard(); renderCats(); updateHud(); renderQuests(); renderOrders();
  if(S.stars>0){ const tr=$('#tt-rank'); tr.style.display='inline-block';
    tr.innerHTML='段位：'+rankOf()+' · '+S.stars+(wk?' 份履历':' 星')+'（全局 +'+Math.round((globalMult()-1)*100)+'%）'+(isFree()?(wk?' · 财务自由':' · 自由模式'):''); }
  save(); }
function setTheme(t){ if(S.theme===t)return; S.theme=t;
  toast(t==='work'?'滴——打卡成功。欢迎来到职场喵喵！':'下班！回甜品铺吃点甜的～',true);
  applyTheme(); }
$('#mode-shop').onclick=()=>setTheme('shop');
$('#mode-work').onclick=()=>setTheme('work');
$('#btn-theme').onclick=()=>setTheme(S.theme==='work'?'shop':'work');

/* ================= 静态图标注入 ================= */
$('#chip-coin').innerHTML=ic('coin');
$('#chip-star').innerHTML=ic('lstar');
$('#btn-quest').innerHTML=ic('clip');
$('#btn-ach').innerHTML=ic('medal');
$('#btn-help').innerHTML=ic('help');
$('#btn-shop').innerHTML=ic('cart');
$('#btn-sound').innerHTML=ic(S.muted?'mute':'snd');
$('#btn-home').innerHTML=ic('home');

/* 读档 */
const had=load();
rollQuests();
achCheck(); renderAchBadge();
applyTheme();
if(had){ setTimeout(()=>toast(S.theme==='work'?'欢迎回来！打工喵们一直在等你喵～':'欢迎回来！猫猫们一直在等你喵～'),300); }

/* ================= QA 钩子（截图验收用） ================= */
(function(){ const h=location.hash;
  const skipIntro=()=>{ S.stats.merges=3; S.stats.sells=2; S.shopped=true; };
  if(h==='#qa=shop'){ skipIntro(); startGame(); S.coins=12345; S.cats=3; S.slots=18; renderBoard(); renderCats(); updateHud(); renderShop(); $('#shop').classList.add('on'); }
  else if(h==='#qa=mid'){ skipIntro(); startGame(); S.coins=888; S.cats=2;
    [0,0,1,1,2,3,3,2,4,4,5,5].forEach((t,i)=>S.grid[i]=t); renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=rain'){ skipIntro(); startGame(); S.coins=99999; S.cats=4; S.slots=24;
    [8,7,7,6,6,5,5,4,4,3,3,2].forEach((t,i)=>S.grid[i]=t); renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=quest'){ skipIntro(); startGame();
    Q.list[0].cur=5; Q.list[1].cur=15; Q.claimed.s=true; renderQuests(); toggleQuests(); }
  else if(h==='#qa=ach'){ skipIntro(); startGame(); S.stars=3; S.reborn=1;
    ['m1','m5','m9','c10','e10k','k6','b5','r1','s100'].forEach(id=>S.achs[id]=true);
    achCheck(); updateHud(); renderAch(); $('#ach').classList.add('on'); }
  else if(h==='#qa=reborn'){ skipIntro(); startGame();
    Object.assign(S,{cats:6,spd:10,slots:24,sell:10,auto:5,clerk:5,train:10,coins:1000000,reborn:0,stars:0});
    renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=rebtn2'){ skipIntro(); startGame();
    Object.assign(S,{cats:6,spd:10,slots:24,sell:10,auto:5,clerk:5,train:10,coins:3500000,reborn:2,stars:2});
    renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=free'){ skipIntro(); startGame();
    Object.assign(S,{cats:6,spd:10,slots:24,sell:10,auto:5,clerk:5,train:10,coins:5000000,reborn:5,stars:5,
      achs:{r1:1,r3:1,free:1,m9:1}});
    renderBoard(); renderCats(); updateHud();
    const tr=$('#tt-rank'); tr.style.display='inline-block';
    tr.innerHTML='段位：'+rankOf()+' · '+S.stars+' 星（全局 +'+Math.round((globalMult()-1)*100)+'%）· 自由模式'; }
  else if(h==='#qa=lv12'){ skipIntro(); startGame(); S.coins=9999999; S.cats=6; S.slots=24;
    [11,10,10,9,9,8,8,7,7,6,6,5].forEach((t,i)=>S.grid[i]=t); renderBoard(); renderCats(); updateHud(); }
  else if(h.startsWith('#qa=l')){ skipIntro(); startGame(); }
  else if(h==='#qa=help'){ skipIntro(); startGame(); $('#help').classList.add('on'); }
  else if(h==='#qa=work'){ S.theme='work'; applyTheme(); }
  else if(h==='#qa=workmid'){ S.theme='work'; applyTheme(); skipIntro(); startGame(); S.coins=8880000; S.cats=3;
    [0,0,1,1,2,3,3,2,4,4,5,5].forEach((t,i)=>S.grid[i]=t); renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=workshop'){ S.theme='work'; skipIntro(); startGame(); S.coins=1234567; S.cats=3; S.slots=18; S.auto=2; S.clerk=1;
    renderBoard(); renderCats(); updateHud(); renderShop(); $('#shop').classList.add('on'); }
  else if(h==='#qa=orders'){ skipIntro(); startGame(); S.coins=50000; S.stats.best=8;
    ORDERS=[{id:1,ai:0,items:[{t:7,n:2},{t:8,n:1}],t0:Date.now(),dur:120000,reward:1400},
            {id:2,ai:1,items:[{t:5,n:1}],t0:Date.now(),dur:30000,reward:300},
            {id:3,ai:2,items:[{t:6,n:2},{t:2,n:1}],t0:Date.now(),dur:150000,reward:800}];
    [7,7,8,5,5,2,6,6].forEach((t,i)=>S.grid[i]=t); renderBoard(); renderOrders(); updateHud(); }
  else if(h==='#qa=ordtest'){ skipIntro(); startGame();
    let pass=0,fail=[];
    // 1) 订单生成：数量、字段完整
    ORDERS=[]; fillOrders();
    if(ORDERS.length===3&&ORDERS.every(o=>o.items.length&&o.reward>0&&o.dur>=90000))pass++; else fail.push('gen');
    // 2) 摆满货后 orderReady + 交付扣货加钱
    const o=ORDERS[0]; for(let i=0;i<24;i++)S.grid[i]=null;
    o.items.forEach(it=>{let n=it.n;for(let i=0;i<24&&n>0;i++){if(S.grid[i]==null){S.grid[i]=it.t;n--;}}});
    if(orderReady(o))pass++; else fail.push('ready');
    const c0=S.coins,s0=S.stats.sells,rw=o.reward;
    deliverOrder(o);
    if(S.coins===c0+rw&&!ORDERS.includes(o))pass++; else fail.push('deliver');
    // 3) 过期剔除
    ORDERS=[{id:99,ai:0,items:[{t:1,n:1}],t0:Date.now()-999999,dur:1000,reward:10}];
    orderTick(); if(ORDERS.length===0)pass++; else fail.push('expire');
    // 4) 高级偏斜：best=8 时 200 单里 t>=5 的需求占比应 >30%
    S.stats.best=8; let hi=0,tot=0; for(let k=0;k<200;k++){const oo=genOrder(); oo.items.forEach(it=>{tot++;if(it.t>=5)hi++;});}
    if(hi/tot>0.3)pass++; else fail.push('tier '+hi+'/'+tot);
    // 5) 库存驱动 + 转生保底
    S.stats.best=0; S.reborn=0; for(let i=0;i<24;i++)S.grid[i]=null; S.grid[0]=9;
    let seenHi=0; for(let k=0;k<100;k++){const oo=genOrder(); if(oo.items.some(it=>it.t>=8))seenHi++;}
    let floorHi=0; S.grid[0]=null; S.reborn=3;
    for(let k=0;k<100;k++){const oo=genOrder(); if(oo.items.some(it=>it.t>=5))floorHi++;}
    S.reborn=0;
    if(seenHi>=40&&floorHi>=60)pass++; else fail.push('inv '+seenHi+' floor '+floorHi);
    document.title=(fail.length?'QA-FAIL ':'QA-PASS ')+pass+'/6 '+fail.join('|');
  }
  else if(h==='#qa=worktop'){ S.theme='work'; applyTheme(); skipIntro(); startGame(); S.coins=4200000; S.stars=2; S.reborn=2;
    Object.assign(S,{cats:6,spd:10,slots:24,sell:10,auto:5,clerk:5,train:10});
    renderBoard(); renderCats(); updateHud(); }
  else if(h==='#qa=selftest'){ skipIntro(); startGame();
    let pass=0,fail=[];
    // 售货员：5×Lv1 + 3×Lv3，clerk=2 → 每级留 2 个，预算 3，先卖贵的 Lv3
    for(let i=0;i<24;i++)S.grid[i]=null;
    S.slots=8; S.clerk=2; S.coins=0; const s0=S.stats.sells;
    [0,0,0,0,0,2,2,2].forEach((t,i)=>S.grid[i]=t); renderBoard();
    const sold=clerkRun();
    const c1=S.grid.filter(t=>t===0).length, c2=S.grid.filter(t=>t===2).length;
    if(sold===3&&c1===3&&c2===2&&S.stats.sells===s0+3&&S.coins>0)pass++; else fail.push('clerk sold='+sold+' c1='+c1+' c2='+c2);
    // 培训：train=10 → 约 70% 概率出高级（2000 次，1100~1500 为合理区间）
    S.train=10; let hi=0; for(let k=0;k<2000;k++)if(dropTier()>0)hi++;
    if(hi>1100&&hi<1500)pass++; else fail.push('train hi='+hi);
    // 未培训：永远只出 Lv1
    S.train=0; let bad=0; for(let k=0;k<500;k++)if(dropTier()>0)bad++;
    if(bad===0)pass++; else fail.push('train0 bad='+bad);
    document.title=(fail.length?'QA-FAIL ':'QA-PASS ')+pass+'/3 '+(fail.join('|'));
  }
})();
</script>
