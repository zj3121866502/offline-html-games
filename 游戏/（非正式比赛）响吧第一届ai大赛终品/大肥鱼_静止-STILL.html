<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>静止</title>

<!--
  ═══════════════════════════════════════════════════════════════
   这次藏东西的地方少了。因为上次本末倒置了。

   只留两条：
     ① 按  ↑↑↓↓←→←→BA
     ② 活着的时候，在场上打一个「猫」字

   还有一条不算彩蛋的，是这个游戏真正想说的话：

     它们全都醒着，每一个都比你快 —— 除非你空着手。
     鼠标划出的那个圈，是你能施加影响的全部范围。
     圈里的会被钉住、被烧掉。
     可你每攥住一个，圈就小一圈，你也慢一分。
     你攥住的东西越多，你能攥住的越少。

     第十二章叫「放手」。
     那一章的门，只在你什么都没攥着的时候开。
     你得一路空着手走过去 —— 而那是你唯一跑得过它们的时候。

     这不是一条规则，这是一个隐喻。
  ═══════════════════════════════════════════════════════════════
-->

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#04060b;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center}
  #game{display:block;cursor:default;touch-action:none;border-radius:8px;
    box-shadow:0 24px 90px rgba(0,0,0,.9),0 0 0 1px rgba(120,200,255,.09)}
  #veil{position:fixed;inset:0;background:#04060b;z-index:9;display:flex;
    align-items:center;justify-content:center;color:#2b3550;font-size:13px;
    letter-spacing:.5em;transition:opacity .45s;pointer-events:none}
  #veil.gone{opacity:0}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="veil">静 止</div>

<script>
(function () {
  'use strict';

  // ══════════════════════════════════════════════════════════════
  //  0 · 常量
  // ══════════════════════════════════════════════════════════════
  var W = 960, H = 600;
  var FLOOR = 544, CEIL = 40;
  var GRAV = 0.78, MOVE = 4.9, JUMP = 14.2, MAXFALL = 19;
  var COYOTE = 7, BUFFER = 8, FRIC = 0.70;

  var R_BASE = 124;                  // 时间场基础半径
  var R_SHRINK = 0.085;              // 每钉住一个，半径缩这么多
  var R_FLOOR = 0.45;                // 最多缩到基础的 45%
  var R_LERP = 0.20;
  var FIELD_DMG_EVERY = 11;          // 被钉住的敌人每 11 帧掉 1 血
  var PULSE_CD = 78, PULSE_KNOCK = 13.5;   // PULSE_CD 只作默认值，实际以 WEAPONS[].cd 为准

  var PW = 18, PH = 26;
  var MAX_HP = 3, INVULN = 46;

  var STATUE_LIFE = 60 * 16;         // 石头 16 秒后风化（只为控制场面，不影响通关判定）
  var MAX_STATUE = 40;               // 场上石头上限，超了最老的先碎

  var PAL = {
    bg0: '#060a14', bg1: '#0d1526',
    wall: '#1a2338', wallTop: '#2e3d5e',
    ink: '#eaf2ff', dim: '#7f8fb4', faint: '#4a5876',
    cy: '#4fe3ff', mint: '#43f5b0', gold: '#ffd166', pink: '#ff5d84',
    violet: '#a98bff', orange: '#ff9d4d', red: '#ff4d5e',
    stone: '#39425c', stoneDark: '#252c42', stoneRim: '#6b7aa8'
  };

  // ══════════════════════════════════════════════════════════════
  //  1 · 工具
  // ══════════════════════════════════════════════════════════════
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
  function hsl(h, s, l, a) { return 'hsla(' + h + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')'; }
  function aabb(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function ovX(a, b) { return Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x); }
  function ovY(a, b) { return Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y); }
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w * .5, h * .5);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y); c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r); c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h); c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r); c.arcTo(x, y, x + r, y, r);
    c.closePath();
  }
  // 按可用宽度裁字（中文按 1em、西文按 0.55em 估），宁短不溢
  function fitText(s, maxW, size) {
    var w = 0, out = '';
    for (var i = 0; i < s.length; i++) {
      var cw = size * (s.charCodeAt(i) < 256 ? 0.55 : 1.0);
      if (w + cw > maxW) return out + '…';
      w += cw; out += s[i];
    }
    return out;
  }
  // ctx.font 每帧会被赋值几十次，而带 fallback 的中文字体串每次都要重新解析 —— 缓存住。
  // 注意：ctx.restore() 会把 font 回滚，所以 restore 时必须让缓存失效（见 boot）。
  var _fontCache = '';
  function txt(c, s, x, y, o) {
    o = o || {};
    var f = (o.w || '700') + ' ' + (o.s || 13) + 'px "Microsoft YaHei","PingFang SC",system-ui,sans-serif';
    if (f !== _fontCache) { c.font = f; _fontCache = f; }
    c.textAlign = o.a || 'left'; c.textBaseline = o.b || 'middle';
    if (o.glow) { c.shadowColor = o.glow; c.shadowBlur = o.blur || 10; }
    c.fillStyle = o.c || PAL.ink;
    c.fillText(s, x, y);
    c.shadowBlur = 0;
  }

  // ══════════════════════════════════════════════════════════════
  //  2 · 音频总线（音效与音乐共用同一个 context）
  // ══════════════════════════════════════════════════════════════
  var Audio = (function () {
    var ac = null, dead = false;
    function ctx() {
      if (ac) return ac;
      if (dead) return null;
      try {
        var A = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
        if (!A) { dead = true; return null; }
        ac = new A();
      } catch (e) { dead = true; ac = null; }
      return ac;
    }
    return {
      ctx: ctx,
      wake: function () {
        var c = ctx();
        if (c && c.state === 'suspended' && c.resume) { try { c.resume(); } catch (e) {} }
        return c;
      }
    };
  })();

  // ══════════════════════════════════════════════════════════════
  //  2b · 音效
  // ══════════════════════════════════════════════════════════════
  var Sound = (function () {
    var on = true;
    function t(f, d, ty, v, slide) {
      if (!on) return;
      var c = Audio.wake(); if (!c) return;
      try {
        var o = c.createOscillator(), g = c.createGain();
        o.type = ty || 'square';
        o.frequency.setValueAtTime(f, c.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(28, slide), c.currentTime + d);
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(v || .05, c.currentTime + .008);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + d + .02);
      } catch (e) {}
    }
    return {
      on: function () { return on; },
      toggle: function () { on = !on; return on; },
      jump: function () { t(400, .1, 'square', .04, 620); },
      land: function () { t(140, .06, 'sine', .045, 80); },
      freeze: function () { t(760, .09, 'sine', .03, 300); },
      thaw: function () { t(300, .07, 'sine', .025, 700); },
      hurt: function () { t(220, .22, 'sawtooth', .07, 60); },
      kill: function () { t(180, .14, 'square', .05, 90); },
      pulse: function () { t(90, .3, 'sawtooth', .08, 700); },
      tick: function () { t(1180, .035, 'square', .035); },
      pick: function () { t(880, .09, 'triangle', .06, 1320); },
      wave: function () { [440, 587, 740].forEach(function (f, i) { setTimeout(function () { t(f, .18, 'triangle', .05); }, i * 95); }); },
      over: function () { [400, 320, 240, 160].forEach(function (f, i) { setTimeout(function () { t(f, .3, 'sawtooth', .06); }, i * 150); }); },
      secret: function () { [660, 990, 1320].forEach(function (f, i) { setTimeout(function () { t(f, .15, 'triangle', .05); }, i * 80); }); },
      ui: function () { t(620, .04, 'sine', .03); }
    };
  })();

  // ══════════════════════════════════════════════════════════════
  //  2c · 程序化音乐
  //      整条音乐挂在一个低通滤波器上，截止频率跟着「攥住数量」走。
  //      攥得越多，世界越闷；松手，声音才重新打开。
  //      —— 这是机制的声音化身，不是背景装饰。
  // ══════════════════════════════════════════════════════════════
  var Music = (function () {
    var bus = null, filt = null, timer = null, step = 0, nextT = 0;
    var started = false, lastHold = 0;
    var BASE = 57;                                   // A3
    // i - VII - VI - V：下行哀歌低音，克制、下沉
    var PROG = [[0, 3, 7], [-2, 2, 5], [-4, 0, 3], [-5, -1, 2]];
    function mf(s) { return 440 * Math.pow(2, (s - 69) / 12); }

    function ensure() {
      var c = Audio.ctx(); if (!c) return false;
      if (bus) return true;
      try {
        bus = c.createGain(); bus.gain.value = 0.0001;
        filt = c.createBiquadFilter();
        filt.type = 'lowpass'; filt.Q.value = 0.85;
        filt.frequency.value = 2400;
        bus.connect(filt); filt.connect(c.destination);
        bus.gain.setValueAtTime(0.0001, c.currentTime);
        bus.gain.linearRampToValueAtTime(0.24, c.currentTime + 2.2);
        nextT = c.currentTime + 0.12;
      } catch (e) { bus = null; filt = null; return false; }
      return true;
    }
    function pad(f, t, dur, vol) {
      var c = Audio.ctx(); if (!c || !bus) return;
      try {
        var o = c.createOscillator(), g = c.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + dur * .35);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .05);
      } catch (e) {}
    }
    function pluck(f, t, vol) {
      var c = Audio.ctx(); if (!c || !bus) return;
      try {
        var o = c.createOscillator(), g = c.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + .38);
        o.connect(g); g.connect(bus); o.start(t); o.stop(t + .42);
      } catch (e) {}
    }
    function play(st, t) {
      var bar = Math.floor(st / 16) % 4, pos = st % 16, ch = PROG[bar];
      if (pos === 0) {
        for (var i = 0; i < ch.length; i++) pad(mf(BASE + ch[i] - 12), t, 2.9, .042);
        pad(mf(BASE + ch[0] - 24), t, 3.2, .075);          // 低音
      }
      if (pos === 2 || pos === 6) pluck(mf(BASE + ch[pos === 2 ? 0 : 2] + 12), t, .05);
      if (pos === 11) pluck(mf(BASE + ch[1] + 24), t, .032);
    }
    function schedule() {
      var c = Audio.ctx(); if (!c || !bus) return;
      if (!Sound.on()) { nextT = c.currentTime + .12; return; }
      var eighth = 60 / 74 / 2;
      var guard = 0;
      while (nextT < c.currentTime + .5 && guard++ < 32) {
        play(step, nextT);
        step = (step + 1) % 64;
        nextT += eighth;
      }
      if (nextT < c.currentTime) nextT = c.currentTime + .05;
    }
    return {
      start: function () {
        if (started || !ensure()) return;
        started = true;
        schedule();
        timer = setInterval(schedule, 180);
      },
      stop: function () { if (timer) { clearInterval(timer); timer = null; } started = false; },
      // hold: 当前攥住的数量。0 表示空手 —— 声音最开阔
      update: function (hold) {
        if (hold === lastHold) return;
        lastHold = hold;
        if (!filt) return;
        var c = Audio.ctx(); if (!c) return;
        var t01 = Math.min(1, hold / 6);
        var cut = 2600 * Math.pow(0.15, t01);            // 2600Hz → 390Hz
        try { filt.frequency.setTargetAtTime(cut, c.currentTime, 0.32); }
        catch (e) { filt.frequency.value = cut; }
      },
      level: function () { return lastHold; }
    };
  })();

  // ══════════════════════════════════════════════════════════════
  //  3 · 存档
  // ══════════════════════════════════════════════════════════════
  var Save = (function () {
    var K = 'still.save.v1', mem = null;
    function read() {
      if (mem) return mem;
      mem = { unlocked: 1, bestKill: 0, ach: [], plays: 0, totalKill: 0,
              reachedFinale: false, cleared: false, deaths: 0, coins: 0, owned: [], tut: 0 };
      try {
        var r = window.localStorage.getItem(K);
        if (r) { var p = JSON.parse(r); if (p && typeof p === 'object') for (var k in mem) if (p[k] !== undefined) mem[k] = p[k]; }
      } catch (e) {}
      // mem：unlocked 已解锁章数 · ach 成就 · plays 开局次数 · totalKill 累计击杀
      //      reachedFinale 到过终章 · cleared 通关 · bestKill 单章最高击杀
      return mem;
    }
    // localStorage 是【同步写盘】。原来每杀一只怪就写一次 ——
    // 无尽模式里十只怪同时死，就是几帧之内十次同步磁盘写入，
    // 在低配机上正是一次肉眼可见的卡顿。
    // 现在改成「先记着，过一会儿再落盘」：金币晚 1.5 秒存不会有人发现，卡顿会。
    var pending = 0;
    function flush() { pending = 0; try { window.localStorage.setItem(K, JSON.stringify(mem)); } catch (e) {} }
    function later() { pending = 90; }
    function tick() { if (pending > 0 && --pending === 0) flush(); }
    return { get: read, flush: flush, later: later, tick: tick };
  })();

  // ══════════════════════════════════════════════════════════════
  //  4 · 成就
  // ══════════════════════════════════════════════════════════════
  // 章数会变（9 → 12 就把界面上三处「九章」全写死了）。以后一律用它算。
  var CN_D = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  function cnNum(n) {
    if (n <= 10) return CN_D[n];
    if (n < 20) return '十' + CN_D[n - 10];
    var t = Math.floor(n / 10), o = n % 10;
    return CN_D[t] + '十' + (o ? CN_D[o] : '');
  }
  var ACHS = [
    { id: 'first',  n: '第一次结冰', d: '钉住你的第一个敌人' },
    { id: 'wall8',  n: '一堵墙',     d: '同一时刻钉住 8 个' },
    { id: 'squeeze',n: '攥紧',       d: '把时间场压到最小还活着' },
    { id: 'spike',  n: '硬碰硬',     d: '用脉冲砸碎一个「不化」' },
    { id: 'pulse4', n: '一锅端',     d: '一次脉冲干掉 4 个' },
    { id: 'ch5',    n: '过半',       d: '走到第 6 章' },
    { id: 'ch9',    n: '到最后',     d: '走到第 12 章' },
    { id: 'ending', n: '空着手',     d: '在终章走出那扇门' },
    { id: 'boss',   n: '它闭眼了',   d: '砸碎那只眼睛' },
    { id: 'nohold', n: '一次都没攥', d: '终章全程一次都没攥住东西' },
    { id: 'k100',   n: '一百条命',   d: '累计击杀 100 个' },
    { id: 'cat',    n: '猫',         d: '时间场里跑过去一只猫' },
    { id: 'konami', n: '上上下下',   d: '你懂的' },
    { id: 'full',   n: '全成就',     d: '以上全部点亮' }
  ];
  var ACH = {};
  (function () { var s = Save.get(); for (var i = 0; i < ACHS.length; i++) ACH[ACHS[i].id] = s.ach.indexOf(ACHS[i].id) >= 0; })();
  var achQ = [];
  function unlock(id) {
    if (ACH[id]) return false;
    ACH[id] = true;
    var s = Save.get();
    if (s.ach.indexOf(id) < 0) s.ach.push(id);
    Save.flush();
    var d = null;
    for (var i = 0; i < ACHS.length; i++) if (ACHS[i].id === id) d = ACHS[i];
    if (d) achQ.push({ t: 0, n: d.n, d: d.d });
    Sound.secret();
    if (id !== 'full') {
      var all = true;
      for (var j = 0; j < ACHS.length; j++) if (ACHS[j].id !== 'full' && !ACH[ACHS[j].id]) { all = false; break; }
      if (all) setTimeout(function () { unlock('full'); }, 800);
    }
    return true;
  }
  function achCount() { var c = 0; for (var i = 0; i < ACHS.length; i++) if (ACH[ACHS[i].id]) c++; return c; }

  var Eggs = {
    rainbow: false, cat: null, konamiBuf: [], typed: '',
    glitch: 0, msg: null, msgT: 0
  };
  var KONAMI = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];

  // ══════════════════════════════════════════════════════════════
  //  5 · 敌人类型
  //  —— 所有敌人都是矩形：冻住之后要能站上去
  // ══════════════════════════════════════════════════════════════
  // 速度全部高于玩家（4.9）—— 打不过就跑不掉，只能打。
  // 这才是一场赛跑：在它咬到你之前把它烧死。
  var TYPES = {
    crawler: { hp: 3, w: 28, h: 26, sp: 5.30, fly: false, hue: 12,  cost: 1, nm: '爬虫' },
    floater: { hp: 2, w: 26, h: 26, sp: 4.70, fly: true,  hue: 275, cost: 1, nm: '飘浮' },
    charger: { hp: 5, w: 36, h: 32, sp: 2.45, fly: false, hue: 40,  cost: 3, nm: '冲撞' },
    shooter: { hp: 3, w: 26, h: 26, sp: 3.10, fly: true,  hue: 330, cost: 2, nm: '射手', shoot: 104 },
    // 「不化」钉不住也烧不掉，只能吃脉冲；比你慢，但永远不会停
    spike:   { hp: 6, w: 28, h: 28, sp: 2.35, fly: false, hue: 0, cost: 4, nm: '不化', noFreeze: true },
    // 第 13 章那只巨物的眼睛。做成敌人是有意的 —— 这样「圈能钉住它、能烧它、
    // 脉冲能砸它」全部自动成立，一行特殊判定都不用写。
    // hp 就是 boss 的血量；收回去的那些时间里它是无敌的（e.shield）。
    core:    { hp: 72, w: 58, h: 58, sp: 0, fly: true, hue: 350, cost: 0, nm: '弱核', boss: true }
  };
  var BULLET_SP = 7.0;

  // ══════════════════════════════════════════════════════════════
  //  武器
  // ══════════════════════════════════════════════════════════════
  // 每把武器改的是同一组东西：圈多大、灼烧多快、脉冲多狠、能不能钉「不化」。
  // 「不化」默认钉不住（它的存在意义就是逼你换手段）—— 狙击镜是唯一能按住它的东西。
  // 三个开关各管一件事，别混：
  //   canHold    能不能攥住（攥住才会让圈缩小、让你变慢）
  //   burnField  圈里烧不烧
  //   spikeKill  这把武器的脉冲砸不砸得动「不化」（「不化」只吃脉冲，灼烧一律无效）
  // 「不化」6 血：时间场 pdmg 3 → 两下，狙击镜 pdmg 9 → 一下，撒手砸不动。
  //
  // 狙击镜是纯脉冲武器：不攥、不烧，圈就是脉冲的范围，所见即所得。
  var WEAPONS = [
    { id: 'field', n: '时间场', price: 0,
      d: '标准圈，范围最舒服。脉冲砸两下能碎一个「不化」。',

  // 击杀是这游戏里唯一必须「攥住」的动作，也就是唯一要付代价的动作。
  // 让它有概率掉东西，「打」和「跑」才真的成为一个选择 ——
  // 不然空手跑得最快、还不用冒险，跑永远更划算。
  //
  // 喘息最稀有：它是唯一能让你「攥住不用付代价」的东西，给多了规则就废了。
  var DROP_CHANCE = .17;
  function rollDrop(x, y) {
    var C = CHAPTER();
    var bossCh = !!(C && C.win === 'boss');
    // 打 boss 的时候护盾最值钱（它替你挡一次弹幕），所以那一章掉得多、而且几乎只掉它
    var chance = bossCh ? .45 : DROP_CHANCE;
    if (Math.random() >= chance) return;
    var r = Math.random();
    var t = bossCh ? (r < .82 ? 'shield' : 'pulse')
                   : (r < .44 ? 'shield' : (r < .84 ? 'pulse' : 'breathe'));
    S.items.push({ t: t, x: x, y: y, got: false, ph: 0, drop: true, vy: -3.2, cool: 18, landed: false });
    var def = ITEMS[t];
    S.floats.push({ s: def.n, x: x, y: y - 20, t: 46, c: def.c });

  // 掉出来的会先弹一下再落地。落点算上跳台 —— 高处的敌人掉的东西落在台上，是合理的奖励。
  function updateItems() {
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      if (!it.drop || it.got) continue;
      if (it.cool > 0) it.cool--;
      if (it.landed) continue;
      var prevY = it.y;
      it.vy = Math.min(it.vy + GRAV * .5, 8);
      it.y += it.vy;
      if (it.vy <= 0) continue;
      var boxes = solidBoxes();
      for (var b = 0; b < boxes.length; b++) {
        var bx = boxes[b];
        if (it.x < bx.x || it.x > bx.x + bx.w) continue;
        if (prevY <= bx.y && it.y >= bx.y) { it.y = bx.y - 13; it.landed = true; it.vy = 0; break; }
      }
      if (it.y > H + 40) { it.y = FLOOR - 13; it.landed = true; it.vy = 0; }
    }
  }

  function tutStage() { return Save.get().tut || 0; }

      // 可能「刚学会怎么杀」就被立刻收走，玩家一眼都没看清
      if (n === 2) S.tutT = 0;
      Save.flush();
    }
  }

  // ── 第 13 章那只巨物 ──
  // 设计要点：它本体一直在背景里，圈够不着。**只有眼睛落进场内的那几秒你才伤得到它。**
  // 于是每个窗口都逼你在同一时刻做同一个老决策：圈是继续压着小怪，还是挪过去按住眼睛？
  // 挪过去，小怪就活了 —— 这就是主题在 boss 战里的重演。
  var CORE_ANCHORS = [[215, 352], [480, 288], [745, 352]];   // 左台 / 中台 / 右台 上方

  function updateBoss() {
    var b = S.boss, core = S.bossCore;
    if (!b || b.dead || !core) return;
    b.t++;
    if (b.flash > 0) b.flash--;
    b.phase = b.hp > b.maxhp * .66 ? 1 : (b.hp > b.maxhp * .33 ? 2 : 3);

    // 窗口节奏：越到后面落得越勤、停得越短
    if (b.up) {
      b.upT--;
      if (b.upT <= 0) { b.up = false; b.restT = b.phase === 3 ? 300 : 400; Sound.thaw(); }
    } else {
      b.restT--;
      if (b.restT <= 0) {
        b.up = true; b.upT = b.phase === 1 ? 300 : 250;
        var a = CORE_ANCHORS[Math.floor(Math.random() * CORE_ANCHORS.length)];
        b.tx = a[0]; b.ty = a[1];
        banner('它睁开了', PAL.red); Sound.wave();
      }
    }
    var gx = b.up ? b.tx : W / 2, gy = b.up ? b.ty : 146;
    b.cx = lerp(b.cx, gx, .10); b.cy = lerp(b.cy, gy, .10);
    core.x = b.cx - core.w / 2; core.y = b.cy - core.h / 2;
    core.shield = !b.up;                  // 收在本体里的时候打不动
    // 保险：眼睛是放在敌人数组里的，万一别处把数组清空了（比如通关定格），把它放回去
    if (S.enemies.indexOf(core) < 0 && !core.dead) S.enemies.push(core);
    b.hp = core.hp;   // 方向不能反：伤害是打在眼睛上的，boss 的血跟着眼睛走
    if (b.up) core.spawnFx = 0;

    // 扇形弹幕：从眼睛【当前的位置】射出来 —— 眼睛落进场内时最危险
    b.fireT--;
    if (b.fireT <= 0) {
      b.fireT = b.phase === 1 ? 152 : (b.phase === 2 ? 120 : 98);
      var n = b.phase === 1 ? 5 : (b.phase === 2 ? 7 : 9);
      var base = Math.atan2(S.ch.y + 13 - b.cy, S.ch.x + 9 - b.cx);
      for (var i = 0; i < n; i++) {
        var ang = base + (i - (n - 1) / 2) * .23;
        S.bullets.push({ x: b.cx, y: b.cy, vx: Math.cos(ang) * 4.4, vy: Math.sin(ang) * 4.4,
                         r: 6, live: true, life: 420, t: 0 });
      }
      Sound.pulse();
    }

    // 落石：先画一条预警柱，再砸
    b.rockT--;
    if (b.rockT <= 0) {
      b.rockT = b.phase === 1 ? 330 : (b.phase === 2 ? 255 : 195);
      S.warns.push({ x: 100 + Math.random() * (W - 200), t: 48, max: 48 });
    }
  }

  function updateWarns() {
    for (var i = S.warns.length - 1; i >= 0; i--) {

      w.t--;

        S.warns.splice(i, 1);
      }
    }
  }

  function bossDown() {
    var b = S.boss;

  // ── 无限：一波接一波 ──
  // 每波固定时长，到点就加码：种类变多、出怪变快、同屏变多。上限压在 11 只 ——
  // 不是要它「不可战胜」，是要它「迟早撑不住」。
  var WAVE_FRAMES = 900;                       // 15 秒一波
  var BREATH_FRAMES = 240;                     // 然后喘 4 秒 —— 不出新怪，但老怪还在
  var INF_POOL = ['crawler', 'floater', 'shooter', 'charger', 'spike'];
  function infSetupWave(w) {
    var C = CHAPTER();
    var n = Math.min(INF_POOL.length, 1 + Math.floor(w / 2));
    C.types = INF_POOL.slice(0, n);
    if (w >= 3) C.types = C.types.concat(['crawler']);     // 爬虫始终是主力
    C.gap = Math.max(32, 150 - (w - 1) * 9);
    C.maxAlive = Math.min(11, 3 + Math.floor(w / 2));
  }
  // 无限模式的 boss：每 5 波来一次，第 N 次出现时血量是基准的 N/8 ——
  // 1/8 → 2/8 → 3/8 …… 越往后越肉。
  // （原来每 15 波一次、按 N/4 涨。来得密了三倍，涨速就放慢三倍，两边抵消。）
  function spawnInfBoss(nth) {
    var hp = Math.max(5, Math.round(TYPES.core.hp * nth / 8));
    S.boss = { hp: hp, maxhp: hp, phase: 1, t: 0,
               up: false, upT: 0, restT: 150, cx: W / 2, cy: 146, tx: W / 2, ty: 146,
               fireT: 150, rockT: 320, dead: false, flash: 0 };
    S.bossCore = makeEnemy('core', W / 2 - 29, 146 - 29, S.chapter);
    S.bossCore.hp = hp; S.bossCore.maxhp = hp;
    S.bossCore.shield = true;
    S.enemies.push(S.bossCore);
    banner('它来了 · 第 ' + nth + ' 次', PAL.red);
    S.waveT = 99999;                 // boss 战期间不打波次
    S.breath = false;
    Sound.wave();
  }

  function updateWaves() {
    if (S.boss) return;              // boss 没死就不进下一波
    if (winKind() !== 'infinite' || S.chapterDone) return;
    S.waveT--;
    if (S.waveT > 0) return;
    // 喘息结束 → 下一波开始
    if (S.breath) {
      S.breath = false;
      S.wave++;
      S.waveT = WAVE_FRAMES;
      infSetupWave(S.wave);
      banner('第 ' + S.wave + ' 波', S.wave % 5 === 0 ? PAL.red : PAL.cy);
      Sound.wave();
      return;
    }
    // 一波打完 → 喘 4 秒。老怪不清，你能趁这时候把场子收干净。
    S.breath = true;
    S.waveT = BREATH_FRAMES;
    banner('喘口气', PAL.mint);
    Sound.tick();
    // 掉落：每 2 波回一颗心（满血就不掉，免得浪费），每 3 波一个护盾
    if (S.wave % 2 === 0 && S.hp < (S.maxHp || MAX_HP)) {
      S.items.push({ t: 'heart', x: S.ch.x + 9, y: S.ch.y - 10, got: false, ph: 0,
                     drop: true, vy: -3, cool: 24, landed: false });
      S.floats.push({ s: '心', x: S.ch.x + 9, y: S.ch.y - 40, t: 60, c: ITEMS.heart.c });
    }
    if (S.wave % 3 === 0) {
      S.items.push({ t: 'shield', x: W / 2, y: 200, got: false, ph: 0,
                     drop: true, vy: -3, cool: 24, landed: false });
      S.floats.push({ s: '第 ' + S.wave + ' 波 · 护盾', x: W / 2, y: 170, t: 60, c: PAL.gold });
    }
    // 每 5 波：它来一次
    if (S.wave % 5 === 0) spawnInfBoss(S.wave / 5);
  }

  // ── 工坊 ──
  // 这个游戏的一切都是数据表（章节就是一行对象），所以「做关卡」= 直接编辑那张表。
  // 做好的关能压成一段纯文本码，粘到聊天里就能传给下一个人 —— 不联网也能分享。
  //
  // 界面分两层：画布只放「用鼠标摆的东西」，所有「规矩」都收进一个面板。
  // 理由：一堆控件糊在顶上，就是当初把粉丝劝退的那种界面。
  var ITEM_ORDER = ['shield', 'pulse', 'breathe', 'heart'];
  var EDIT_TYPES = ['crawler', 'floater', 'shooter', 'charger', 'spike'];
  var TYPE_CN = { crawler: '爬虫', floater: '飘浮', shooter: '射手', charger: '冲撞', spike: '不化' };
  var MAX_MINE = 8;
  var WINS = [
    { k: 'kill',    n: '杀够数',  hint: '把这关的怪杀够 N 个就算过' },
    { k: 'survive', n: '撑够秒',  hint: '活够 N 秒就算过，杀不杀都行' },
    { k: 'reach',   n: '爬上旗',  hint: '在场地里放一面旗，爬到那儿就算过' }
  ];
  var TPLS = [
    { n: '空白',  plats: [], items: [] },
    { n: '阶梯',  plats: [[60, 470, 220, 18], [330, 400, 180, 18], [600, 330, 170, 18], [790, 250, 150, 18]],
                  items: [[1, 850, 225]] },
    { n: '双台',  plats: [[150, 440, 190, 18], [570, 350, 210, 18]], items: [[0, 675, 322]] }
  ];

  // 自制关不排章节号 —— 它是临时挂在章节表尾巴上的，顶着「第 16 章」的名不像话
  function chapNo() { return CHAPTER().__custom ? '试玩' : '第 ' + (S.chapter + 1) + ' 章'; }
  function chapLabel() {
    var C = CHAPTER();
    if (C.__custom) return C.n || '自制';
    if (C.infinite || C.workshop) return C.n;
    return '第 ' + (S.chapter + 1) + ' 章 · ' + C.n;
  }

  // ── 分享码 ──
  // 码画在 canvas 上是选不中的，而这个模块的命脉就是「把码发出去」。
  // 所以展示时在画布上盖一个真的 <textarea>，自动全选，再顺手试一次写剪贴板。
  var codeEl = null;
  function wrapCode(code, per) {
    var out = [], cur = '';
    for (var i = 0; i < code.length; i++) {
      cur += code.charAt(i);
      var c = code.charAt(i);
      if (cur.length >= per && (c === '|' || c === ';' || c === ',')) { out.push(cur); cur = ''; }
    }
    if (cur) out.push(cur);
    return out;                          // 拼起来跟原码一字节不差，只是换行给人看
  }
  function showCodeEl(code) {
    hideCodeEl();
    try {
      var ta = document.createElement('textarea');
      ta.value = code;
      ta.readOnly = true;
      ta.spellcheck = false;
      ta.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;' +
        'width:min(760px,80vw);height:64px;box-sizing:border-box;padding:10px 12px;' +
        'font:600 14px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.4px;text-align:center;' +
        'color:#9fefff;background:rgba(9,24,38,.97);border:1px solid rgba(79,227,255,.55);' +
        'border-radius:8px;resize:none;outline:none;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      codeEl = ta;
    } catch (e) {}
    try {
      var pr = navigator.clipboard && navigator.clipboard.writeText && navigator.clipboard.writeText(code);
      if (pr && pr.catch) pr.catch(function () {});   // file:// 下写剪贴板会被拒，无所谓，框里能选
    } catch (e) {}
  }
  function hideCodeEl() {
    try { if (codeEl && codeEl.parentNode) codeEl.parentNode.removeChild(codeEl); } catch (e) {}
    codeEl = null;
  }

  // ── 我的关卡 ──
  function mineList() {
    var sv = Save.get();
    if (typeof sv.mine === 'string') sv.mine = [{ n: '我的关卡', c: sv.mine }];  // 旧存档：一段码
    if (!sv.mine || !sv.mine.length || !sv.mine.push) sv.mine = [];
    return sv.mine;
  }
  function saveLevel(name) {
    var L = mineList(), code = editEncode(S.edit);
    for (var i = 0; i < L.length; i++) {
      if (L[i].n === name) { L[i].c = code; Save.flush(); return 'over'; }
    }
    if (L.length >= MAX_MINE) return 'full';
    L.push({ n: name, c: code });
    Save.flush();
    return 'ok';
  }
  function mineRows() {
    var L = mineList(), out = [];
    for (var i = 0; i < L.length; i++) {
      var y = 148 + i * 48;
      out.push({ i: i, n: L[i].n, x: 90, y: y, w: W - 180, h: 40,
                 sub: (function (c) { var d = editDecode(c); return d ? winText(d) : ''; })(L[i].c),
                 edit: [704, y + 8, 50, 24], play: [762, y + 8, 46, 24], del: [816, y + 8, 40, 24] });
    }
    return out;
  }
  function winText(e) {
    var w = e.win || 'kill';
    if (w === 'survive') return '撑住 ' + e.need + ' 秒';
    if (w === 'reach')   return '爬上旗子' + (e.goalQuiet ? '（空手）' : '');
    return '击杀 ' + e.need + ' 个';
  }

  // ── 关卡数据 ──
  function freshEdit() {
    return { plats: [[150, 440, 190, 18], [570, 350, 210, 18]],
             types: [0], need: 6, gap: 88, maxAlive: 6,
             items: [[0, 675, 322]], goal: [430, 150, 120, 60], goalQuiet: false,
             win: 'kill', name: '', wep: 0,
             tab: 0, item: 0, drag: null, slide: null, panel: false, undo: [],
             code: '', showCode: false };
    // 默认不是空白：两块高低错开的台子 + 一个护盾，进去按 Enter 立刻有得打。
  }

  function escName(s) { return String(s || '').replace(/[|;\n\r]/g, '').trim().slice(0, 12); }

  function editEncode(e) {
    var p = e.plats.map(function (q) { return q.join(','); }).join(';');
    var i = e.items.map(function (q) { return q[0] + ',' + q[1] + ',' + q[2]; }).join(';');
    var out = 'STILL2|n' + escName(e.name) +
      '|p' + p + '|t' + e.types.join('') +
      '|k' + e.need + '|g' + e.gap + '|m' + (e.maxAlive || 6) +
      '|w' + String(e.win || 'kill').charAt(0) + '|x' + (e.wep || 0);
    if (e.win === 'reach') out += '|q' + (e.goalQuiet ? 1 : 0) + '|o' + (e.goal || [430, 150, 120, 60]).join(',');
    return out + '|i' + i;
  }
  function editDecode(s) {
    try {
      var seg = String(s).trim().split('|');
      var v1 = seg[0] === 'STILL1', v2 = seg[0] === 'STILL2';
      if (!v1 && !v2) return null;
      var o = { plats: [], types: [0], need: 6, gap: 88, maxAlive: 6,
                items: [], goal: [430, 150, 120, 60], goalQuiet: false,
                win: 'kill', name: '', wep: 0,
                tab: 0, item: 0, drag: null, slide: null, panel: false, undo: [],
                code: '', showCode: false };
      for (var si = 1; si < seg.length; si++) {
        var tag = seg[si].charAt(0), body = seg[si].slice(1);
        if (tag === 'n') { o.name = escName(body); continue; }
        if (!body) continue;
        if (tag === 'p') o.plats = body.split(';').map(function (t) {
          var a = t.split(','); return [+a[0] || 0, +a[1] || 0, +a[2] || 0, +a[3] || 18];
        }).filter(function (q) { return q[2] > 8; });
        else if (tag === 't') o.types = body.split('').map(Number).filter(function (n) { return n >= 0 && n < 5; });
        else if (tag === 'k') o.need = Math.max(1, Math.min(999, +body || 6));
        else if (tag === 'g') o.gap = Math.max(24, Math.min(400, +body || 88));
        else if (tag === 'm') o.maxAlive = Math.max(1, Math.min(9, +body || 6));
        else if (tag === 'w') o.win = ({ k: 'kill', s: 'survive', r: 'reach' })[body] || 'kill';
        else if (tag === 'x') o.wep = Math.max(0, Math.min(2, +body || 0));
        else if (tag === 'q') o.goalQuiet = body === '1';
        else if (tag === 'o') { var g = body.split(',').map(Number);
          if (g.length === 4 && g[2] > 8) o.goal = [+g[0] || 0, +g[1] || 0, +g[2] || 0, +g[3] || 0]; }
        else if (tag === 'i') o.items = body.split(';').map(function (t) {
          var a = t.split(','); return [+a[0] || 0, +a[1] || 0, +a[2] || 0];
        }).filter(function (q) { return q[0] >= 0 && q[0] < 4; });
      }
      if (!o.types.length) o.types = [0];
      if (o.win === 'survive') o.need = Math.max(5, Math.min(120, o.need));
      else if (o.win === 'kill') o.need = Math.min(99, o.need);
      return o;
    } catch (err) { return null; }
  }

  // 起名字 / 生成。save=true 就是「生成」：起完名顺手存进我的关卡
  function askName(save) {
    var e = S.edit; if (!e) return false;
    var nm = null;
    try { nm = window.prompt('给这一关起个名字（最多 12 字）：', e.name || '第 ' + (mineList().length + 1) + ' 关'); } catch (err) {}
    if (nm === null || nm === undefined) return false;
    e.name = escName(nm) || '无名';
    if (!save) { Sound.pick(); return true; }
    var r = saveLevel(e.name);
    if (r === 'full') S.floats.push({ s: '最多存 ' + MAX_MINE + ' 关，先删一张', x: W / 2, y: 130, t: 80, c: PAL.red });
    else if (r === 'over') S.floats.push({ s: '「' + e.name + '」已更新', x: W / 2, y: 130, t: 70, c: PAL.mint });
    else S.floats.push({ s: '存下了 · ' + e.name, x: W / 2, y: 130, t: 70, c: PAL.mint });
    Sound.pick();
    return true;
  }

  // ── 撤销 ──
  // 编辑器没有撤销等于没有编辑器 —— 画错一块就得从头来。
  function snapOf(e) {
    return JSON.stringify({ p: e.plats, i: e.items, t: e.types, o: e.goal,
                            w: e.win, k: e.need, g: e.gap, m: e.maxAlive, q: e.goalQuiet, x: e.wep });
  }
  function pushUndo() {
    var e = S.edit; if (!e) return;
    if (!e.undo) e.undo = [];
    var s = snapOf(e);
    if (e.undo.length && e.undo[e.undo.length - 1] === s) return;
    e.undo.push(s);
    if (e.undo.length > 30) e.undo.shift();
  }
  function doUndo() {
    var e = S.edit; if (!e || !e.undo || !e.undo.length) return false;
    var s = JSON.parse(e.undo.pop());
    e.plats = s.p; e.items = s.i; e.types = s.t; e.goal = s.o;
    e.win = s.w; e.need = s.k; e.gap = s.g; e.maxAlive = s.m; e.goalQuiet = s.q; e.wep = s.x || 0;
    return true;
  }

  // ── 画布上的坐标 ──
  // 画和点击都从这里取，不各写一份 ——「格子和方向键对不上」就是这么来的
  var SL = { chipA: [20, 46, 54, 26], chipB: [80, 46, 54, 26], chipC: [140, 46, 54, 26] };
  // 起手武器：三种笔右边、五个按钮左边那块空地。
  // 不动规矩面板的网格 —— 那个刚被老板说过乱，能不碰就不碰。
  function wepChip(i) { return [200 + i * 78, 46, 72, 26]; }
  var BTN = [
    { k: 'rule', s: '规 矩',  x: 456 },
    { k: 'test', s: '试 玩',  x: 554 },
    { k: 'save', s: '生 成',  x: 652 },
    { k: 'mine', s: '关 卡',  x: 750 },
    { k: 'code', s: '分享码', x: 848 }
  ];
  var BTN_Y = 30, BTN_W = 92, BTN_H = 42;
  // 一张死网格。标签右对齐到 lx，控件从 cx 起，行心是 r1/r2/r3/s1/s2/s3/r7。
  // 所有行高、间距都是同一套数，位置全从这儿取 —— 上一版是各处自己算，所以越加越乱。
  var TBTN = [
    { k: 'make', x: 270, y: 508, w: 200, h: 34 },
    { k: 'mine', x: 490, y: 508, w: 200, h: 34 }
  ];
  var PG = { x: 110, y: 88, w: 740, h: 470,
             lx: 228, cx: 246, sx: 246, sw: 460, vx: 720,
             r1: 200, r2: 248, r3: 294, s1: 340, s2: 382, s3: 424, r7: 470 };
  function hit2(p, q) { return p.x >= q[0] && p.x <= q[0] + q[2] && p.y >= q[1] && p.y <= q[1] + q[3]; }
  function knobX(v, lo, hi) { return PG.sx + PG.sw * clamp((v - lo) / (hi - lo), 0, 1); }
  function winChip(i)  { return [PG.cx + i * 116, PG.r2 - 16, 108, 32]; }
  function typeChip(i) { return [PG.cx + i * 78,  PG.r3 - 16,  72, 32]; }
  function tplChip(i)  { return [PG.cx + i * 116, PG.r7 - 16, 108, 32]; }
  function nameBox()   { return [PG.cx, PG.r1 - 18, PG.sw, 36]; }   // 跟滑块一样宽，右边缘对齐
  function quietBox()  { return [PG.cx, PG.s1 - 16, 150, 32]; }   // reach 时占「第一个滑块」那一行
  function needRange() { return (S.edit && S.edit.win === 'survive') ? [5, 120] : [1, 99]; }
  function sliderY(which) { return which === 'need' ? PG.s1 : (which === 'gap' ? PG.s2 : PG.s3); }
  function sliderWhich(y) {
    if (Math.abs(y - PG.s1) < 17) return 'need';
    if (Math.abs(y - PG.s2) < 17) return 'gap';
    if (Math.abs(y - PG.s3) < 17) return 'alive';
    return null;
  }
  function setSlide(which, mx) {
    var e = S.edit, f = clamp((mx - PG.sx) / PG.sw, 0, 1);
    if (which === 'need') {
      var r = needRange();
      e.need = Math.max(r[0], Math.round(r[0] + f * (r[1] - r[0])));
    } else if (which === 'gap')   e.gap = Math.max(24, Math.round(24 + f * 376));      // 24 ~ 400 帧
    else if (which === 'alive')   e.maxAlive = Math.max(1, Math.round(1 + f * 8));     // 1 ~ 9 只
  }
  function applyTpl(i) {
    var t = TPLS[i]; if (!t) return;
    pushUndo();
    S.edit.plats = t.plats.map(function (q) { return q.slice(); });
    S.edit.items = t.items.map(function (q) { return q.slice(); });
  }

  // ── 试玩 / 生成 ──
  // 试玩是暂时的：退出时要把那张临时卡收掉，否则选章界面会永远多出一关。
  function dropCustom() {
    while (CHAPTERS.length && CHAPTERS[CHAPTERS.length - 1].__custom) CHAPTERS.pop();
    S.chapter = clamp(S.chapter, 0, CHAPTERS.length - 1);
  }
  function playCustom(e) {
    dropCustom();
    var C = {
      __custom: true, n: escName(e.name) || '自制', sel: '你自己做的',
      sub: winText(e) + '。' + (e.win === 'reach' ? '\n旗子就在场地上。' : '\n撑不住就重来。'),
      types: e.types.map(function (i) { return EDIT_TYPES[i]; }),
      need: e.need, gap: e.gap, maxAlive: e.maxAlive || 6,
      plats: e.plats.map(function (q) { return [q[0], q[1], q[2], q[3]]; }),
      items: e.items.map(function (q) { return [ITEM_ORDER[q[0]], q[1], q[2]]; })
    };
    C.wep = Math.max(0, Math.min(2, e.wep || 0));
    if (e.win && e.win !== 'kill') C.win = e.win;
    if (e.win === 'reach') { C.goal = (e.goal || [430, 150, 120, 60]).slice(); C.goalQuiet = !!e.goalQuiet; }
    CHAPTERS.push(C);
    S.testing = true;
    startChapter(CHAPTERS.length - 1);
  }

  function goWorkshop() {
    S.testing = false; dropCustom();
    if (!S.edit) S.edit = freshEdit();
    S.edit.panel = false; S.edit.showCode = false;
    S.mode = 'workshop';
    Sound.ui();
  }

  // ── 画 ──
  function drawChip(q, on, label, sub, col) {
    col = col || PAL.mint;
    ctx.fillStyle = on ? 'rgba(95,240,192,.24)' : 'rgba(120,150,220,.13)';
    rr(ctx, q[0], q[1], q[2], q[3], 8); ctx.fill();
    ctx.strokeStyle = on ? col : 'rgba(120,160,230,.25)'; ctx.lineWidth = on ? 1.5 : 1;
    rr(ctx, q[0] + .7, q[1] + .7, q[2] - 1.4, q[3] - 1.4, 8); ctx.stroke();
    txt(ctx, label, q[0] + q[2] / 2, q[1] + (sub ? 14 : q[3] / 2 + 4),
      { a: 'center', s: 12.5, c: on ? PAL.ink : 'rgba(155,175,215,.72)', w: '800' });
    if (sub) txt(ctx, sub, q[0] + q[2] / 2, q[1] + 27,
      { a: 'center', s: 10, c: on ? 'rgba(200,255,235,.75)' : 'rgba(140,160,200,.5)', w: '600' });
  }

  function drawSlider(v, lo, hi, cy3, hot) {
    var cx4 = knobX(v, lo, hi);
    ctx.fillStyle = 'rgba(120,150,220,.16)';
    rr(ctx, PG.sx, cy3 - 5, PG.sw, 10, 5); ctx.fill();
    ctx.fillStyle = 'rgba(255,209,102,.45)';
    rr(ctx, PG.sx, cy3 - 5, Math.max(0, cx4 - PG.sx), 10, 5); ctx.fill();
    ctx.save();
    if (hot) { ctx.shadowColor = 'rgba(255,209,102,.9)'; ctx.shadowBlur = 14; }
    ctx.fillStyle = hot ? '#fff2c4' : PAL.gold;
    ctx.beginPath(); ctx.arc(cx4, cy3, hot ? 9 : 7.5, 0, 6.2832); ctx.fill();
    ctx.restore();
    txt(ctx, String(v), PG.vx, cy3 + 5, { s: 14, c: PAL.gold, w: '800' });
  }

  // 规矩面板：所有「数值和条件」都在这儿，画布上只留用鼠标摆的东西
  //
  // 布局是一张死网格：标签一律右对齐到 PG.lx，控件一律从 PG.cx 起，行高一模一样。
  // 上一版是「控件摆到哪算哪、说明见缝插针」，所以看着乱 —— 说明文字还飘到卡片外面去了。
  var ROW_HINT = {
    kill:    '把这一关的怪杀够 N 个就算过 —— 把圈摁在怪身上别松手',
    survive: '活够 N 秒就算过 —— 杀不杀都行，活下去是唯一的指标',
    reach:   '在场地里插一面旗，爬到那儿就算过 —— 回画布切到「旗子」笔，点一下摆它'
  };
  function drawRulePanel() {
    var e = S.edit;
    ctx.fillStyle = 'rgba(4,7,14,.86)'; ctx.fillRect(0, 0, W, H);

  function addCoins(n) {
    S.coins += n;
    var sv = Save.get(); sv.coins = (sv.coins || 0) + n;
    Save.later();          // 不立刻写盘
  }

  var SHOP_W = 620, SHOP_H = 82, SHOP_GAP = 12, SHOP_Y0 = 184;
  function shopRows() {
    return WEAPONS.map(function (w, i) {
      return { i: i, w: w, x: W / 2 - SHOP_W / 2, y: SHOP_Y0 + i * (SHOP_H + SHOP_GAP),
               ww: SHOP_W, hh: SHOP_H };
    });
  }
  function buyWeapon(i) {
    var wp = WEAPONS[i];
    if (!wp) return;
    var sv = Save.get();
    if (owns(i)) { S.weapon = i; Sound.ui(); return; }        // 已有 → 直接装备
    if ((sv.coins || 0) < wp.price) { Sound.thaw(); S.shake = 6; return; }
    sv.coins -= wp.price;
    sv.owned = (sv.owned || []).concat([wp.id]);
    Save.flush();
    S.weapon = i;
    S.floats.push({ s: '买下 · ' + wp.n, x: W / 2, y: 128, t: 90, c: PAL.gold });
    Sound.pick();
  }
  function goShop() { S.mode = 'shop'; S.shopIdx = 0; Sound.ui(); }

  function drawShop() {
    ctx.fillStyle = 'rgba(4,7,14,.95)';
    ctx.fillRect(0, 0, W, H);
    txt(ctx, '商 店', W / 2, 76, { a: 'center', s: 38, c: PAL.ink, w: '800', glow: 'rgba(255,209,102,.6)', blur: 13 });
    var sv = Save.get();
    txt(ctx, '金币 ' + (sv.coins || 0), W / 2, 112, { a: 'center', s: 17, c: PAL.gold, w: '800' });
    txt(ctx, '击杀掉落金币 · 越硬的敌人越值钱', W / 2, 134,
      { a: 'center', s: 11.5, c: 'rgba(130,155,200,.75)', w: '500' });
    // 之前写「装备中」，玩家以为一局只能带一把 —— 说清楚
    txt(ctx, '买过的都能带着走：局内按 1 / 2 / 3 随时换，不是只能挑一把',
      W / 2, 160, { a: 'center', s: 13.5, c: PAL.mint, w: '800' });

    var rows = shopRows();

      var have = owns(it.i), cur = S.weapon === it.i, can = (sv.coins || 0) >= wp.price;

                S.mouse.y >= it.y && S.mouse.y <= it.y + it.hh;
      ctx.fillStyle = cur ? 'rgba(255,209,102,.16)' : (hov && (have || can) ? 'rgba(79,227,255,.16)' : 'rgba(120,150,220,.07)');

      ctx.strokeStyle = cur ? 'rgba(255,209,102,.75)' : (hov && (have || can) ? 'rgba(79,227,255,.6)' : 'rgba(120,150,220,.18)');

      var state = cur ? '▶ 正在用（按 ' + (it.i + 1) + '）'

      { a: 'center', s: 12, c: 'rgba(140,165,210,.75)', w: '500' });
