  function applyItem(t, x, y) {
    var def = ITEMS[t] || ITEMS.shield;
    if (t === 'shield') S.shield++;                 // 护盾能攒，不再是一次性的开关
    else if (t === 'heart') S.hp = Math.min(S.maxHp || MAX_HP, S.hp + 1);
    else if (t === 'pulse') S.pulse.cd = 0;
    else if (t === 'breathe') S.breathe = BREATHE_TIME;
    Sound.pick();
    S.floats.push({ s: def.n + ' · ' + def.d, x: x, y: y - 26, t: 82, c: def.c });
    for (var i = 0; i < 16; i++) {
      S.parts.push({
        x: x, y: y, vx: rnd(-3.5, 3.5), vy: rnd(-4.5, 1),
        life: rnd(18, 34), max: 34, c: def.c, s: rnd(2, 4)
      });
    }
  }

  // ── 通关条件 ──
  // 本来只有「杀够 N 个」一招打天下 —— 12 章里 11 章是同一件事。
  // 现在数据表里用 C.win 指定，默认还是 kill：
  //   kill    杀够 need 个
  //   survive 撑住 need 秒（不杀也行）
  //   reach   抵达 C.goal 那块区域
  //   door    终章那扇门，单独判
  function winKind() { var C = CHAPTER(); return C.infinite ? 'infinite' : (C.finale ? 'door' : (C.win || 'kill')); }
  function isBoss() { return winKind() === 'boss'; }
  function goalMet() {
    var C = CHAPTER(), k = winKind();
    if (k === 'survive') return S.chapterT >= C.need * 60;
    if (k === 'reach')   return !!S.goalHit;
    if (k === 'door')    return !!(S.door && S.door.open);
    if (k === 'boss')    return !!(S.boss && S.boss.dead);
    if (k === 'infinite') return false;              // 没有通关这回事
    return S.chapterKilled >= S.chapterNeed;
  }
  function goalLabel() {          // 游戏中 / 暂停时的一行
    var C = CHAPTER(), k = winKind();
    if (k === 'survive') return '撑住 ' + Math.max(0, Math.ceil(C.need - S.chapterT / 60)) + ' 秒';
    if (k === 'reach') {
      var onGoal = S.goal && aabb(S.ch, S.goal);
      if (C.goalQuiet && onGoal && S.field.hold > 0) return '松开手 —— 攥着东西不算数';
      return '爬上最上面那层' + (C.goalQuiet ? '（空着手）' : '');
    }
    if (k === 'door')    return '空手走到门口';
    if (k === 'boss')    return S.boss ? ('它的眼睛 ' + Math.max(0, S.boss.hp) + ' / ' + S.boss.maxhp) : '';
    if (k === 'infinite') return S.breath ? ('喘口气 ' + Math.ceil(S.waveT / 60) + ' 秒') : ('第 ' + (S.wave || 1) + ' 波');

    return '击杀 ' + S.chapterKilled + ' / ' + S.chapterNeed;
  }
  function goalBrief() {          // 章节卡上的一行
    var C = CHAPTER(), k = winKind();
    if (k === 'survive') return '目标：撑住 ' + C.need + ' 秒';
    if (k === 'reach')   return '目标：爬到最上面' + (C.goalQuiet ? '，而且要空着手' : '');
    if (k === 'door')    return '目标：走到那扇门';
    if (k === 'boss')    return '目标：等它的眼睛落下来，然后砸碎它';
    if (k === 'infinite') return '目标：活下去。没有终点。';
    return '目标：击杀 ' + C.need + ' 个';
  }

  // 敌人持续生成；通关靠达成目标，干等是等不来的
  function spawnTick() {
    var C = CHAPTER();
    S.spawnT--;
    if (S.spawnT > 0) return;
    S.spawnT = C.gap;
    // 同屏上限。没有它的话，出怪只增不减 —— 终章尤其致命：
    // 它没有击杀指标，杀敌又要把门的充能清零，场上只会越堆越多。
    var cap = C.maxAlive || 9, alive = 0;
    for (var ai = 0; ai < S.enemies.length; ai++) {
      if (!S.enemies[ai].dead && !S.enemies[ai].T.boss) alive++;   // 眼睛不算小怪名额
    }
    if (alive >= cap) return;
    if (S.breath) return;          // 无限模式的喘息期间，一只新怪都不出
    var type = C.types[Math.floor(Math.random() * C.types.length)];
    var p = spawnPoint();
    S.enemies.push(makeEnemy(type, p.x, p.y, S.chapter));
  }

  function freshPlayer() {
    return {
      x: W * .5 - PW / 2, y: FLOOR - PH, w: PW, h: PH,
      vx: 0, vy: 0, grounded: false, ground: null,
      coyote: 0, buf: 0, face: 1, walkT: 0, sq: 1, sqx: 1,
      prevBottom: 0,
      dropFrom: null, dropT: 0, wasDown: false,
      wasJump: false, jumpHold: 0, landT: 0, blink: 0, blinkT: 90, stepT: 0
    };
  }

  function startChapter(i, booting) {
    if (!(CHAPTERS[i] && CHAPTERS[i].__custom)) dropCustom();            // 开真关之前先把试玩的临时卡收掉
    S.chapter = clamp(i, 0, CHAPTERS.length - 1);
    var C = CHAPTER();
    var sv = Save.get();
    if (!booting && !C.__custom) {      // 自制关不是进度，别写进存档
      if (S.chapter + 1 > (sv.unlocked || 1)) sv.unlocked = S.chapter + 1;
      if (C.finale) sv.reachedFinale = true;
      sv.plays = (sv.plays || 0) + 1;
      Save.flush();
      if (S.chapter + 1 >= Math.ceil(CHAPTERS.length / 2)) unlock('ch5');
      if (S.chapter + 1 >= REAL_N) unlock('ch9');
    }
    S.finaleClean = C.finale;      // 终章：有没有一次都没攥过
    // 自制关里三把武器是白开的。退回正式章时，手里那把要是没买过就得放下 ——
    // 不然就成白送了。（S.weapon 是全局的，会跟着你走。）
    if (!C.__custom && !owns(S.weapon)) S.weapon = 0;
    // 自制关：作者指定的那把直接上手 —— 别人粘码进来就该拿着设计时的那把
    if (C.__custom && C.wep !== undefined) S.weapon = clamp(C.wep, 0, WEAPONS.length - 1);

    S.enemies = []; S.bullets = []; S.parts = []; S.floats = [];
    // 终章不能反击，只能硬穿 —— 所以那一章的血条更长。
    // 另外：同一章连续失败 3 次就加一点血上限（最多 +2）。本喵看不到人怎么玩，
    // 那就把台阶递过去，而不是继续猜"应该多难"。
    if (S.failsFor !== S.chapter) { S.failsFor = S.chapter; S.fails = 0; }
    S.mercy = Math.min(2, Math.floor((S.fails || 0) / 3));
    S.maxHp = (C.finale || C.infinite ? 5 : MAX_HP) + S.mercy;   // 终章和无限都给 5 心
    S.hp = S.maxHp; S.invuln = 0;
    S.chapterKilled = 0; S.chapterNeed = C.need || 0;
    S.chapterT = 0; S.goalHit = false;
    S.goal = C.goal ? { x: C.goal[0], y: C.goal[1], w: C.goal[2], h: C.goal[3] } : null;
    S.spawnT = 30; S.chapterBreak = 0; S.chapterDone = false;
    S.runKills = 0; S.runT = 0; S.deaths = 0;
    S.pulse.cd = 0; S.pulse.fx = 0;
    S.banner = null; S.bannerT = 0;
    S.shake = 0; S.flash = 0; S.hitstop = 0;
    S.worldFrozen = false; S.freezeFx = 0;
    S.ch = freshPlayer();
    S.field.x = W / 2; S.field.y = 300; S.field.r = R_BASE; S.field.hold = 0;
    S.plats = (C.plats || []).map(function (p) {
      return { x: p[0], y: p[1], w: p[2], h: p[3] || 18, t: 'plat' };
    });
    S.items = (C.items || []).map(function (it, k) {
      return { t: it[0], x: it[1], y: it[2], got: false, ph: k * 1.37 };
    });
    S.shield = 0; S.breathe = 0;
    S.door = C.finale ? { x: W - 86, y: FLOOR - 112, w: 74, h: 112, open: false, glow: 0, charge: 0, near: false } : null;
    // 第 13 章：背景那只巨物。核心是一只常驻的敌人（血 = boss 血），
    // 平时收在本体里（无敌），每隔一阵子落到某个平台上，那才是能打的时候。
    S.warns = [];
    S.boss = null; S.bossCore = null;
    S.wave = 1; S.waveT = WAVE_FRAMES; S.breath = false;
    if (C.infinite) infSetupWave(1);
    if (C.win === 'boss') {
      S.boss = { hp: TYPES.core.hp, maxhp: TYPES.core.hp, phase: 1, t: 0,
                 up: false, upT: 0, restT: 200, cx: W / 2, cy: 146, tx: W / 2, ty: 146,
                 fireT: 150, rockT: 320, dead: false, flash: 0 };
      S.bossCore = makeEnemy('core', W / 2 - 29, 146 - 29, S.chapter);
      S.bossCore.shield = true;
      S.enemies.push(S.bossCore);
    }
    if (C.finale) {
      // 从最左边出发：整条路都得空着手走过去
      S.ch.x = 40;
      // 全摆在路面上挡道 —— 摆在天上会被直接跑过去
      var seed = ['crawler', 'charger', 'floater', 'shooter'];
      for (var q = 0; q < seed.length; q++) {
        var T = TYPES[seed[q]];
        S.enemies.push(makeEnemy(seed[q], 200 + q * 150, FLOOR - T.h, S.chapter));
      }
    }
    S.mode = booting ? 'title' : 'intro';
    S.introT = 0;
    S.clearT = 0;
    S.over = 0;
    S.endingT = 0;
    if (!booting) { Music.start(); Music.update(0); }
  }

  // 通关的瞬间，时间停了。
  // 这是这个游戏里唯一一次你可以不设防的时刻 —— 因为你已经赢了。
  function freezeWorld() {
    if (S.worldFrozen) return;
    S.worldFrozen = true;
    S.freezeFx = 1;
    S.invuln = 99999;
    S.bullets = [];
    S.field.hold = 0;
    for (var i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.dead) continue;
      e.held = true;                       // 全部就地变成石头
      e.live = false;
      e.vx = 0; e.vy = 0; e.dmgT = 0;
      for (var k = 0; k < 5; k++) {
        S.parts.push({
          x: e.x + rnd(0, e.w), y: e.y + rnd(0, e.h),
          vx: rnd(-1.4, 1.4), vy: rnd(-2.4, 0), life: rnd(24, 52), max: 52,
          c: PAL.cy, s: rnd(1.5, 3)
        });
      }
    }
    S.shake = 8;
    Sound.freeze();
    S.floats.push({ s: '时间停了', x: S.ch.x + PW / 2, y: S.ch.y - 34, t: 100, c: PAL.cy });
  }

  function chapterClear() {
    if (S.chapterDone) return;
    // 万一同一帧里死亡判定先落了地，通关要把它扳回来 —— 目标是达成了的
    if (S.mode === 'over') { S.mode = 'play'; S.over = 0; S.hp = 1; }
    S.fails = 0;                 // 过了就清零，保底不会跟着你一路白送
    S.chapterDone = true;
    S.chapterBreak = 90;
    freezeWorld();
    banner(chapLabel() + '  通过', PAL.mint);
    Sound.wave();
  }

  function finishGame() {
    S.mode = 'ending';
    S.endingT = 0;
    unlock('ending');
  }

  // ══════════════════════════════════════════════════════════════
  //  8 · 角色
  // ══════════════════════════════════════════════════════════════
  // 重开当前章
  function resetRun() { startChapter(S.chapter); }

  function hurt(dmg, fromX) {
    if (S.invuln > 0 || S.mode !== 'play' || S.worldFrozen) return;
    // 护盾先碎
    if (S.shield > 0) {
      S.shield--;                                     // 挡一次，掉一层
      S.invuln = INVULN;
      S.shake = 9; S.flash = .35;
      Sound.freeze();
      S.floats.push({ s: '护盾碎了', x: S.ch.x + PW / 2, y: S.ch.y - 22, t: 62, c: PAL.cy });
      for (var q = 0; q < 20; q++) {
        var a2 = (q / 20) * 6.2832;
        S.parts.push({
          x: S.ch.x + PW / 2, y: S.ch.y + PH / 2,
          vx: Math.cos(a2) * rnd(3, 7), vy: Math.sin(a2) * rnd(3, 7),
          life: rnd(14, 28), max: 28, c: PAL.cy, s: rnd(2, 3.5)
        });
      }
      return;
    }
    S.hp -= (dmg || 1);
    S.invuln = INVULN;
    S.shake = 12; S.flash = .8; S.hitstop = 7;
    Sound.hurt();
    var ch = S.ch;
    ch.vx = (ch.x + ch.w / 2 < fromX ? -1 : 1) * 7;
    ch.vy = -6.5;
    for (var i = 0; i < 22; i++) {
      S.parts.push({ x: ch.x + PW / 2, y: ch.y + PH / 2, vx: rnd(-6, 6), vy: rnd(-7, 2), life: rnd(18, 38), max: 38, c: i % 2 ? PAL.red : PAL.pink, s: rnd(2, 4) });
    }
    if (S.hp <= 0) {
      // 目标已经达成了 —— 别让同一帧的伤害把胜利吃掉（两个方向都要堵）
      if (!isFinale() && goalMet()) { S.hp = 1; chapterClear(); return; }
      if (isFinale() && S.door && S.door.open && aabb(S.ch, S.door)) { S.hp = 1; return; }
      S.hp = 0;
      S.mode = 'over';
      S.over = 0;
      if (S.failsFor !== S.chapter) { S.failsFor = S.chapter; S.fails = 0; }
      S.fails++;
      Sound.over();
      S.shake = 20;
      var sv = Save.get();
      if (S.runKills > (sv.bestKill || 0)) sv.bestKill = S.runKills;
      sv.totalKill = (sv.totalKill || 0) + S.runKills;
      sv.deaths = (sv.deaths || 0) + 1;
      Save.flush();
    }
  }

  function killEnemy(e, byPulse) {
    if (e.T.boss) { bossDown(); return; }   // 那只眼睛不是「一只怪」，是 boss 的血条
    e.dead = true;
    S.kills++; S.runKills++;
    S.chapterKilled++;
    rollDrop(e.x + e.w / 2, e.y + e.h / 2);
    addCoins(e.T.cost || 1);            // 越硬的敌人越值钱
    tutSet(2);                          // 第一次击杀 → 教学进入收尾
    if (e.T.noFreeze) unlock('spike');
    if (S.field.r <= R_BASE * R_FLOOR + 4) unlock('squeeze');
    Sound.kill();
    // 刚好打够数 → 当场定格。
    // 不能等到这一帧末尾再判定：那时另一只敌人的伤害已经先一步把玩家打死了。
    if (!isFinale() && !S.chapterDone && goalMet()) chapterClear();
    var sv = Save.get();
    if ((sv.totalKill || 0) + S.runKills >= 100) unlock('k100');
    var n = byPulse ? 16 : 10;
    for (var i = 0; i < n; i++) {
      S.parts.push({
        x: e.x + e.w / 2, y: e.y + e.h / 2,
        vx: rnd(-5, 5), vy: rnd(-6, 2), life: rnd(16, 34), max: 34,
        c: e.T.noFreeze ? PAL.red : hsl(e.T.hue, 80, 62), s: rnd(2, 4.5)
      });
    }
    if (byPulse) {
      S.pulseKills++;
      if (S.pulseKills >= 4) unlock('pulse4');
    }
  }

  // 脉冲击杀计数：每次脉冲开始时清零，脉冲结束后判定
  function firePulse() {
    if (!has('pulse') || S.pulse.cd > 0 || S.mode !== 'play') return;
    var wep = WEP();
    S.pulse.cd = wep.cd;
    var f = S.field;
    var R = R_BASE * wep.rPulse;           // 脉冲范围固定，不受缩圈影响
    S.pulse.fx = 1;
    S.pulseKills = 0;
    S.shake = 8;
    Sound.pulse();
    var hits = 0;
    for (var i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.dead) continue;
      var d = dist(e.x + e.w / 2, e.y + e.h / 2, f.x, f.y);
      if (d > R + Math.max(e.w, e.h) / 2) continue;
      // 「不化」只吃脉冲，而且得是砸得动它的那把 ——「撒手」连推都推不动它
      if (e.T.noFreeze && !wep.spikeKill) continue;
      if (e.shield) continue;              // 收在本体里的眼睛打不动
      hits++;
      e.hp -= wep.pdmg;
      e.flash = 12;
      var ang = Math.atan2(e.y + e.h / 2 - f.y, e.x + e.w / 2 - f.x) || 0;
      e.vx += Math.cos(ang) * PULSE_KNOCK;
      e.vy += Math.sin(ang) * PULSE_KNOCK - 3;
      if (e.hp <= 0) killEnemy(e, true);
    }
    for (var p = 0; p < 40; p++) {
      var a = (p / 40) * 6.2832;
      S.parts.push({
        x: f.x + Math.cos(a) * R * .7, y: f.y + Math.sin(a) * R * .7,
        vx: Math.cos(a) * rnd(4, 9), vy: Math.sin(a) * rnd(4, 9),
        life: rnd(14, 26), max: 26, c: PAL.cy, s: rnd(2, 4)
      });
    }
  }

  // ══════════════════════════════════════════════════════════════
  //  9 · 敌人 AI（只在「场内」运行）
  // ══════════════════════════════════════════════════════════════
  function shoot(e, tx, ty) {
    var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    var a = Math.atan2(ty - cy, tx - cx);
    S.bullets.push({ x: cx, y: cy, vx: Math.cos(a) * BULLET_SP, vy: Math.sin(a) * BULLET_SP, r: 5, live: true, life: 420, t: 0 });
    Sound.ui();
  }

  // 僵直期间只落地，不追人
  function aiPhysicsOnly(e) {
    if (!e.T.fly) {
      e.vy = Math.min(e.vy + GRAV, MAXFALL);
      e.y += e.vy;
      e.grounded = false;
      if (e.y + e.h >= FLOOR) { e.y = FLOOR - e.h; e.vy = 0; e.grounded = true; }
    }
    e.vx *= .8;
    e.x = clamp(e.x + e.vx, -90, W + 90 - e.w);
    e.bob += .05;
  }

  function aiLive(e, ch) {
    var T = e.T;
    var cx = e.x + e.w / 2, cy = e.y + e.h / 2;
    var px = ch.x + PW / 2, py = ch.y + PH / 2;

    if (e.type === 'charger') {
      e.chargeT--;
      if (e.chargeState === 0) {                       // 靠近
        var dir0 = px > cx ? 1 : -1;
        e.face = dir0;
        e.vx = lerp(e.vx, dir0 * T.sp, .12);
        if (Math.abs(px - cx) < 340 && Math.abs(py - cy) < 110) { e.chargeState = 1; e.chargeT = 34; }
      } else if (e.chargeState === 1) {                // 蓄力（给玩家反应时间）
        e.vx = lerp(e.vx, 0, .2);
        if (e.chargeT <= 0) { e.chargeState = 2; e.chargeT = 34; e.vx = e.face * 9.4; Sound.freeze(); }
      } else if (e.chargeState === 2) {                // 冲
        e.vx = e.face * 9.4;
        if (e.chargeT <= 0) { e.chargeState = 3; e.chargeT = 44; }
      } else {                                          // 硬直
        e.vx = lerp(e.vx, 0, .18);
        if (e.chargeT <= 0) e.chargeState = 0;
      }
    } else if (T.fly) {
      var ang = Math.atan2(py - cy, px - cx);
      var sp = T.sp;
      if (e.type === 'shooter') {
        var d = dist(cx, cy, px, py);
        if (d < 190) { ang += Math.PI; sp = T.sp * 1.5; }
        else if (d < 300) sp = T.sp * .25;
        e.shootT--;
        if (e.shootT <= 0) { e.shootT = T.shoot; shoot(e, px, py); }
      }
      e.vx = lerp(e.vx, Math.cos(ang) * sp, .075);
      e.vy = lerp(e.vy, Math.sin(ang) * sp, .075);
      e.face = e.vx > 0 ? 1 : -1;
    } else {
      var dir = px > cx ? 1 : -1;
      e.face = dir;
      e.vx = lerp(e.vx, dir * T.sp, .13);
      if (e.grounded && Math.abs(px - cx) < 46 && ch.y + PH < e.y - 8) e.vy = -11.4;
    }

    // 位移
    if (!T.fly) e.vy = Math.min(e.vy + GRAV, MAXFALL);
    var nx = e.x + e.vx, ny = e.y + e.vy;

    // 地面单位撞上冻住的石台 → 跳过去，否则停下
    if (!T.fly) {
      var probe = { x: nx, y: e.y, w: e.w, h: e.h };
      var blocked = false;
      for (var i = 0; i < S.enemies.length; i++) {
        var o = S.enemies[i];
        if (o === e || o.live || o.dead) continue;
        if (aabb(probe, o)) { blocked = true; break; }
      }
      if (blocked) {
        e.vx *= .2;
        if (e.grounded) e.vy = -10.6;
        nx = e.x + e.vx;
      }
    }

    e.x = clamp(nx, -90, W + 90 - e.w);
    var prevBottom = e.y + e.h;
    e.y = ny;
    e.grounded = false;
    var gy = FLOOR;
    if (!T.fly) {
      for (var pi = 0; pi < S.plats.length; pi++) {
        var pf = S.plats[pi];
        if (e.x + e.w < pf.x + 6 || e.x > pf.x + pf.w - 6) continue;   // 得站在板子上方
        if (prevBottom <= pf.y + 4 && e.y + e.h >= pf.y && pf.y < gy) gy = pf.y;
      }
    }
    if (e.y + e.h >= gy) { e.y = gy - e.h; e.vy = 0; e.grounded = true; }
    if (e.y < CEIL) { e.y = CEIL; e.vy = Math.abs(e.vy) * .3; }
    e.bob += .08;
  }

  function crumble(e) {
    for (var i = 0; i < 12; i++) {
      S.parts.push({
        x: e.x + rnd(0, e.w), y: e.y + rnd(0, e.h),
        vx: rnd(-2.5, 2.5), vy: rnd(-4, .5), life: rnd(18, 40), max: 40,
        c: i % 3 ? PAL.stone : PAL.stoneRim, s: rnd(2, 5)
      });
    }
  }

  function updateEnemies() {
    var ch = S.ch, f = S.field;
    var heldCount = 0;

    for (var i = S.enemies.length - 1; i >= 0; i--) {
      var e = S.enemies[i];
      if (e.dead) { S.enemies.splice(i, 1); continue; }
      if (e.spawnFx > 0) e.spawnFx--;
      if (e.flash > 0) e.flash--;

      var cx = e.x + e.w / 2, cy = e.y + e.h / 2;

      // 「不化」钉不住 —— 它只能靠脉冲砸碎
      var wasHeld = e.held;
      var wep = WEP();
      var inField = dist(cx, cy, f.x, f.y) <= f.r + Math.max(e.w, e.h) * 0.22;
      // 能不能攥看武器；「不化」只有 spike 武器按得住（现在三把都没有）
      // !! 是必需的：字段缺失时表达式会算出 undefined 而不是 false，
      // 行为上都是假值，但 held === false 这类严格判断会莫名其妙地挂。
      e.held = !!(inField && wep.canHold && (!e.T.noFreeze || wep.spike));
      e.inField = inField;
      e.live = !e.held;

      if (e.held && !wasHeld) {
        e.vx = 0; e.vy = 0;
        Sound.freeze();
        if (!e.wasHeld) { e.wasHeld = true; unlock('first'); }
      } else if (!e.held && wasHeld) {
        Sound.thaw();
      }

      if (e.held) { heldCount++; e.vx = 0; e.vy = 0; }   // 被钉死在原地
      // 灼烧三条件：这把武器烧不烧 · 「不化」一律不烧（它只吃脉冲）·
      // 以及「钉住的会烧；攥不住的武器（撒手）则圈里的都烧」
      var burning = !e.shield && wep.burnField && !e.T.noFreeze && (e.held || (e.inField && !wep.canHold));
      e.burning = burning;      // 渲染要靠它画血条
      if (burning) {
        e.dmgT = (e.dmgT || 0) + 1;
        var every = FIELD_DMG_EVERY / wep.dmgMul;      // 伤害倍率越高，掉血越密
        if (e.dmgT >= every) {
          e.dmgT -= every;
          e.hp--;
          e.flash = 5;
          if (e.hp <= 0) { killEnemy(e, false); continue; }
        }
      }
      if (!e.held) {
        if (!e.T.boss) {
          aiLive(e, ch);
          if (S.invuln <= 0 && S.mode === 'play' && aabb(ch, e)) hurt(1, cx);
        }
      }
    }

    S.field.hold = heldCount;
    if (heldCount > 0) tutSet(1);          // 第一次攥住 → 教学往下走一步
    if (heldCount >= 8) unlock('wall8');
    if (heldCount > 0 && isFinale()) S.finaleClean = false;
  }

  function updateBullets() {
    var ch = S.ch;
    for (var i = S.bullets.length - 1; i >= 0; i--) {
      var b = S.bullets[i];
      b.t++;
      b.live = true;              // 已经射出来的东西不受时间场影响 —— 射手因此永远有威胁
      b.x += b.vx; b.y += b.vy;
      if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30 || b.t > b.life) { S.bullets.splice(i, 1); continue; }
      if (S.invuln <= 0 && S.mode === 'play' &&
          b.x > ch.x - b.r && b.x < ch.x + ch.w + b.r && b.y > ch.y - b.r && b.y < ch.y + ch.h + b.r) {
        S.bullets.splice(i, 1);
        hurt(1, b.x);
      }
    }
  }

  // ══════════════════════════════════════════════════════════════
  // 10 · 玩家物理
  // ══════════════════════════════════════════════════════════════
  // 敌人不构成地形，场地里只有四堵墙
  // 每帧只算一次。原来 updateItems 把这个函数放在了道具循环【里面】——
  // 场上有几个道具就重建几次数组、几十个对象，全是喂给 GC 的垃圾。
  var _boxCache = null, _boxT = -1;
  function solidBoxes() {
    if (_boxT === S.t && _boxCache) return _boxCache;
    var out = [
      { x: 0, y: FLOOR, w: W, h: 90, t: 'wall' },
      { x: -70, y: 0, w: 70, h: H, t: 'wall' },
      { x: W, y: 0, w: 70, h: H, t: 'wall' },
      { x: 0, y: -80, w: W, h: 80 + CEIL, t: 'wall' }
    ];
    for (var i = 0; i < S.plats.length; i++) out.push(S.plats[i]);
    _boxT = S.t; _boxCache = out;
    return out;
  }

  function itemAt(x, y) {
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      if (it.got) continue;
      if (it.cool > 0) continue;          // 刚蹦出来的先别急着吃
      if (Math.abs(x - it.x) < 26 && Math.abs(y - it.y) < 30) return it;
    }
    return null;
  }

  function collideX(boxes) {
    var ch = S.ch;
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      if (b.t === 'plat') continue;          // 跳台不挡横向，从旁边可以直接走进去
      if (!aabb(ch, b)) continue;
      var ox = ovX(ch, b);
      if (ox <= 0) continue;
      ch.x += (ch.vx > .01) ? -ox : (ch.vx < -.01 ? ox : ((ch.x + ch.w / 2 < b.x + b.w / 2) ? -ox : ox));
      ch.vx = 0;
    }
  }
  function collideY(boxes) {
    var ch = S.ch;
    for (var i = 0; i < boxes.length; i++) {
      var b = boxes[i];
      // 单向跳台：往上跳的时候穿过去，只有下落且上一帧还在板子上方才踩得住。
      // 这就是治「站在正下方跳不上去」的标准解法。
      if (b.t === 'plat') {
        if (ch.dropT > 0 && b === ch.dropFrom) continue;   // 正从这块板上往下跳，放行
        if (ch.vy <= 0) continue;
        if ((ch.prevBottom === undefined ? ch.y + ch.h : ch.prevBottom) > b.y + 6) continue;
      }
      if (!aabb(ch, b)) continue;
      var oy = ovY(ch, b);
      if (oy <= 0) continue;
      if (ch.vy > .01) {
        ch.y -= oy;
        ch.grounded = true; ch.ground = b; ch.coyote = COYOTE;
        if (ch.vy > 6) { ch.sq = .76; ch.sqx = 1.24; ch.landT = 8; Sound.land(); }
        ch.vy = 0;
      } else if (ch.vy < -.01) {
        ch.y += oy; ch.vy = 0;
      } else {
        ch.y -= oy; ch.grounded = true; ch.ground = b; ch.coyote = COYOTE;
      }
    }
  }

  var keys = {};
  function K(k) { return !!keys[k]; }

  // 你攥着的东西是有重量的：空着手比所有敌人都快，攥满了就退回原速。
  // 于是「打」和「跑」变成一个真实的取舍 —— 也是终章唯一的活路。
  function moveSpeed() {
    // 「喘息」期间攥住不算数 —— 那是这套规则唯一的免罚时刻
    var held = S.breathe > 0 ? 0 : (S.field.hold || 0);
    var light = 1 - Math.min(held, 5) / 5;
    return MOVE * (1 + 0.46 * light);
  }

  function updatePlayer() {
    var ch = S.ch;
    if (!ch) return;

    var L = K('ArrowLeft') || K('a') || K('A');
    var R = K('ArrowRight') || K('d') || K('D');
    var U = K('ArrowUp') || K('w') || K('W');
    var D = K('ArrowDown') || K('s') || K('S');
    var J = K(' ') || K('Spacebar') || U || K('j') || K('J');   // W / ↑ 也是跳（README 早就这么写了，只是代码没接上）

    var spd = moveSpeed();
    var acc = ch.grounded ? 1 : .46;
    if (L && !R) { ch.vx -= spd * acc * .36; ch.face = -1; }
    else if (R && !L) { ch.vx += spd * acc * .36; ch.face = 1; }
    else { ch.vx *= ch.grounded ? FRIC : .93; if (Math.abs(ch.vx) < .08) ch.vx = 0; }
    ch.vx = clamp(ch.vx, -spd, spd);

    if (J && !ch.wasJump) ch.buf = BUFFER;
    ch.wasJump = J;
    if (ch.buf > 0) ch.buf--;
    if (ch.buf > 0 && ch.coyote > 0) {
      ch.vy = -JUMP; ch.buf = 0; ch.coyote = 0; ch.grounded = false;
      ch.jumpHold = 12; ch.sq = 1.3; ch.sqx = .74;
      Sound.jump();
      for (var p = 0; p < 6; p++) S.parts.push({ x: ch.x + PW / 2, y: ch.y + PH, vx: rnd(-2, 2), vy: rnd(-1, 2), life: 15, max: 15, c: PAL.dim, s: rnd(1.5, 3) });
    }
    if (ch.jumpHold > 0) { ch.jumpHold--; if (!J && ch.vy < -5) { ch.vy *= .5; ch.jumpHold = 0; } }

    // 下跳：站在跳台上按 S / ↓ 直接穿下去。
    // 单向跳台的标准搭档 —— 不然下了台就只能走到边缘掉下去。
    if (ch.dropT > 0) { ch.dropT--; if (ch.dropT === 0) ch.dropFrom = null; }
    if (has('drop') && D && !ch.wasDown && ch.grounded && ch.ground && ch.ground.t === 'plat') {
      ch.dropFrom = ch.ground;
      ch.dropT = 16;                      // 十几帧够穿过 18px 厚的板子
      ch.grounded = false; ch.ground = null; ch.coyote = 0;
      ch.vy = Math.max(ch.vy, 1.5);       // 往下蹭一下，手感才跟得上按键
      for (var q = 0; q < 5; q++) S.parts.push({ x: ch.x + PW / 2, y: ch.y + PH, vx: rnd(-1.6, 1.6), vy: rnd(-1.4, .4), life: 14, max: 14, c: PAL.dim, s: rnd(1.2, 2.4) });
      Sound.land();
    }
    ch.wasDown = D;

    ch.vy = Math.min(ch.vy + GRAV, MAXFALL);

    var boxes = solidBoxes();
    ch.x += ch.vx;
    collideX(boxes);
    ch.grounded = false; ch.ground = null;
    ch.prevBottom = ch.y + ch.h;            // 单向跳台要用上一帧的脚底位置
    ch.y += ch.vy;
    collideY(boxes);

    if (ch.grounded) ch.coyote = COYOTE; else if (ch.coyote > 0) ch.coyote--;

    if (Math.abs(ch.vx) > .6 && ch.grounded) {
      ch.walkT += Math.abs(ch.vx) * .1;
      ch.stepT++;
      if (ch.stepT % 12 === 0) Sound.land();
    } else if (!ch.grounded) ch.walkT += .05;
    ch.sq = lerp(ch.sq, 1, .2); ch.sqx = lerp(ch.sqx, 1, .2);
    if (ch.landT > 0) ch.landT--;
    ch.blinkT--; if (ch.blinkT <= 0) { ch.blink = 8; ch.blinkT = 90 + Math.floor(Math.random() * 140); }
    if (ch.blink > 0) ch.blink--;

    if (S.invuln > 0) S.invuln--;
  }

  // ══════════════════════════════════════════════════════════════
  // 11 · 主更新
  // ══════════════════════════════════════════════════════════════
  function updatePlay() {
    var f = S.field;
    if (S.pulse.cd > 0) S.pulse.cd--;
    if (S.pulse.fx > 0) S.pulse.fx = Math.max(0, S.pulse.fx - .08);

    S.runT++;
    f.pl += .012;

    // 通关后世界定格：不再更新角色、敌人、子弹 —— 只跑特效
    if (!S.worldFrozen) {
      updatePlayer();

      // 时间场用鼠标瞄 —— 它是你能施加影响的全部范围，本身不提供任何保护。
      // 每钉住一个敌人，圈就小一圈：你攥住的东西越多，你能攥住的越少。
      f.x = lerp(f.x, clamp(S.mouse.x, 34, W - 34), .30);
      f.y = lerp(f.y, clamp(S.mouse.y, CEIL - 6, FLOOR - 12), .30);

      updateEnemies();
      updateItems();
      // 教学那行字，学会后再挂 8 秒就收起来
      if (tutStage() === 2) { S.tutT++; if (S.tutT > 500) tutSet(3); }

      // 道具：走过去就吃到
      var pick = itemAt(S.ch.x + PW / 2, S.ch.y + PH / 2);
      if (pick) { pick.got = true; applyItem(pick.t, pick.x, pick.y); }

      // 喘息：攥住不算数
      var effHold = S.breathe > 0 ? 0 : S.field.hold;
      Music.update(effHold);              // 攥得越多，声音越闷

      var target = R_BASE * WEP().rMul * Math.max(R_FLOOR, 1 - effHold * R_SHRINK);
      f.r = lerp(f.r, target, R_LERP);

      updateBullets();
    }
    if (S.breathe > 0) S.breathe--;

    // ── 章节推进 ──
    if (S.chapterBreak > 0) {
      S.chapterBreak--;
      if (S.chapterBreak === 0) {
        // 自制关永远走「通关」页，不走结局 —— 它只是临时挂在表末尾的一张卡。
        // 上面 advanceClear 里堵过一次，这里是【另一条】通往结局的路，别再漏。
        if (!isCustomRun() && S.chapter >= CHAPTERS.length - 1) finishGame();
        else { S.mode = 'clear'; S.clearT = 0; }
      }
    } else if (isFinale()) {
      // 终章：走到门口、空着手、撑住三秒 —— 门才开。
      // 这三秒里你没有还手能力，只能躲。
      spawnTick();
      var d = S.door;
      var px2 = S.ch.x + PW / 2;
      d.near = Math.abs(px2 - (d.x + d.w / 2)) < 290;
      var charging = d.near && S.field.hold === 0;
      d.charge = clamp((d.charge || 0) + (charging ? 1 / 130 : -1 / 95), 0, 1);
      d.open = d.charge >= 1;
      d.glow = lerp(d.glow, d.open ? 1 : d.charge, .14);
      if (charging && d.charge > 0 && S.t % 12 === 0) Sound.tick();
      if (d.open && aabb(S.ch, d)) {
        S.chapterDone = true; S.chapterBreak = 90;
        freezeWorld();
        banner('真的结束了吗？', PAL.red); Sound.wave();
        if (S.finaleClean) unlock('nohold');
      }
    } else {
      S.chapterT++;
      if (S.boss) updateBoss();
      if (CHAPTER().infinite) updateWaves();
      if (S.warns.length) updateWarns();
      if (S.goal && !S.goalHit && aabb(S.ch, S.goal)) {
        // 「爬上去要空出手」—— 攥着东西站到顶上也白站
        if (!CHAPTER().goalQuiet || S.field.hold === 0) S.goalHit = true;
      }
      spawnTick();
      if (goalMet()) chapterClear();
    }

    // 粒子
    for (var i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .28; p.vx *= .99;
      p.life--;
      if (p.life <= 0) S.parts.splice(i, 1);
    }
    if (S.parts.length > 520) S.parts.splice(0, S.parts.length - 520);
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var fl = S.floats[j];
      fl.y -= .55; fl.t--;
      if (fl.t <= 0) S.floats.splice(j, 1);
    }
    if (S.bannerT > 0) S.bannerT--;
    if (S.freezeFx > 0) S.freezeFx = Math.max(0, S.freezeFx - .015);
    if (S.shake > .15) S.shake *= .87; else S.shake = 0;
    if (S.flash > 0) S.flash = Math.max(0, S.flash - .06);
  }

  function updateEggs() {
    if (Eggs.cat) {
      Eggs.cat.x += Eggs.cat.vx;
      Eggs.cat.t++;
      if (Eggs.cat.x > W + 80 || Eggs.cat.x < -80) Eggs.cat = null;
    }
    if (Eggs.glitch > 0) Eggs.glitch--;
    if (Eggs.msgT > 0) Eggs.msgT--; else Eggs.msg = null;
    for (var a = achQ.length - 1; a >= 0; a--) { achQ[a].t++; if (achQ[a].t > 200) achQ.splice(a, 1); }
  }

  function spawnCat() {
    if (Eggs.cat) return;
    Eggs.cat = { x: -70, vx: 1.6, t: 0 };
    unlock('cat');
    Sound.secret();
  }

  function checkKonami(k) {
    Eggs.konamiBuf.push(k);
    if (Eggs.konamiBuf.length > KONAMI.length) Eggs.konamiBuf.shift();
    if (Eggs.konamiBuf.length === KONAMI.length) {
      var ok = true;
      for (var i = 0; i < KONAMI.length; i++)
        if (String(Eggs.konamiBuf[i]).toLowerCase() !== String(KONAMI[i]).toLowerCase()) { ok = false; break; }
      if (ok) {
        Eggs.rainbow = !Eggs.rainbow;
        unlock('konami');
        Eggs.konamiBuf = [];
        Eggs.msg = Eggs.rainbow ? '彩虹模式' : '彩虹关闭';
        Eggs.msgT = 90;
      }
    }
  }

  function decayFx() {
    for (var i = S.parts.length - 1; i >= 0; i--) {
      var p = S.parts[i];
      p.x += p.vx; p.y += p.vy; p.vy += .28; p.vx *= .99; p.life--;
      if (p.life <= 0) S.parts.splice(i, 1);
    }
    for (var j = S.floats.length - 1; j >= 0; j--) {
      var fl = S.floats[j];
      fl.y -= .55; fl.t--;
      if (fl.t <= 0) S.floats.splice(j, 1);
    }
    if (S.bannerT > 0) S.bannerT--;
    if (S.freezeFx > 0) S.freezeFx = Math.max(0, S.freezeFx - .015);
    if (S.shake > .15) S.shake *= .87; else S.shake = 0;
    if (S.flash > 0) S.flash = Math.max(0, S.flash - .06);
  }

  function step() {
    Save.tick();   // 存盘攒够了才落盘（见 Save.later）
    // F8 打开后记录每帧耗时（保留最近 120 帧），用来抓卡顿的【峰值】而不是平均
    if (S.showFps) {
      var _n = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
      if (S._last) { S._ft.push(_n - S._last); if (S._ft.length > 120) S._ft.shift(); }
      S._last = _n;
    } else S._last = 0;
    S.t++;
    if (S.mode === 'play') updatePlay();
    else if (S.mode === 'title') { S.bootT++; decayFx(); }
    else if (S.mode === 'select') { S.selT++; decayFx(); }
    else if (S.mode === 'intro') { S.introT++; decayFx(); }
    else if (S.mode === 'pause') { S.pauseT++; }
    else if (S.mode === 'clear') { S.clearT++; decayFx(); }
    else if (S.mode === 'over') { S.over++; decayFx(); }
    else if (S.mode === 'ending') { S.endingT++; decayFx(); }
    updateEggs();
  }

  // ══════════════════════════════════════════════════════════════
  // 12 · 绘制
  // ══════════════════════════════════════════════════════════════
  var canvas = null, ctx = null;

  // ── 静态图层预烘焙 ──
  // 背景网格和暗角每帧都一样，没必要每帧现造全屏渐变（低配机上这是纯浪费）
  var bgLayer = null, vgLayer = null;
  function bakeLayers() {
    try {
      bgLayer = document.createElement('canvas');
      bgLayer.width = W; bgLayer.height = H;
      var b = bgLayer.getContext('2d');
      if (!b) { bgLayer = null; throw 0; }
      var g = b.createLinearGradient(0, 0, W * .3, H);
      g.addColorStop(0, PAL.bg0); g.addColorStop(1, PAL.bg1);
      b.fillStyle = g; b.fillRect(0, 0, W, H);
      b.strokeStyle = 'rgba(90,140,220,.045)'; b.lineWidth = 1;
      b.beginPath();
      for (var x = 0; x <= W; x += 48) { b.moveTo(x + .5, 0); b.lineTo(x + .5, H); }
      for (var y = 0; y <= H; y += 48) { b.moveTo(0, y + .5); b.lineTo(W, y + .5); }
      b.stroke();
    } catch (e) { bgLayer = null; }

    try {
      vgLayer = document.createElement('canvas');
      vgLayer.width = W; vgLayer.height = H;
      var v = vgLayer.getContext('2d');
      if (!v) { vgLayer = null; throw 0; }
      var vg = v.createRadialGradient(W / 2, H / 2, H * .34, W / 2, H / 2, H * .98);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.62)');
      v.fillStyle = vg; v.fillRect(0, 0, W, H);
    } catch (e) { vgLayer = null; }
  }

  // 廉价外发光：一层放大的半透明底。比 shadowBlur 便宜一个数量级。
  function glow(c, x, y, w, h, r, col, a) {
    c.globalAlpha = a;
    c.fillStyle = col;
    rr(c, x, y, w, h, r); c.fill();
    c.globalAlpha = 1;
  }

  function bug(x, y, w, h, r, a) { rr(ctx, x, y, w, h, r); ctx.globalAlpha = a; ctx.fill(); ctx.globalAlpha = 1; }

  function drawBg() {
    if (bgLayer) { ctx.drawImage(bgLayer, 0, 0); return; }
    // 兜底：离屏画布不可用时才现画
    var g = ctx.createLinearGradient(0, 0, W * .3, H);
    g.addColorStop(0, PAL.bg0); g.addColorStop(1, PAL.bg1);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(90,140,220,.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 0; x <= W; x += 48) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (var y = 0; y <= H; y += 48) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
  }

  function drawArena() {
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = PAL.wallTop;
    ctx.fillRect(0, FLOOR, W, 3);
    ctx.fillStyle = 'rgba(90,140,220,.10)';
    for (var x = 0; x < W; x += 48) ctx.fillRect(x, FLOOR + 6, 22, 2);
    ctx.fillStyle = PAL.wall;
    ctx.fillRect(0, 0, W, CEIL - 24);
    ctx.fillRect(0, CEIL - 24, 10, H);
    ctx.fillRect(W - 10, CEIL - 24, 10, H);
  }

  // 被时间场钉住的敌人：石头化，边缘有静止纹
  function drawPlats() {
    for (var i = 0; i < S.plats.length; i++) {
      var p = S.plats[i];
      ctx.globalAlpha = .5;
      ctx.fillStyle = '#05080f';
      rr(ctx, p.x + 3, p.y + 5, p.w, p.h, 4); ctx.fill();
      ctx.globalAlpha = 1;
      var g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      g.addColorStop(0, '#2c3752');
      g.addColorStop(1, '#161d2f');
      ctx.fillStyle = g;
      rr(ctx, p.x, p.y, p.w, p.h, 4); ctx.fill();
      // 顶面亮边：告诉玩家"这里踩得上去"
      ctx.fillStyle = 'rgba(120,215,255,.8)';
      ctx.fillRect(p.x + 4, p.y, p.w - 8, 2.5);
      ctx.strokeStyle = 'rgba(120,170,255,.22)';
      ctx.lineWidth = 1;
      rr(ctx, p.x + .5, p.y + .5, p.w - 1, p.h - 1, 4); ctx.stroke();
    }
  }

  // 「抵达」型的目标区：一圈会呼吸的光，站进去就算过
  // 背景里那只巨物。它不动，只有眼睛会走。
  function drawBoss() {
    var b = S.boss; if (!b) return;
    var cx = W / 2, cy = 150;
    ctx.save();
    ctx.globalAlpha = b.dead ? .18 : .92;
    var g = ctx.createRadialGradient(cx, cy, 20, cx, cy, 340);
    g.addColorStop(0, b.flash > 0 ? 'rgba(255,130,160,.95)' : 'rgba(96,26,70,.98)');
    g.addColorStop(.5, 'rgba(58,16,46,.9)');
    g.addColorStop(.82, 'rgba(30,8,26,.55)');
    g.addColorStop(1, 'rgba(8,5,14,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, cy, 330, 205, 0, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = b.dead ? .08 : .5;
    ctx.strokeStyle = 'rgba(255,90,130,.4)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(cx, cy, 330, 205, 0, 0, 6.2832); ctx.stroke();
    // 两只垂下来的「肩」，让它有个轮廓
    ctx.globalAlpha = b.dead ? .12 : .8;
    ctx.fillStyle = 'rgba(42,12,36,.98)';
    ctx.beginPath(); ctx.ellipse(cx - 236, cy + 78, 150, 118, -.3, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 236, cy + 78, 150, 118, .3, 0, 6.2832); ctx.fill();
    ctx.restore();

    if (b.dead) return;
    // 眼睛还收在本体里的时候，画个暗窝；落下来的时候画一圈红光
    if (b.up) {
      var pu = .5 + Math.sin(b.t * .16) * .5;
      ctx.save();
      ctx.globalAlpha = .2 + pu * .3;
      ctx.fillStyle = PAL.red;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, 62 + pu * 8, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = .75;
      ctx.strokeStyle = PAL.red; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(b.cx, b.cy, 54, 0, 6.2832); ctx.stroke();
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = .5;
      ctx.fillStyle = 'rgba(6,4,10,.9)';
      ctx.beginPath(); ctx.arc(W / 2, 146, 30, 0, 6.2832); ctx.fill();
      ctx.restore();
    }
  }

  function drawWarns() {
    for (var i = 0; i < S.warns.length; i++) {
      var w = S.warns[i], a = 1 - w.t / w.max;
      ctx.globalAlpha = .10 + a * .28;
      ctx.fillStyle = PAL.red;
      ctx.fillRect(w.x - 15, CEIL, 30, FLOOR - CEIL);
      ctx.globalAlpha = 1;
    }
  }

  function drawGoal() {
    if (!S.goal) return;
    var g = S.goal, pu = .5 + Math.sin(S.t * .07) * .5;
    // 站在圈里但手里还攥着东西 → 变红。不然玩家不知道差在哪
    var blocked = CHAPTER().goalQuiet && S.field.hold > 0 &&
                  aabb(S.ch, g) ? true : false;
    var col = blocked ? PAL.red : PAL.mint;
    ctx.save();
    ctx.globalAlpha = .13 + pu * .17;
    ctx.fillStyle = col;
    rr(ctx, g.x, g.y, g.w, g.h, 9); ctx.fill();
    ctx.globalAlpha = .45 + pu * .4;
    ctx.strokeStyle = col; ctx.lineWidth = blocked ? 3 : 2;
    rr(ctx, g.x + 1, g.y + 1, g.w - 2, g.h - 2, 9); ctx.stroke();
    ctx.restore();
  }

  // 正在被烧的敌人头顶挂血条。
  // 粉丝说「不知道怎么杀」—— 很大一部分是因为烧了半天屏幕上什么都没发生。
  function drawBars() {
    for (var i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.dead || !e.burning || e.hp <= 0) continue;
      var w = Math.max(28, e.w), x = e.x + e.w / 2 - w / 2, y = e.y - 10;
      var frac = clamp(e.hp / e.maxhp, 0, 1);
      ctx.fillStyle = 'rgba(4,8,18,.82)';
      rr(ctx, x - 1.5, y - 1.5, w + 3, 7, 3.5); ctx.fill();
      ctx.fillStyle = frac > .5 ? PAL.mint : (frac > .25 ? PAL.gold : PAL.red);
      rr(ctx, x, y, w * frac, 4, 2); ctx.fill();
    }
  }

  function drawItems() {
    for (var i = 0; i < S.items.length; i++) {
      var it = S.items[i];
      if (it.got) continue;
      var def = ITEMS[it.t] || ITEMS.shield;
      var bob = Math.sin(S.t * .055 + it.ph) * 4;
      var x = it.x, y = it.y + bob;
      ctx.globalAlpha = .2 + Math.sin(S.t * .09 + it.ph) * .07;
      ctx.fillStyle = def.c;
      ctx.beginPath(); ctx.arc(x, y, 23, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = def.c;
      rr(ctx, -9.5, -9.5, 19, 19, 5); ctx.fill();
      ctx.restore();
      // 三种道具用不同的内芯，一眼能分
      ctx.fillStyle = 'rgba(10,16,28,.88)';
      var k = def.c;
      if (it.t === 'shield') {
        ctx.beginPath();
        ctx.moveTo(x, y - 7); ctx.lineTo(x + 6, y - 3.5);
        ctx.lineTo(x + 6, y + 1.5); ctx.lineTo(x, y + 7);
        ctx.lineTo(x - 6, y + 1.5); ctx.lineTo(x - 6, y - 3.5);
        ctx.closePath(); ctx.fill();
      } else if (it.t === 'pulse') {
        ctx.beginPath(); ctx.arc(x, y, 3.4, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(10,16,28,.88)'; ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(x, y, 7, 0, 6.2832); ctx.stroke();
      } else {
        ctx.fillRect(x - 7, y - 4.5, 14, 2.2);
        ctx.fillRect(x - 4.5, y - 0.6, 9, 2.2);
        ctx.fillRect(x - 2, y + 3.3, 4, 2.2);
      }
    }
  }

  function drawHeldEnemy(e) {
    var x = e.x, y = e.y, w = e.w, h = e.h;
    var hpF = clamp(e.hp / e.maxhp, 0, 1);
    // 石头不需要投影模糊 —— 一块偏移的暗色就够，还快得多
    ctx.globalAlpha = .45;
    ctx.fillStyle = '#05080f';
    rr(ctx, x + 2, y + 5, w, h, 5); ctx.fill();
    ctx.globalAlpha = 1;
    rr(ctx, x, y, w, h, 5);
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, e.flash > 0 ? '#ffffff' : '#4a5474');
    g.addColorStop(1, PAL.stoneDark);
    ctx.fillStyle = g; ctx.fill();

    // 内部裂纹随血量增加
    var cracks = Math.floor((1 - hpF) * 4);
    if (cracks > 0) {
      ctx.strokeStyle = 'rgba(8,12,22,.9)'; ctx.lineWidth = 1.7;
      ctx.beginPath();
      for (var i = 0; i < cracks; i++) {
        var s = (i + 1) / (cracks + 1);
        ctx.moveTo(x + w * s, y + 2);
        ctx.lineTo(x + w * (s + .14) - 3, y + h * .5);
        ctx.lineTo(x + w * s + 2, y + h - 2);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(150,175,225,.5)'; ctx.lineWidth = 1.4;
    rr(ctx, x + .5, y + .5, w - 1, h - 1, 5); ctx.stroke();

    // 静止纹：几道水平的扫描线，暗示「时间在这里不动」
    ctx.save();
    rr(ctx, x, y, w, h, 5); ctx.clip();
    ctx.globalAlpha = .28;
    ctx.strokeStyle = PAL.cy; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var k = 0; k < 3; k++) {
      var yy = y + ((S.t * .35 + k * h / 3) % h);
      ctx.moveTo(x, yy); ctx.lineTo(x + w, yy);
    }
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;

    // 头顶：正在被烧掉的血条
    if (e.hp < e.maxhp) {
      var bw = w + 6;
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(x + w / 2 - bw / 2, y - 9, bw, 4);
      ctx.fillStyle = PAL.cy;
      ctx.fillRect(x + w / 2 - bw / 2, y - 9, bw * hpF, 4);
    }
  }

  function drawLive(e) {
    var T = e.T, hue = Eggs.rainbow ? ((S.t * 4 + e.wave * 60) % 360) : T.hue;
    var x = e.x, y = e.y + Math.sin(e.bob) * 2, w = e.w, h = e.h;
    var flash = e.flash > 0;
    // 外发光用"放大的半透明底"代替 shadowBlur —— 一屏十个敌人时这是数量级的差别
    glow(ctx, x - 5, y - 5, w + 10, h + 10, 9, hsl(hue, 95, 60), flash ? .5 : .26);
    rr(ctx, x, y, w, h, 6);
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, flash ? '#ffffff' : hsl(hue, 85, 68));
    g.addColorStop(1, flash ? '#ffd9e0' : hsl((hue + 20) % 360, 82, 42));
    ctx.fillStyle = g; ctx.fill();
    rr(ctx, x + .7, y + .7, w - 1.4, h - 1.4, 6);
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1.3; ctx.stroke();

    // 蓄力预警
    if (e.chargeState === 1) {
      var p = 1 - clamp(e.chargeT / 34, 0, 1);
      ctx.globalAlpha = .35 + Math.sin(S.t * .8) * .3;
      ctx.strokeStyle = PAL.red; ctx.lineWidth = 3;
      rr(ctx, x - 4, y - 4, w + 8, h + 8, 8); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,90,110,.8)'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + w / 2, y + h / 2);
      ctx.lineTo(x + w / 2 + e.face * (30 + p * 120), y + h / 2);
      ctx.stroke();
    }

    // 眼睛 / 特征
    var cx = x + w / 2, cy = y + h / 2;
    ctx.fillStyle = '#0a0f1c';
    if (T.noFreeze) {
      ctx.strokeStyle = '#ffe3e6'; ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (var k = 0; k < 4; k++) {
        var a = S.t * .05 + k * 1.5708;
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * w * .42, cy + Math.sin(a) * h * .42);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, 6.2832); ctx.fillStyle = '#ffe3e6'; ctx.fill();
    } else if (e.type === 'shooter') {
      ctx.beginPath(); ctx.arc(cx - 5, cy - 2, 2.6, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 5, cy - 2, 2.6, 0, 6.2832); ctx.fill();
      ctx.fillRect(cx - 3, cy + 5, 6, 2);
    } else {
      var ex = cx + e.face * 3;
      ctx.beginPath(); ctx.arc(ex - 4, cy - 1, 2.8, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 4, cy - 1, 2.8, 0, 6.2832); ctx.fill();
    }
    // 血条
    if (!T.noFreeze && e.hp < e.maxhp) {
      var bw = w + 6;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(cx - bw / 2, y - 8, bw, 4);
      ctx.fillStyle = hsl(hue, 90, 62);
      ctx.fillRect(cx - bw / 2, y - 8, bw * clamp(e.hp / e.maxhp, 0, 1), 4);
    }
  }

  function drawPlayer() {
    var ch = S.ch;
    if (!ch || S.mode === 'over') return;
    // 无敌帧只闪透明度，不能整帧不画 —— 那样玩家会有一半时间看不见自己。
    // 世界定格之后就别闪了：那时候的无敌是"赢了"，不是"刚挨打"。
    var blink = (S.invuln > 0 && !S.worldFrozen && Math.floor(S.t / 4) % 2 === 0);
    var sq = ch.sq, sqx = ch.sqx;
    var w = PW * sqx, h = PH * sq;
    var x = ch.x + (PW - w) / 2, y = ch.y + (PH - h);
    ctx.save();
    ctx.globalAlpha = blink ? .38 : 1;
    ctx.save();
    ctx.globalAlpha = .3; ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(ch.x + PW / 2, ch.y + PH + 3, PW * .6, 3.4, 0, 0, 6.2832); ctx.fill();
    ctx.restore();

    glow(ctx, x - 7, y - 7, w + 14, h + 14, 11, PAL.cy, .34);
    // 护盾：角色外面套一圈会呼吸的光环
    if (S.shield > 0) {
      ctx.strokeStyle = 'rgba(107,227,255,.95)';
      ctx.lineWidth = 2.4;
      ctx.globalAlpha = .5 + Math.sin(S.t * .13) * .32;
      rr(ctx, x - 9, y - 9, w + 18, h + 18, 13); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    rr(ctx, x, y, w, h, 6);
    var g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, '#d8feff'); g.addColorStop(1, PAL.cy);
    ctx.fillStyle = g; ctx.fill();
    rr(ctx, x + .8, y + .8, w - 1.6, h - 1.6, 5.4);
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.4; ctx.stroke();
    var ex = x + w / 2 + ch.face * 1.8, ey = y + h * .35;
    ctx.fillStyle = '#06121c';
    if (ch.blink > 0) { ctx.fillRect(ex - 4.5, ey, 3, 1.8); ctx.fillRect(ex + 1.5, ey, 3, 1.8); }
    else {
      ctx.beginPath(); ctx.arc(ex - 3, ey, 2, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 3.2, ey, 2, 0, 6.2832); ctx.fill();
    }
    ctx.restore();
  }

  function drawCat() {
    if (!Eggs.cat) return;
    var c = Eggs.cat, y = FLOOR - 18;
    ctx.save();
    ctx.translate(c.x, y);
    var bob = Math.sin(c.t * .25) * 1.5;
    ctx.fillStyle = '#1d2540';
    rr(ctx, -16, -9 + bob, 30, 11, 5); ctx.fill();
    rr(ctx, 12, -17 + bob, 14, 14, 5); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(14, -16 + bob); ctx.lineTo(17, -23 + bob); ctx.lineTo(20, -16 + bob);
    ctx.moveTo(21, -16 + bob); ctx.lineTo(24, -23 + bob); ctx.lineTo(26, -16 + bob);
    ctx.fill();
    ctx.strokeStyle = '#1d2540'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-16, -4 + bob);
    ctx.quadraticCurveTo(-26, -6 + bob + Math.sin(c.t * .12) * 4, -24, -17 + bob + Math.sin(c.t * .12) * 3);
    ctx.stroke();
    ctx.fillStyle = PAL.gold;
    ctx.beginPath(); ctx.arc(17, -10 + bob, 1.6, 0, 6.2832); ctx.fill();
    ctx.beginPath(); ctx.arc(23, -10 + bob, 1.6, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    for (var i = 0; i < S.bullets.length; i++) {
      var b = S.bullets[i];
      if (b.live) {
        ctx.globalAlpha = .28;
        ctx.fillStyle = PAL.pink;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = b.live ? '#ffe0ea' : 'rgba(150,165,205,.62)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832); ctx.fill();
      if (!b.live) { ctx.strokeStyle = 'rgba(150,175,225,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, 6.2832); ctx.stroke(); }
    }
  }

  function drawParts() {
    for (var i = 0; i < S.parts.length; i++) {
      var p = S.parts[i];
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    ctx.globalAlpha = 1;
  }

  function drawField() {
    var f = S.field;
    // 圈外压暗
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.arc(f.x, f.y, f.r, 0, 6.2832, true);
    ctx.fillStyle = 'rgba(4,8,18,.52)';
    ctx.fill();
    // 场内微光
    var rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    rg.addColorStop(0, 'rgba(79,227,255,.10)');
    rg.addColorStop(.72, 'rgba(79,227,255,.045)');
    rg.addColorStop(1, 'rgba(79,227,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    // 环：外发光用两层描边，不用阴影模糊
    ctx.strokeStyle = 'rgba(79,227,255,.17)'; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.stroke();
    var ringing = S.breathe > 0;
    var wid = WEP().id;
    ctx.strokeStyle = ringing ? 'rgba(255,209,102,.95)'
                    : (wid === 'scope' ? 'rgba(255,150,150,.92)' : 'rgba(140,240,255,.92)');
    ctx.lineWidth = 2.2;
    // 「撒手」画成虚线 —— 它什么也攥不住，实线圈会骗人
    if (wid === 'letgo') { try { ctx.setLineDash([9, 11]); } catch (e) {} }
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.stroke();
    if (wid === 'letgo') { try { ctx.setLineDash([]); } catch (e) {} }

    // 狙击镜：十字准星。它是个用来「瞄」的东西，没有准星说不过去。
    if (wid === 'scope') {
      var gap = Math.max(5, f.r * .13);
      var arm = f.r * .95;
      ctx.strokeStyle = 'rgba(255,150,150,.9)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(f.x - arm, f.y); ctx.lineTo(f.x - gap, f.y);
      ctx.moveTo(f.x + gap, f.y); ctx.lineTo(f.x + arm, f.y);
      ctx.moveTo(f.x, f.y - arm); ctx.lineTo(f.x, f.y - gap);
      ctx.moveTo(f.x, f.y + gap); ctx.lineTo(f.x, f.y + arm);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,120,.95)';
      ctx.beginPath(); ctx.arc(f.x, f.y, 2, 0, 6.2832); ctx.fill();
      // 环上的刻度：每 30° 一根，整点那几根长一些
      for (var tk = 0; tk < 12; tk++) {
        var ta = tk * Math.PI / 6;
        var r1 = f.r - (tk % 3 === 0 ? 12 : 6), r2 = f.r - 1;
        ctx.strokeStyle = 'rgba(255,160,160,.5)'; ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(ta) * r1, f.y + Math.sin(ta) * r1);
        ctx.lineTo(f.x + Math.cos(ta) * r2, f.y + Math.sin(ta) * r2);
        ctx.stroke();
      }
    }
    if (ringing) {
      // 剩余时间画成一段弧
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r + 6, -1.5708, -1.5708 + 6.2832 * (S.breathe / BREATHE_TIME));
      ctx.stroke();
    }
    // 圈心画个小准星 —— 不然玩家不觉得这个圈跟自己手上的鼠标有关系。
    // 「不知道怎么杀」有一半是不知道圈跟着鼠标跑。
    ctx.strokeStyle = 'rgba(205,240,255,.8)';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(f.x, f.y, 6.5, 0, 6.2832); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(f.x - 13, f.y); ctx.lineTo(f.x - 9.5, f.y);
    ctx.moveTo(f.x + 9.5, f.y); ctx.lineTo(f.x + 13, f.y);
    ctx.moveTo(f.x, f.y - 13); ctx.lineTo(f.x, f.y - 9.5);
    ctx.moveTo(f.x, f.y + 9.5); ctx.lineTo(f.x, f.y + 13);
    ctx.stroke();

    // 流动刻度
    ctx.strokeStyle = 'rgba(79,227,255,.45)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < 12; i++) {
      var a = f.pl + i * .5236;
      var r1 = f.r - 8, r2 = f.r - 3;
      ctx.moveTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1);
      ctx.lineTo(f.x + Math.cos(a) * r2, f.y + Math.sin(a) * r2);
    }
    ctx.stroke();
    // 脉冲波
    if (S.pulse.fx > 0) {
      ctx.globalAlpha = S.pulse.fx * .85;
      ctx.strokeStyle = PAL.cy; ctx.lineWidth = 5 * S.pulse.fx + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.25 - S.pulse.fx * .45), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // 圈里钉住了几个
    var n = f.hold;
    if (n > 0) {
      ctx.globalAlpha = .4 + Math.sin(S.t * .25) * .18;
      ctx.strokeStyle = PAL.cy; ctx.lineWidth = 3;
      ctx.setLineDash([13, 9]);
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 7, 0, 6.2832); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }
  }

  // ══════════════════════════════════════════════════════════════
  // 主题
  // 用 canvas 元素上的 CSS filter 切换整套配色 —— GPU 合成，几乎零成本。
  // 这样就不用去动那 87 处 rgba 和 33 处硬编码十六进制色。
  // ══════════════════════════════════════════════════════════════
  // 只留「夜」。雪那套是靠 canvas 的 CSS filter 反色做的 ——
  // 白底上一堆冷色元素糊成一片，实际玩的人看不清屏幕。玩的人比本喵有发言权，删掉。
  var THEMES = [
    { n: '夜', f: 'none' }
  ];
  function applyTheme(i, quiet) {
    var n = THEMES.length;
    S.theme = (((i | 0) % n) + n) % n;
    try { if (canvas && canvas.style) canvas.style.filter = THEMES[S.theme].f; } catch (e) {}
    try { var sv = Save.get(); sv.theme = S.theme; Save.flush(); } catch (e) {}
    if (!quiet) {
      S.floats.push({ s: '主题 · ' + THEMES[S.theme].n, x: W / 2, y: 128, t: 90, c: PAL.gold });
      Sound.ui();
    }
  }

  function heartPath(x, y, s, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.moveTo(x, y + s * .35);
    ctx.bezierCurveTo(x, y - s * .35, x - s, y + s * .1, x, y + s);
    ctx.bezierCurveTo(x + s, y + s * .1, x, y - s * .35, x, y + s * .35);
    ctx.fill();
  }

  function drawHUD() {
    // 血
    var mh = S.maxHp || MAX_HP;
    for (var i = 0; i < mh; i++) {
      var x = 22 + i * 30, y = 24;
      var on = i < S.hp;
      // 画一大一小两颗心当发光，比 shadowBlur 便宜得多
      if (on) heartPath(x, y, 15, 'rgba(255,93,132,.26)');
      heartPath(x, y, 11, on ? PAL.pink : 'rgba(120,140,180,.22)');
      if (i === mh - 1 && S.shield > 0) {
        // 血量右边：护盾还剩几层
        txt(ctx, '护盾 ×' + S.shield, x + 22, y + 5, { s: 13, c: PAL.cy, w: '800' });
      }
    }
    var C = CHAPTER();
    if (S.breathe > 0) {
      txt(ctx, '喘 息 · 攥住不算数  ' + (S.breathe / 60).toFixed(1) + 's',
        W / 2, 66, { a: 'center', s: 13, c: PAL.gold, w: '800', glow: 'rgba(255,209,102,.8)', blur: 12 });
    }
    if (isFinale()) {
      var d9 = S.door, op = d9 && d9.open;
      txt(ctx, '第 ' + (S.chapter + 1) + ' 章 · 放手', W / 2, 24,
        { a: 'center', s: 17, c: op ? PAL.gold : PAL.cy, glow: op ? 'rgba(255,209,102,.8)' : 'rgba(79,227,255,.7)', blur: 14 });
      var hint = !d9 ? '' :
        op ? '门开了 —— 走进去' :
        !d9.near ? '走到右边那扇门' :
        (S.field.hold === 0 ? '松着，别动' : '把圈甩到没人的角落 —— 你手里还攥着东西');
      txt(ctx, hint, W / 2, 45,
        { a: 'center', s: 11.5, c: op ? PAL.gold : (d9 && d9.near && S.field.hold > 0 ? PAL.red : PAL.dim), w: '700' });
    } else {
      // 无限不是「第 14 章」，它是另一回事，别给它安个章号
      txt(ctx, (C.infinite || C.workshop || C.__custom ? C.n : '第 ' + (S.chapter + 1) + ' 章 · ' + C.n), W / 2, 24, { a: 'center', s: 17, c: PAL.cy, glow: 'rgba(79,227,255,.7)', blur: 14 });
      txt(ctx, goalLabel(), W / 2, 45,
        { a: 'center', s: 11.5, c: goalMet() ? PAL.mint : PAL.dim, w: '700' });
    }
    txt(ctx, '击杀 ' + S.runKills, W - 22, 24, { a: 'right', s: 15, c: PAL.gold, glow: 'rgba(255,209,102,.6)', blur: 12 });
    // 武器槽位：写成「2 狙击镜」这样，玩家才知道按几能换
    var slotX = W - 22;
    for (var ws = WEAPONS.length - 1; ws >= 0; ws--) {
      if (!owns(ws)) continue;
      var onSlot = S.weapon === ws;
      var slotTxt = (ws + 1) + ' ' + WEAPONS[ws].n;
      txt(ctx, slotTxt, slotX, 45,
        { a: 'right', s: 11.5, c: onSlot ? PAL.gold : 'rgba(140,165,210,.55)', w: onSlot ? '800' : '600' });
      var wpx = 0;
      for (var sc = 0; sc < slotTxt.length; sc++) wpx += slotTxt.charCodeAt(sc) > 255 ? 11.5 : 6.2;
      slotX -= wpx + 14;
    }
    // 第 13 章：顶上一条巨物的血条
    if (S.boss && !S.boss.dead && S.mode === 'play') {
      var bw2 = 520, bx2 = W / 2 - bw2 / 2, by2 = 66;
      var bf = clamp(S.boss.hp / S.boss.maxhp, 0, 1);
      ctx.fillStyle = 'rgba(6,8,16,.85)';
      rr(ctx, bx2 - 3, by2 - 3, bw2 + 6, 16, 8); ctx.fill();
      ctx.fillStyle = S.boss.phase === 3 ? PAL.red : (S.boss.phase === 2 ? PAL.gold : 'rgba(255,120,150,.9)');
      rr(ctx, bx2, by2, bw2 * bf, 10, 5); ctx.fill();
      txt(ctx, (S.boss.up ? '眼睛在外面 —— 打它' : '它闭着眼…'), W / 2, by2 + 30,
        { a: 'center', s: 12.5, c: S.boss.up ? PAL.gold : 'rgba(150,175,215,.8)', w: '800' });
    }
    // 攥不住的武器打不动眼睛 —— 和不化那条一个道理
    if (S.boss && !S.boss.dead && S.boss.up && !WEP().canHold && WEP().id !== 'scope') {
      txt(ctx, '这把武器攥不住那只眼睛 —— 按 1 或 2 换', W / 2, 490,
        { a: 'center', s: 13, c: PAL.red, w: '800', glow: 'rgba(255,80,110,.6)', blur: 10 });
    }

    if (S.showFps && S._ft && S._ft.length > 4) {
      var mx = 0, sum = 0;
      for (var fi = 0; fi < S._ft.length; fi++) { sum += S._ft[fi]; if (S._ft[fi] > mx) mx = S._ft[fi]; }
      var avg = sum / S._ft.length;
      txt(ctx, '平均 ' + avg.toFixed(1) + 'ms　峰值 ' + mx.toFixed(1) + 'ms　( ' + S._ft.length + ' )',
        W - 14, 66, { a: 'right', s: 12.5, c: mx > 34 ? PAL.red : PAL.mint, w: '800' });
    }

    // 第一次玩：把「怎么杀」直接摆在屏幕中间
    var tl = tutLine();
    if (tl && S.mode === 'play' && !S.boss) {   // 和 boss 血条抢位置，让位
      var tw = 0;
      for (var ti = 0; ti < tl.length; ti++) tw += tl.charCodeAt(ti) > 255 ? 15.5 : 8;
      ctx.fillStyle = 'rgba(6,10,20,.78)';
      // 放顶部，别压住角色 —— 第一次玩的人最需要看清自己
      rr(ctx, W / 2 - tw / 2 - 20, 62, tw + 40, 34, 10); ctx.fill();
      txt(ctx, tl, W / 2, 84, { a: 'center', s: 15, c: PAL.gold, w: '800' });
    }

    // 手里这把砸不动「不化」，场上有它 —— 不提醒的话玩家会以为游戏坏了
    // （尤其第 7 章「独」全是「不化」，带着「撒手」进去是打不通的）
    if (!WEP().spikeKill) {
      for (var hs = 0; hs < S.enemies.length; hs++) {
        if (!S.enemies[hs].dead && S.enemies[hs].T.noFreeze) {
          txt(ctx, '「不化」砸不动 —— 按 1 或 2 换把武器', W / 2, 490,
            { a: 'center', s: 13, c: PAL.red, w: '800', glow: 'rgba(255,80,110,.6)', blur: 10 });
          break;
        }
      }
    }

    // 底部只留一条脉冲 CD；放在地板下方，不会压到角色
    // （时间场的大小由圈本身表达，不需要再画一条）
    var qw = 168, qx = W / 2 - qw / 2, qy = H - 15;
    var f = 1 - S.pulse.cd / WEP().cd;   // 每把武器 CD 不同，进度条得跟着走
    txt(ctx, '脉冲', qx - 8, qy, { a: 'right', s: 10, c: f >= 1 ? PAL.cy : PAL.faint, w: '700' });
    ctx.fillStyle = 'rgba(10,16,30,.8)';
    rr(ctx, qx, qy - 5, qw, 10, 5); ctx.fill();
    if (f > 0) {
      ctx.fillStyle = f >= 1 ? PAL.cy : 'rgba(79,227,255,.42)';
      rr(ctx, qx + 2, qy - 3, (qw - 4) * f, 6, 3); ctx.fill();
    }
    if (f >= 1 && S.t % 60 < 40) {
      txt(ctx, '右键', qx + qw + 8, qy, { a: 'left', s: 10, c: PAL.cy, w: '700' });
    }

    // 攥住数量：贴着圈画，视线不用离开战场
    if (S.field.hold > 0) {
      var t01 = clamp((S.field.r / R_BASE - R_FLOOR) / (1 - R_FLOOR), 0, 1);
      txt(ctx, '攥住 ×' + S.field.hold, S.field.x, S.field.y + S.field.r + 20,
        { a: 'center', s: 12, c: t01 > .5 ? PAL.cy : PAL.orange, w: '700', glow: 'rgba(0,0,0,.9)', blur: 8 });
    }
  }

  function drawBanner() {
    if (S.bannerT <= 0 || !S.banner) return;
    var a = S.bannerT > 80 ? (110 - S.bannerT) / 30 : (S.bannerT < 30 ? S.bannerT / 30 : 1);
    var sc = 1 + (1 - clamp(a, 0, 1)) * .3;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(W / 2, 150);
    ctx.scale(sc, sc);
    txt(ctx, S.banner.s, 0, 0, { a: 'center', s: 40, c: S.banner.c, w: '800', glow: 'rgba(0,0,0,.8)', blur: 20 });
    ctx.restore();
  }

  function drawFloats() {
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      ctx.globalAlpha = clamp(f.t / 40, 0, 1);
      txt(ctx, f.s, f.x, f.y, { a: 'center', s: 14, c: f.c, glow: 'rgba(0,0,0,.8)', blur: 8 });
    }
    ctx.globalAlpha = 1;
  }

  function drawToasts() {
    for (var i = 0; i < achQ.length; i++) {
      var a = achQ[i];
      var ain = clamp(a.t / 12, 0, 1), aout = clamp((200 - a.t) / 20, 0, 1);
      var al = Math.min(ain, aout);
      var y = 62 + i * 52, x = W - 260;      // 放右上：右下角是终章那扇门的位置
      ctx.globalAlpha = al;
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(14,20,36,.97)';
      rr(ctx, x, y, 244, 44, 9); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = 'rgba(255,209,102,.55)'; ctx.lineWidth = 1;
      rr(ctx, x + .5, y + .5, 243, 43, 9); ctx.stroke();
      ctx.fillStyle = PAL.gold;
      ctx.beginPath();
      for (var s = 0; s < 10; s++) {
        var ang = -1.5708 + s * .6283, rad = s % 2 ? 3.4 : 7.5;
        ctx[s ? 'lineTo' : 'moveTo'](x + 25 + Math.cos(ang) * rad, y + 22 + Math.sin(ang) * rad);
      }
      ctx.closePath(); ctx.fill();
      txt(ctx, '成就', x + 42, y + 14, { s: 9.5, c: 'rgba(255,209,102,.85)' });
      txt(ctx, a.n, x + 42, y + 28, { s: 13, c: PAL.ink });
      txt(ctx, a.d, x + 130, y + 28, { s: 9.5, c: 'rgba(150,170,210,.75)', w: '500' });
      ctx.globalAlpha = 1;
    }
  }

  function drawGlitch() {
    if (Eggs.glitch <= 0) return;
    for (var i = 0; i < 10; i++) {
      ctx.globalAlpha = .1 + Math.random() * .16;
      ctx.fillStyle = Math.random() < .5 ? PAL.mint : PAL.pink;
      ctx.fillRect(0, Math.random() * H, W, 2 + Math.random() * 14);
    }
    ctx.globalAlpha = 1;
  }

  // ── 终章的门：只在 hold===0 时打开 ──
  function drawDoor() {
    var d = S.door; if (!d) return;
    var o = d.glow, x = d.x, y = d.y, w = d.w, h = d.h;
    ctx.save();
    ctx.shadowColor = 'rgba(255,209,102,' + (.35 + o * .6) + ')';
    ctx.shadowBlur = 8 + o * 34;
    // 门框随充能变暖；但"开没开"只看 d.open —— 否则充一半就亮得像开了
    ctx.fillStyle = hsl(44, 35 + o * 55, 18 + o * 42);
    rr(ctx, x, y, w, h, 9); ctx.fill();
    ctx.restore();
    ctx.fillStyle = d.open ? 'rgba(255,242,205,.96)' : 'rgba(8,12,24,.94)';
    rr(ctx, x + 9, y + 12, w - 18, h - 20, 5); ctx.fill();
    if (d.open) {
      ctx.save();
      rr(ctx, x + 9, y + 12, w - 18, h - 20, 5); ctx.clip();
      ctx.globalAlpha = .35 + Math.sin(S.t * .12) * .18;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (var i = 0; i < 5; i++) {
        var yy = y + 14 + ((S.t * .8 + i * 24) % (h - 24));
        ctx.moveTo(x + 12, yy); ctx.lineTo(x + w - 12, yy);
      }
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    if (d.open) {
      txt(ctx, '开 着', x + w / 2, y - 20,
        { a: 'center', s: 14, c: PAL.gold, w: '700', glow: 'rgba(255,209,102,.9)', blur: 14 });
      txt(ctx, '进去', x + w / 2, y - 40, { a: 'center', s: 11, c: 'rgba(255,235,180,.9)', w: '600' });
    } else {
      // 门闩进度环：站在门口、空着手，才会往上走
      var cg = clamp(d.charge || 0, 0, 1);
      var cx2 = x + w / 2, cy2 = y - 30;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(120,150,200,.26)'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(cx2, cy2, 17, 0, 6.2832); ctx.stroke();
      if (cg > 0) {
        ctx.strokeStyle = PAL.gold;
        ctx.shadowColor = 'rgba(255,209,102,.8)'; ctx.shadowBlur = 12;
        ctx.beginPath(); ctx.arc(cx2, cy2, 17, -1.5708, -1.5708 + 6.2832 * cg); ctx.stroke();
      }
      ctx.restore();
      var ok2 = d.near && S.field.hold === 0;
      txt(ctx, !d.near ? '走到门口' : (ok2 ? '别动，松着' : '手上有东西！'),
        cx2, cy2 - 32,
        { a: 'center', s: 11.5, c: ok2 ? PAL.gold : (d.near ? PAL.red : 'rgba(140,160,200,.65)'), w: '700' });
    }
  }

  // ── 选章 ──
  function drawSelect() {
    ctx.fillStyle = 'rgba(4,7,14,.93)';
    ctx.fillRect(0, 0, W, H);
    txt(ctx, '静 止', W / 2, 62, { a: 'center', s: 34, c: PAL.ink, w: '800', glow: 'rgba(79,227,255,.6)', blur: 11 });
    txt(ctx, CN_CHAPTERS.split('').join(' ') + ' 章', W / 2, 96, { a: 'center', s: 13, c: PAL.cy, w: '700' });

    var sv = Save.get();
    for (var i = 0; i < CHAPTERS.length; i++) {
      var cell = selectCell(i);
      var x = cell.x, y = cell.y, cw = cell.w, chh = cell.h;
      var sel = (i === S.selIdx);
      var done = (i + 1) < (sv.unlocked || 1);
      var C = CHAPTERS[i];
      // 点不了的章：整块压黑、连名字都是暗的
      if (!canPick(i)) {
        ctx.fillStyle = 'rgba(6,8,14,.82)';
        rr(ctx, x, y, cw, chh, 11); ctx.fill();
        txt(ctx, (i + 1) + '　' + C.n, x + 16, y + 25, { s: 18, c: 'rgba(90,105,135,.5)', w: '700' });
        continue;
      }
      // 上锁时变红的只有「真终章」那一张 —— 无限那张卡有自己的绿边，不该被涂红
      if (lockedToLast() && !C.infinite) {
        ctx.save();
        ctx.shadowColor = 'rgba(255,60,90,.75)'; ctx.shadowBlur = 26;
        ctx.fillStyle = 'rgba(255,60,90,.2)';
        rr(ctx, x, y, cw, chh, 11); ctx.fill();
        ctx.restore();
        ctx.strokeStyle = PAL.red; ctx.lineWidth = 2.4;
        rr(ctx, x + 1, y + 1, cw - 2, chh - 2, 11); ctx.stroke();
        txt(ctx, (i + 1) + '　' + C.n, x + 16, y + 25, { s: 18, c: '#ffdde4', w: '800' });
        txt(ctx, '真的结束了吗', x + 16, y + 49, { s: 11.5, c: 'rgba(255,150,170,.9)', w: '600' });
        continue;
      }
      if (sel) {
        ctx.save();
        ctx.shadowColor = 'rgba(79,227,255,.55)'; ctx.shadowBlur = 18;
        ctx.fillStyle = 'rgba(79,227,255,.16)';
        rr(ctx, x, y, cw, chh, 11); ctx.fill();
        ctx.restore();
        ctx.strokeStyle = PAL.cy; ctx.lineWidth = 2;
        rr(ctx, x + 1, y + 1, cw - 2, chh - 2, 11); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(120,150,220,.055)';
        rr(ctx, x, y, cw, chh, 11); ctx.fill();
        ctx.strokeStyle = 'rgba(120,160,230,.16)'; ctx.lineWidth = 1;
        rr(ctx, x + .5, y + .5, cw - 1, chh - 1, 11); ctx.stroke();
      }
      if (C.finale) {
        ctx.fillStyle = sel ? PAL.gold : 'rgba(255,209,102,.55)';
        ctx.fillRect(x, y + chh - 3, cw, 3);
      }
      if (C.infinite) {
        ctx.fillStyle = sel ? PAL.mint : 'rgba(95,240,192,.5)';
        ctx.fillRect(x, y + chh - 3, cw, 3);
      }
      txt(ctx, (i + 1) + '　' + C.n, x + 16, y + 25, { s: 18, c: sel ? PAL.ink : 'rgba(200,220,250,.85)', w: '700' });
      txt(ctx, fitText(C.sel || String(C.sub).split('\n')[0], cw - 32, 11.5), x + 16, y + 49,
        { s: 11.5, c: 'rgba(150,175,220,.72)', w: '500' });
      if (C.finale) txt(ctx, '终章', x + cw - 16, y + 25, { a: 'right', s: 11, c: PAL.gold, w: '700' });
      if (C.infinite) txt(ctx, '∞', x + cw - 18, y + 26, { a: 'right', s: 20, c: PAL.mint, w: '800' });
      if (done) txt(ctx, '✓', x + cw - 16, y + 49, { a: 'right', s: 13, c: PAL.mint, w: '700' });
    }
    txt(ctx, '← → ↑ ↓ / 鼠标 选章　·　空格 / 回车 / 点击 进入　·　B 商店　·　Esc 回首页', W / 2, 518,
      { a: 'center', s: 12.5, c: 'rgba(190,210,245,.85)', w: '600' });
    txt(ctx, '本喵不锁门 —— ' + CN_CHAPTERS + '章从第一秒起就都开着。想先看结局也行。',
      W / 2, 542, { a: 'center', s: 11, c: 'rgba(130,155,200,.7)', w: '500' });
    // 左上角：回首页。老板报「回不到首页」—— 选章以前是个死胡同。
    var hb = HOME_BTN;
    var hhov = S.mouse.x >= hb[0] && S.mouse.x <= hb[0] + hb[2] && S.mouse.y >= hb[1] && S.mouse.y <= hb[1] + hb[3];
    ctx.fillStyle = hhov ? 'rgba(120,150,220,.22)' : 'rgba(120,150,220,.09)';
    rr(ctx, hb[0], hb[1], hb[2], hb[3], 10); ctx.fill();
    ctx.strokeStyle = hhov ? 'rgba(150,185,240,.75)' : 'rgba(120,160,230,.28)'; ctx.lineWidth = 1.3;
    rr(ctx, hb[0] + .7, hb[1] + .7, hb[2] - 1.4, hb[3] - 1.4, 10); ctx.stroke();
    txt(ctx, '← 首页', hb[0] + hb[2] / 2, hb[1] + 25, { a: 'center', s: 13.5, c: 'rgba(195,215,250,.9)', w: '800' });

    // 右上角：商店入口 + 金币
    var bx = W - 168, by = 34, bw = 148, bh = 40;
    var bhov = S.mouse.x >= bx && S.mouse.x <= bx + bw && S.mouse.y >= by && S.mouse.y <= by + bh;
