  // 暂停时战场是定格的，每帧重画一遍纯属浪费 ——
  // 进来的时候拍一张，之后每帧只贴图（跟选章界面是同一笔账）。
  var pauseSnap = null;
  function drawScene(hideWorld) {
    drawBg();
    if (!hideWorld) {
      drawArena();
      drawBoss();          // 背景那只巨物：在竞技场之上、敌人之下
      drawPlats();
      var i;
      for (i = 0; i < S.enemies.length; i++) if (S.enemies[i].held && !S.enemies[i].dead) drawHeldEnemy(S.enemies[i]);
      drawCat();
      for (i = 0; i < S.enemies.length; i++) if (S.enemies[i].live && !S.enemies[i].dead) drawLive(S.enemies[i]);
      drawItems();
      drawWarns();
      drawBars();
      drawGoal();
      if (S.door) drawDoor();
      drawBullets();
      drawPlayer();
    }
    drawParts();
  }
  function ensurePauseSnap() {
    if (pauseSnap) return;
    try {
      var c = document.createElement('canvas');
      c.width = W; c.height = H;
      var o = c.getContext('2d');
      if (!o) return;
      var real = ctx; ctx = o;              // 借同一套绘制代码，画进离屏
      try { drawScene(false); } finally { ctx = real; }
      pauseSnap = c;
    } catch (e) { pauseSnap = null; }
  }

  function render() {
    if (!ctx) return;
    if (S.mode === 'pause') {
      ensurePauseSnap();
      ctx.save();
      if (pauseSnap) ctx.drawImage(pauseSnap, 0, 0);
      else { ctx.fillStyle = '#04070e'; ctx.fillRect(0, 0, W, H); }
      ctx.restore();
      drawPause();
      return;
    }
    pauseSnap = null;                       // 离开暂停就丢掉，下次进来重拍
    ctx.save();
    if (S.shake > .2) ctx.translate(rnd(-S.shake, S.shake), rnd(-S.shake, S.shake));
    // 全屏不透明界面（选章 / 结局）盖住了整个战场 —— 底下那些就别画了
    var hideWorld = (S.mode === 'select' || S.mode === 'ending');
    drawScene(hideWorld);
    // 定格波：从角色身上扩散出去的那一圈
    if (S.freezeFx > 0 && S.ch) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, S.freezeFx * 1.2) * .85;
      ctx.strokeStyle = PAL.cy;
      ctx.lineWidth = 3 + S.freezeFx * 7;
      ctx.shadowColor = 'rgba(79,227,255,.9)'; ctx.shadowBlur = 26;
      ctx.beginPath();
      ctx.arc(S.ch.x + PW / 2, S.ch.y + PH / 2, (1 - S.freezeFx) * 820, 0, 6.2832);
      ctx.stroke();
      ctx.restore();
    }
    if (S.mode === 'play') drawField();
    if (S.mode === 'play') { drawHUD(); drawBanner(); drawFloats(); }
    drawToasts();
    drawGlitch();
    if (Eggs.msgT > 0 && Eggs.msg) txt(ctx, Eggs.msg, W / 2, 96, { a: 'center', s: 18, c: PAL.pink, glow: 'rgba(255,93,132,.7)', blur: 16 });
    if (S.flash > 0.01) {
      ctx.globalAlpha = S.flash * .5;
      ctx.fillStyle = PAL.red;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (vgLayer) {
      ctx.drawImage(vgLayer, 0, 0);
    } else {
      var vg = ctx.createRadialGradient(W / 2, H / 2, H * .34, W / 2, H / 2, H * .98);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,.62)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }
    if (S.mode === 'title') drawTitle();
    else if (S.mode === 'select') drawSelect();
    else if (S.mode === 'intro') drawIntro();
    else if (S.mode === 'workshop') {
      if (S.edit && S.edit.showCode) drawCodeScreen();
      else if (S.editList) drawMineList();
      else { drawWorkshop(); if (S.edit && S.edit.panel) drawRulePanel(); }
    }
    else if (S.mode === 'shop') drawShop();
    // 离开分享码那一屏（或离开工坊）时，把盖在画布上的文本框收掉
    if (codeEl && !(S.mode === 'workshop' && S.edit && S.edit.showCode)) hideCodeEl();
    else if (S.mode === 'pause') drawPause();
    else if (S.mode === 'clear') drawClear();
    else if (S.mode === 'over') drawOver();
    else if (S.mode === 'ending') drawEnding();
    ctx.restore();
  }

  // ══════════════════════════════════════════════════════════════
  // 13 · 输入
  // ══════════════════════════════════════════════════════════════
  function toLogical(e) {
    if (!canvas || !canvas.getBoundingClientRect) return { x: 0, y: 0 };
    var r = canvas.getBoundingClientRect();
    var sc = ((r && r.width) ? r.width : W) / W || 1;
    var lx = ((e.clientX || 0) - (r ? r.left : 0)) / sc;
    var ly = ((e.clientY || 0) - (r ? r.top : 0)) / sc;
    return { x: isFinite(lx) ? lx : 0, y: isFinite(ly) ? ly : 0 };
  }

  // 选章格子几何 —— 画和点用同一份，不会对不上
  function selCols() { return CHAPTERS.length <= 12 ? 3 : 4; }   // 原来是 3，加了卡之后变 4 列
  function selectCell(i) {
    var COLS = selCols();
    var cw = COLS === 3 ? 252 : 202, chh = 78, gx = COLS === 3 ? 18 : 14, gy = 12;
    var tw = COLS * cw + (COLS - 1) * gx;
    return {
      x: (W - tw) / 2 + (i % COLS) * (cw + gx),
      y: 116 + Math.floor(i / COLS) * (chh + gy),
      w: cw, h: chh
    };
  }
  // 打完「放手」之后，选章界面只剩一扇门亮着
  function lockedToLast() {
    var sv = Save.get();
    return !!(sv.trueEnd && !sv.bossDown);
  }
  // 哪一关现在能点。三种状态一个函数说清：
  //   没打赢「放手」      → 第13关是灰的，其余随便点
  //   打赢了、boss 没死   → 只有第13关能点（上锁）
  //   boss 也死了         → 全部恢复
  function canPick(i) {
    var sv = Save.get();
    // last 是「最后一个真章节」（boss 那关），不是数组最后一项 ——
    // 无限那张卡排在它后面，用 CHAPTERS.length-1 会让 boss 关上不了锁
    var last = REAL_N - 1;
    if (CHAPTERS[i] && CHAPTERS[i].infinite) return true;   // 无限模式永远开着
    if (i === last) return !!sv.trueEnd;
    return !(sv.trueEnd && !sv.bossDown);
  }

  function selectHit(p) {
    for (var i = 0; i < CHAPTERS.length; i++) {
      if (!canPick(i)) continue;
      var c = selectCell(i);
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) return i;
    }
    return -1;
  }

  // 回首页。以前首页只是块过场，不留口子也就算了；
  // 现在「工坊」和「我的关卡」挂在首页上，进得去出不来就是死胡同。
  var HOME_BTN = [16, 34, 96, 40];
  function goTitle() {
    S.testing = false; S.editList = false;
    dropCustom(); hideCodeEl();
    S.mode = 'title'; S.bootT = 0;
    Audio.wake(); Sound.ui();
  }

  function goSelect() {
    S.testing = false;
    S.editList = false; dropCustom();
    S.mode = 'select'; S.selT = 0;
    S.selIdx = clamp(S.selIdx, 0, CHAPTERS.length - 1);
    Audio.wake(); Music.start(); Sound.ui();
  }
  function beginPlay() { S.mode = 'play'; S.introT = 0; Sound.ui(); Music.start(); }
  function isCustomRun() { return !!(CHAPTERS[S.chapter] && CHAPTERS[S.chapter].__custom); }

  function advanceClear() {
    // 自制关打完就该回工坊接着改。它不是这一章、更不是终章 ——
    // 之前它会掉进下面的「最后一章」分支，于是放起结局动画。
    if (isCustomRun()) {
      S.testing = false;
      goWorkshop();
      S.floats.push({ s: '打完了 · 接着改', x: W / 2, y: 130, t: 80, c: PAL.mint });
      return;
    }
    var sv = Save.get();
    sv.cleared = false;
    // 「放手」通过 → 不是结局。门后面还有东西，真终章这时候才放出来。
    if (CHAPTERS[S.chapter] && CHAPTERS[S.chapter].finale && !sv.bossDown) {
      sv.trueEnd = true;
      Save.flush();
      goSelect();
      S.selIdx = CHAPTERS.length - 1;
      banner('真的结束了吗？', PAL.red);
      return;
    }
    if (S.chapter >= CHAPTERS.length - 1) {
      sv.cleared = true;
      Save.flush();
      S.mode = 'ending'; S.endingT = 0;
      unlock('ending');
    } else {
      Save.flush();
      startChapter(S.chapter + 1);
    }
    Sound.ui();
  }

  function onKeyDown(e) {
    var k = e.key;
    // Tab 原来漏在外面 —— 浏览器会拿它去移焦点，按一下焦点就跑了
    var nav = (k === ' ' || k === 'Spacebar' || k === 'Enter' || k === 'Tab' || k.indexOf('Arrow') === 0);
    if (nav && e.preventDefault) e.preventDefault();
    if (S.mode === 'workshop' && k === 'Tab' && e.preventDefault) e.preventDefault();

    // F9：作弊键，加 999 金币。任何界面都能按，包括标题页 —— 老板自己人用的。
    // 满 999 就归零重来，免得刷太多次数字难看。
    // F8：帧率表。低配机上卡在哪一屏，打开它截图给本喵看。
    if (k === 'F8') {
      if (e.preventDefault) e.preventDefault();
      S.showFps = !S.showFps;
      S._ft = [];
      return;
    }
    if (k === 'F9') {
      if (e.preventDefault) e.preventDefault();
      addCoins(999);
      S.floats.push({ s: '+999 金币', x: W / 2, y: 128, t: 80, c: PAL.gold });
      Sound.pick();
      return;
    }


    if (S.mode === 'title') {
      // 首页的两个自制关卡入口要排在「任意键开始」前面
      if (k === 'w' || k === 'W') { goWorkshop(); return; }
      if (k === 'l' || k === 'L') { goWorkshop(); S.editList = true; return; }
      goSelect(); return;
    }
    if (S.mode === 'select') {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { S.selIdx = (S.selIdx + CHAPTERS.length - 1) % CHAPTERS.length; Sound.ui(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { S.selIdx = (S.selIdx + 1) % CHAPTERS.length; Sound.ui(); }
      // 上下 = 跳一整行。原来是写死的 3 —— 4 列之后按 ↓ 是斜着走的
      else if (k === 'ArrowUp' || k === 'w' || k === 'W') { S.selIdx = (S.selIdx + CHAPTERS.length - selCols()) % CHAPTERS.length; Sound.ui(); }
      else if (k === 'ArrowDown' || k === 's' || k === 'S') { S.selIdx = (S.selIdx + selCols()) % CHAPTERS.length; Sound.ui(); }
      else if (k === ' ' || k === 'Enter') {
        if (canPick(S.selIdx)) startChapter(S.selIdx);
      }
      else if (k === 'b' || k === 'B') goShop();
      else if (k === 'Escape' || k === 'Backspace') goTitle();
      return;
    }
    if (S.mode === 'workshop') {
      var ed = S.edit;
      if (!ed) return;
      if (ed.showCode) { if (k === 'c' || k === 'C' || k === 'Escape') { ed.showCode = false; hideCodeEl(); Sound.ui(); } return; }
      if (S.editList) {
        if (k === 'Escape' || k === 'l' || k === 'L') { S.editList = false; Sound.ui(); }
        return;
      }
      if (k === 'Escape') {
        if (ed.panel) { ed.panel = false; ed.slide = null; Sound.ui(); return; }   // 先关面板，再谈退出
        goTitle(); return;                                                          // 工坊挂在首页下，回首页
      }
      if (k === 'Tab') { ed.tab = (ed.tab + 1) % 3; Sound.ui(); return; }          // 画台 → 放物 → 旗子
      if (k === 'r' || k === 'R') { ed.panel = !ed.panel; ed.slide = null; Sound.ui(); return; }
      if (k === 'z' || k === 'Z') {                                                // 撤销
        if (doUndo()) Sound.thaw(); else Sound.ui();                                // 面板开着也照样撤
        return;
      }
      // 数值的键盘快捷方式。滑块是主入口，但这几个键上一轮就有，不能因为我重写就没了。
      // 不记撤销：一次按键一格，记了会把撤销栈冲干净。
      if (k === '[') { ed.gap = Math.max(24,  ed.gap - 8); Sound.ui(); return; }
      if (k === ']') { ed.gap = Math.min(400, ed.gap + 8); Sound.ui(); return; }
      if (k === 'q' || k === 'Q') { ed.need = Math.max(needRange()[0], ed.need - 1); Sound.ui(); return; }
      if (k === 'e' || k === 'E') { ed.need = Math.min(needRange()[1], ed.need + 1); Sound.ui(); return; }
      // 面板开着的时候键盘让位 —— 数字键在那边是「出什么怪」，在这儿会打架
      if (ed.panel) return;
      if (k === 'Enter') { playCustom(ed); return; }                                // 试玩：不落盘、不留卡
      if (k === 'c' || k === 'C') { ed.showCode = true; showCodeEl(editEncode(ed)); Sound.ui(); return; }
      if (k === 'l' || k === 'L') { S.editList = true; Sound.ui(); return; }
      if (k === 's' || k === 'S') { askName(true); return; }                        // 生成
      if (k === 'x' || k === 'X') {                                                 // 清空（留着撤销栈）
        pushUndo();
        var ku = ed.undo, kn = ed.name, kw = ed.win;
        S.edit = freshEdit();
        S.edit.undo = ku; S.edit.name = kn; S.edit.win = kw;
        S.edit.goal = (ed.goal || S.edit.goal).slice();
        Sound.thaw(); return;
      }
      if (k === 'v' || k === 'V') {
        var got = null;
        try { got = window.prompt('把分享码粘进来：', ''); } catch (err) {}
        var dec = got ? editDecode(got) : null;
        if (dec) { dec.undo = ed.undo; S.edit = dec; S.editList = false; Sound.pick(); }
        else if (got) { Sound.thaw(); S.floats.push({ s: '这段码看不懂', x: W / 2, y: 130, t: 70, c: PAL.red }); }
        return;
      }
      if (k >= '1' && k <= '5') {                 // 出什么怪，1~5 开关
        var ti = +k - 1, at = ed.types.indexOf(ti);
        pushUndo();
        if (at >= 0) { if (ed.types.length > 1) ed.types.splice(at, 1); }
        else ed.types.push(ti);
        ed.types.sort();
        Sound.ui(); return;
      }
      if (ed.tab === 1 && (k === 'i' || k === 'I')) { ed.item = (ed.item + 1) % ITEM_ORDER.length; Sound.ui(); return; }
      return;
    }
    if (S.mode === 'shop') {
      if (k === 'Escape' || k === 'b' || k === 'B') { goSelect(); return; }
      if (k === '1' || k === '2' || k === '3') { buyWeapon(Number(k) - 1); return; }
      return;
    }
    if (S.mode === 'pause') {
      if (k === 'Escape' || k === ' ' || k === 'Spacebar' || k === 'Enter') pauseActivate('resume');
      else if (k === 'r' || k === 'R') pauseActivate('restart');
      else if (k === 'q' || k === 'Q') { if (S.testing) { S.testing = false; goWorkshop(); } else pauseActivate('select'); }
      else if (k === 'm' || k === 'M') pauseActivate('sound');
      return;
    }
    if (S.mode === 'intro') {
      // 卡片上写什么就得真能去 —— 自制关是从首页来的，别把人扔回选章
      if (k === 'Escape') { if (S.testing) { S.testing = false; goWorkshop(); } else goSelect(); return; }
      if (S.introT > 36) beginPlay();
      return;
    }
    if (S.mode === 'clear') { if (S.clearT > 34) advanceClear(); return; }
    if (S.mode === 'over') { if (S.over > 55) startChapter(S.chapter); return; }
    if (S.mode === 'ending') { if (S.endingT > 200) { S.mode = 'title'; S.bootT = 0; } return; }

    if (k === 'Escape') { S.mode = 'pause'; S.pauseT = 0; Sound.ui(); return; }
    if (k === 'r' || k === 'R') { startChapter(S.chapter); return; }
    if (k === '1' || k === '2' || k === '3') {          // 换武器（买了才能用）
      var wi = Number(k) - 1;
      if (owns(wi)) { S.weapon = wi; Sound.pick(); }
      else { Sound.thaw(); S.floats.push({ s: '没买 · ' + WEAPONS[wi].n, x: W / 2, y: 128, t: 60, c: PAL.red }); }
      return;
    }

    keys[k] = true;
    checkKonami(k);
    if (k.length === 1) {
      Eggs.typed = (Eggs.typed + k.toLowerCase()).slice(-8);
      if (Eggs.typed.indexOf('cat') >= 0 || Eggs.typed.indexOf('miao') >= 0) { Eggs.typed = ''; spawnCat(); }
    }
    if (k === '喵') spawnCat();
  }
  function onKeyUp(e) { keys[e.key] = false; }

  function onMove(e) {
    try {
      var mv = toLogical(e);
      if (S.mode === 'workshop' && S.edit && S.edit.slide && S.mouse.down) setSlide(S.edit.slide, mv.x);
    } catch (err) {}
    try {
      if (S.mode === 'workshop' && S.edit && S.edit.drag) {
        var lp = toLogical(e);
        S.edit.drag.x1 = Math.round(lp.x); S.edit.drag.y1 = Math.round(lp.y);
      }
    } catch (err) {}
    var p = toLogical(e);
    S.mouse.x = p.x; S.mouse.y = p.y;
  }
  function onDown(e) {
    var p = toLogical(e);
    S.mouse.x = p.x; S.mouse.y = p.y; S.mouse.down = true;
    if (e.preventDefault) e.preventDefault();

    if (S.mode === 'title') {
      for (var tb2 = 0; tb2 < TBTN.length; tb2++) {
        var B2 = TBTN[tb2];
        if (p.x >= B2.x && p.x <= B2.x + B2.w && p.y >= B2.y && p.y <= B2.y + B2.h) {
          goWorkshop();
          if (tb2 === 1) S.editList = true;
          return;
        }
      }
      goSelect(); return;
    }
    if (S.mode === 'select') {
      if (p.x >= W - 168 && p.x <= W - 20 && p.y >= 34 && p.y <= 74) { goShop(); return; }
      var hbb = HOME_BTN;
      if (p.x >= hbb[0] && p.x <= hbb[0] + hbb[2] && p.y >= hbb[1] && p.y <= hbb[1] + hbb[3]) { goTitle(); return; }
      var hit = selectHit(p);
      if (hit >= 0) { S.selIdx = hit; startChapter(hit); }
      return;
    }
    if (S.mode === 'pause') {
      var rows = pauseRows();
      for (var ri = 0; ri < rows.length; ri++) {
        var pr = rows[ri];
        if (p.x >= pr.x && p.x <= pr.x + pr.w && p.y >= pr.y && p.y <= pr.y + pr.h) { pauseActivate(pr.k); return; }
      }
      return;
    }
    if (S.mode === 'intro') { if (S.introT > 36) beginPlay(); return; }
    if (S.mode === 'clear') { if (S.clearT > 34) advanceClear(); return; }
    if (S.mode === 'over') { if (S.over > 55) startChapter(S.chapter); return; }
    if (S.mode === 'ending') { if (S.endingT > 200) { S.mode = 'title'; S.bootT = 0; } return; }

    if (S.mode === 'workshop') {
      var we = S.edit; if (!we || we.showCode) return;
      if (S.editList) {                // 我的关卡：每一行的按钮
        var rws = mineRows(), L2 = mineList();
        if (e.button === 0) {
          for (var wi2 = 0; wi2 < rws.length; wi2++) {
            var r2 = rws[wi2], hit = function (q) { return p.x >= q[0] && p.x <= q[0] + q[2] && p.y >= q[1] && p.y <= q[1] + q[3]; };
            if (hit(r2.edit)) { var d1 = editDecode(L2[r2.i].c); if (d1) { S.edit = d1; S.editList = false; Sound.pick(); } return; }
            if (hit(r2.play)) { var d2 = editDecode(L2[r2.i].c); if (d2) { S.edit = d2; playCustom(d2); } return; }
            if (hit(r2.del))  { L2.splice(r2.i, 1); Save.flush(); Sound.thaw(); return; }
          }
        }
        return;
      }
      if (we.panel) {                  // 规矩面板
        if (e.button !== 0) return;
        if (!hit2(p, [PG.x, PG.y, PG.w, PG.h])) { we.panel = false; Sound.ui(); return; }
        if (hit2(p, nameBox())) { askName(false); return; }
        for (var wi3 = 0; wi3 < WINS.length; wi3++) {
          if (hit2(p, winChip(wi3))) {
            if (we.win !== WINS[wi3].k) {
              pushUndo();
              we.win = WINS[wi3].k;
              // 同一个数字在两种条件下意思不同（个 / 秒），切换时夹进新范围
              we.need = we.win === 'survive' ? Math.max(5, Math.min(120, we.need)) : Math.max(1, Math.min(99, we.need));
            }
            Sound.ui(); return;
          }
        }
        if (we.win === 'reach' && hit2(p, quietBox())) { pushUndo(); we.goalQuiet = !we.goalQuiet; Sound.ui(); return; }
        for (var ti3 = 0; ti3 < EDIT_TYPES.length; ti3++) {
          if (hit2(p, typeChip(ti3))) {
            var at3 = we.types.indexOf(ti3);
            pushUndo();
            if (at3 >= 0) { if (we.types.length > 1) we.types.splice(at3, 1); }
            else we.types.push(ti3);
            we.types.sort();
            Sound.ui(); return;
          }
        }
        for (var ki3 = 0; ki3 < TPLS.length; ki3++) {
          if (hit2(p, tplChip(ki3))) { applyTpl(ki3); Sound.pick(); return; }
        }
        var sw3 = sliderWhich(p.y);
        if (sw3 === 'need' && we.win === 'reach') sw3 = null;   // 那一行放的是「空手」开关
        if (sw3 && p.x >= PG.sx - 16 && p.x <= PG.sx + PG.sw + 16) { we.slide = sw3; setSlide(sw3, p.x); Sound.ui(); return; }
        return;
      }
      if (e.button === 0) {
        for (var bi = 0; bi < BTN.length; bi++) {          // 右上角那排按钮
          var B2 = BTN[bi];
          if (p.x >= B2.x && p.x <= B2.x + BTN_W && p.y >= BTN_Y && p.y <= BTN_Y + BTN_H) {
            if (B2.k === 'rule') { we.panel = true; Sound.ui(); }
            else if (B2.k === 'test') playCustom(we);
            else if (B2.k === 'save') askName(true);
            else if (B2.k === 'mine') { S.editList = true; Sound.ui(); }
            else if (B2.k === 'code') { we.showCode = true; showCodeEl(editEncode(we)); Sound.ui(); }
            return;
          }
        }
        for (var mi3 = 0; mi3 < 3; mi3++) {                // 三种笔
          if (hit2(p, [SL.chipA, SL.chipB, SL.chipC][mi3])) { we.tab = mi3; Sound.ui(); return; }
        }
        for (var wp3 = 0; wp3 < WEAPONS.length; wp3++) {   // 起手武器
          if (hit2(p, wepChip(wp3))) {
            if ((we.wep || 0) !== wp3) { pushUndo(); we.wep = wp3; }
            Sound.ui(); return;
          }
        }
      }
      if (e.button === 2) {            // 右键：删掉鼠标下的东西
        for (var pi = we.plats.length - 1; pi >= 0; pi--) {
          var pq = we.plats[pi];
          if (p.x >= pq[0] && p.x <= pq[0] + pq[2] && p.y >= pq[1] - 6 && p.y <= pq[1] + pq[3] + 6) {
            pushUndo(); we.plats.splice(pi, 1); Sound.thaw(); return;
          }
        }
        for (var ii = we.items.length - 1; ii >= 0; ii--) {
          if (Math.hypot(p.x - we.items[ii][1], p.y - we.items[ii][2]) < 26) {
            pushUndo(); we.items.splice(ii, 1); Sound.thaw(); return;
          }
        }
        return;
      }
      if (we.tab === 2) {              // 旗子：点一下把目标挪过去
        if (e.button !== 0) return;
        var gs = we.goal || [0, 0, 120, 60];
        pushUndo();
        we.goal = [Math.round(p.x - gs[2] / 2), Math.round(p.y - gs[3] / 2), gs[2], gs[3]];
        Sound.pick(); return;
      }
      if (we.tab === 1) {              // 放道具
        pushUndo();
        we.items.push([we.item, Math.round(p.x), Math.round(p.y)]);
        Sound.pick(); return;
      }
      pushUndo();
      we.drag = { x0: Math.round(p.x), y0: Math.round(p.y), x1: Math.round(p.x), y1: Math.round(p.y) };
      return;
    }
    if (S.mode === 'shop') {
      var srows = shopRows();
      for (var sr = 0; sr < srows.length; sr++) {
        var si = srows[sr];
        if (p.x >= si.x && p.x <= si.x + si.ww && p.y >= si.y && p.y <= si.y + si.hh) { buyWeapon(si.i); return; }
      }
      return;
    }
    if (S.mode === 'play' && e.button === 2 && has('pulse')) firePulse();   // 右键：脉冲（第 2 关才教）
  }
  function onUp() {
    S.mouse.down = false;
    if (S.edit) S.edit.slide = null;
    // 松开鼠标 = 跳台画完了
    var de = S.edit;
    if (S.mode === 'workshop' && de && de.drag) {
      var d = de.drag;
      var x = Math.min(d.x0, d.x1), y = Math.min(d.y0, d.y1);
      var w = Math.abs(d.x1 - d.x0), hh = Math.max(18, Math.abs(d.y1 - d.y0));
      if (w >= 40) de.plats.push([Math.round(x), Math.round(y), Math.round(w), Math.round(hh)]);
      de.drag = null;
      Sound.pick();
    }
  }

  // ══════════════════════════════════════════════════════════════
  // 14 · 主循环
  // ══════════════════════════════════════════════════════════════
  var lastTS = 0, acc = 0, STEPMS = 1000 / 60, frameId = null;

  function loop(ts) {
    if (frameId !== null) requestAnimationFrame(loop);
    if (!lastTS) lastTS = ts;
    var dt = ts - lastTS;
    lastTS = ts;
    if (!isFinite(dt) || dt < 0) dt = STEPMS;
    if (dt > 200) dt = 200;
    acc += dt;
    var guard = 0;
    while (acc >= STEPMS && guard++ < 6) { step(); acc -= STEPMS; }
    render();
  }

  function resize() {
    if (!canvas || !canvas.style || typeof window === 'undefined') return;
    var vw = window.innerWidth || W, vh = window.innerHeight || H;
    var sc = Math.min(vw / W, vh / H);
    if (!isFinite(sc) || sc <= 0) sc = 1;
    canvas.style.width = Math.floor(W * sc) + 'px';
    canvas.style.height = Math.floor(H * sc) + 'px';
  }

  function setFavicon() {
    try {
      var c = document.createElement('canvas');
      c.width = 32; c.height = 32;
      var g = c.getContext('2d');
      if (!g) return;
      g.fillStyle = '#060a14'; g.fillRect(0, 0, 32, 32);
      g.strokeStyle = '#4fe3ff'; g.lineWidth = 3;
      g.beginPath(); g.arc(16, 16, 11, 0, 6.2832); g.stroke();
      g.fillStyle = '#39425c'; g.fillRect(11, 13, 10, 9);
      var l = document.createElement('link');
      l.rel = 'icon'; l.href = c.toDataURL('image/png');
      document.head.appendChild(l);
    } catch (e) {}
  }

  function boot() {
    if (typeof document === 'undefined' || !document.getElementById) return false;
    canvas = document.getElementById('game');
    if (!canvas || !canvas.getContext) return false;
    ctx = canvas.getContext('2d');
    if (!ctx) return false;

    var dpr = 1;
    try { dpr = Math.min((window.devicePixelRatio || 1), 2); } catch (e) { dpr = 1; }
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    if (ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // restore() 会回滚 font，字体缓存必须跟着失效 —— 否则会画错字体
    try {
      if (ctx.restore) {
        var _rawRestore = ctx.restore.bind(ctx);
        ctx.restore = function () { _fontCache = ''; _rawRestore(); };
      }
    } catch (e) {}

    resize();
    if (window.addEventListener) {
      window.addEventListener('resize', resize);
      window.addEventListener('keydown', onKeyDown, false);
      window.addEventListener('keyup', onKeyUp, false);
      window.addEventListener('mouseup', onUp, false);
      window.addEventListener('blur', function () { for (var k in keys) keys[k] = false; onUp(); }, false);
    }
    if (canvas.addEventListener) {
      canvas.addEventListener('mousemove', onMove, false);
      canvas.addEventListener('mousedown', onDown, false);
      canvas.addEventListener('touchstart', function (e) {
        if (!e.touches || !e.touches.length) return;
        onDown({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY, preventDefault: function () { if (e.preventDefault) e.preventDefault(); } });
      }, false);
      canvas.addEventListener('touchmove', function (e) {
        if (!e.touches || !e.touches.length) return;
        onMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
        if (e.preventDefault) e.preventDefault();
      }, false);
      canvas.addEventListener('touchend', function () { onUp(); }, false);
      canvas.addEventListener('contextmenu', function (e) { if (e.preventDefault) e.preventDefault(); }, false);
    }

    setFavicon();
    bakeLayers();               // 静态图层只烘焙一次
    applyTheme(Save.get().theme || 0, true);
    startChapter(0, true);      // 只为把状态铺好，不记开局数
    S.mode = 'title';
    S.bootT = 0;

    try {
      var v = document.getElementById('veil');
      if (v && v.className !== undefined) {
        setTimeout(function () { v.className = 'gone'; }, 200);
        setTimeout(function () { if (v.parentNode) v.parentNode.removeChild(v); }, 900);
      }
    } catch (e) {}

    frameId = 1;
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);

    try {
      console.log('%c静 止  %cSTILL', 'color:#4fe3ff;font-size:22px;font-weight:800', 'color:#7f8fb4;font-size:12px');
      console.log('%c规则只有一条：圈里是活的，圈外是石头。', 'color:#ffd166;font-size:13px');
      console.log('%c试试：STILL.bot() 让机器人替你打一局', 'color:#43f5b0;font-size:12px');
    } catch (e) {}
    return true;
  }

  // ══════════════════════════════════════════════════════════════
  // 15 · 对外接口（测试 / 控制台）
  // ══════════════════════════════════════════════════════════════
  var API = {
    W: W, H: H, S: S, TYPES: TYPES, CHAPTERS: CHAPTERS,
    boot: boot, step: step, render: render,
    startChapter: startChapter, resetRun: resetRun, beginPlay: beginPlay,
    goSelect: goSelect, advanceClear: advanceClear, finishGame: finishGame,
    applyTheme: applyTheme, THEMES: THEMES,
    chapterClear: chapterClear, freezeWorld: freezeWorld,
    getState: function () { return S; },
    aim: function (x, y) { S.mouse.x = x; S.mouse.y = y; },
    W: W, H: H, PW: PW, PH: PH, FLOOR: FLOOR,
    moveSpeed: moveSpeed, applyItem: applyItem, ITEMS: ITEMS, pauseActivate: pauseActivate,
    rollDrop: rollDrop, updateItems: updateItems,
    tutStage: tutStage, tutSet: tutSet, tutLine: tutLine,
    isBoss: isBoss, updateBoss: updateBoss, bossDown: bossDown,
    updateWaves: updateWaves, infSetupWave: infSetupWave, REAL_N: REAL_N,
    spawnInfBoss: spawnInfBoss,
    goWorkshop: goWorkshop, editEncode: editEncode, editDecode: editDecode, selCols: selCols,
    playCustom: playCustom, freshEdit: freshEdit, ITEM_ORDER: ITEM_ORDER,
    chapLabel: chapLabel, wrapCode: wrapCode, showCodeEl: showCodeEl, hideCodeEl: hideCodeEl,
    customRun: customRun, wepChip: wepChip,
    TBTN: TBTN, isCustomRun: isCustomRun, goTitle: goTitle, HOME_BTN: HOME_BTN,
    mineList: mineList, mineRows: mineRows, saveLevel: saveLevel, dropCustom: dropCustom,
    setSlide: setSlide, knobX: knobX, SL: SL, PG: PG, BTN: BTN, WINS: WINS, TPLS: TPLS,
    pushUndo: pushUndo, doUndo: doUndo, winText: winText, applyTpl: applyTpl, askName: askName,
    nameBox: nameBox, quietBox: quietBox, winChip: winChip, typeChip: typeChip, tplChip: tplChip,
    sliderWhich: sliderWhich, needRange: needRange, escName: escName,
    lockedToLast: function () { return lockedToLast(); },
    selectCell: selectCell, selectHit: selectHit, canPick: canPick,
    WEAPONS: WEAPONS, WEP: WEP, owns: owns, buyWeapon: buyWeapon, goShop: goShop,
    addCoins: addCoins, ABILITY_AT: ABILITY_AT, has: has,
    winKind: winKind, goalMet: goalMet, goalLabel: goalLabel, goalBrief: goalBrief,
    pulse: firePulse, spawnCat: spawnCat,
    solidBoxes: solidBoxes, isFinale: isFinale, Music: Music, Sound: Sound,
    spawn: function (type, x, y) { var e = makeEnemy(type, x, y, S.chapter); S.enemies.push(e); return e; },
    unlock: unlock, ACH: ACH, ACHS: ACHS, Eggs: Eggs, Save: Save,
    _press: function (k) { keys[k] = true; },
    _release: function (k) { keys[k] = false; },
    _releaseAll: function () { for (var k in keys) keys[k] = false; },
    _key: function (k) { onKeyDown({ key: k, preventDefault: function () {} }); onKeyUp({ key: k }); },
    _keyPD: function (k) { var hit = false;
      onKeyDown({ key: k, preventDefault: function () { hit = true; } }); onKeyUp({ key: k }); return hit; },
    _move: function (x, y) { onMove({ clientX: x, clientY: y }); },
    _click: function (x, y) { onDown({ clientX: x, clientY: y, button: 0, preventDefault: function () {} }); onUp(); },
    _down: function (x, y, b) { onDown({ clientX: x, clientY: y, button: b || 0, preventDefault: function () {} }); },
    _up: function () { onUp(); }
  };
  try { if (typeof window !== 'undefined') window.STILL = API; } catch (e) {}
  try { if (typeof globalThis !== 'undefined') globalThis.STILL = API; } catch (e) {}

  try {
    if (typeof document !== 'undefined' && document.getElementById) {
      var el = document.getElementById('game');
      if (el && el.getContext) boot();
    }
  } catch (e) {
    try { console.error('[STILL] boot failed:', e); } catch (e2) {}
  }

})();
</script>
