<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昨日之我 · Echoes of Me</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>👻</text></svg>">
<style>
  :root{
    --panel: rgba(15,18,38,.94);
    --line: rgba(255,255,255,.09);
    --amber:#ffb454; --violet:#b28cff; --teal:#4cd6c1; --pink:#ff7eb6; --cyan:#6be3ff; --red:#ff5d73;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#07091a radial-gradient(1200px 700px at 50% -10%, #1a2042 0%, #07091a 70%);
    color:#e8ecff;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; user-select:none;
  }
  #wrap{position:relative;}
  #game{
    display:block; width:min(96vw, calc(96vh * 16 / 9)); aspect-ratio:16/9;
    border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    background:#0b0e1d; cursor:default; touch-action:none;
  }
  #game.rainbow{animation:hueshift 7s linear infinite;}
  @keyframes hueshift{from{filter:hue-rotate(0deg) saturate(1.15);} to{filter:hue-rotate(360deg) saturate(1.15);}}

  /* ---------- 通用面板 ---------- */
  .veil{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(5,7,18,.62); backdrop-filter:blur(3px); border-radius:12px; z-index:20;}
  .veil.show{display:flex;}
  .panel{
    width:min(560px, 88%); max-height:86%; overflow:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px 26px; box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .panel h2{font-size:22px; letter-spacing:2px; margin-bottom:4px;}
  .panel .sub{color:#9aa3c7; font-size:13px; margin-bottom:16px;}
  .btnrow{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px;}
  button{
    font:inherit; color:#e8ecff; background:rgba(255,255,255,.07);
    border:1px solid var(--line); border-radius:10px; padding:9px 16px; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  button:hover{background:rgba(255,255,255,.14); transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  button.primary{background:linear-gradient(135deg,#5b6cff,#9a5bff); border-color:transparent; font-weight:600;}
  button.primary:hover{filter:brightness(1.1);}
  button.ghostbtn{background:transparent;}
  button.small{padding:5px 10px; font-size:12px; color:#aab3d6;}
  .lvlgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:6px;}
  .lvl{
    position:relative; text-align:left; padding:12px 12px 10px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid var(--line); cursor:pointer;
  }
  .lvl:hover{background:rgba(255,255,255,.11);}
  .lvl.locked{opacity:.38; cursor:not-allowed;}
  .lvl b{display:block; font-size:15px; margin-bottom:2px;}
  .lvl span{font-size:11px; color:#9aa3c7;}
  .lvl .stars{position:absolute; top:8px; right:10px; font-size:12px; color:var(--amber);}
  .egglist{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .egg{
    display:flex; gap:10px; align-items:baseline; padding:8px 12px; border-radius:10px;
    background:rgba(255,255,255,.045); border:1px solid var(--line); font-size:13px;
  }
  .egg .nm{font-weight:600; min-width:96px;}
  .egg .ds{color:#9aa3c7;}
  .egg.found{border-color:rgba(255,180,84,.35); background:rgba(255,180,84,.07);}
  .egg.found .nm{color:var(--amber);}
  .egg:not(.found) .nm{color:#6b7396;}

  /* ---------- Toast ---------- */
  #toasts{position:absolute; top:14px; right:14px; z-index:40; display:flex; flex-direction:column; gap:8px; pointer-events:none;}
  .toast{
    background:rgba(13,16,34,.92); border:1px solid var(--line); border-left:3px solid var(--amber);
    border-radius:10px; padding:9px 14px; font-size:13px; max-width:320px;
    box-shadow:0 8px 26px rgba(0,0,0,.5); animation:toastin .25s ease;
  }
  @keyframes toastin{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:none;}}
  .toast.plain{border-left-color:var(--cyan);}

  /* ---------- 终端 ---------- */
  #term{
    position:absolute; left:0; right:0; bottom:0; height:46%; z-index:30; display:none;
    background:rgba(8,10,24,.96); border-top:2px solid rgba(107,227,255,.35);
    font-family:Consolas,"Courier New",monospace; font-size:13px; color:#c7e9ff;
    flex-direction:column; padding:10px 14px;
  }
  #term.show{display:flex;}
  #termlog{flex:1; overflow-y:auto; white-space:pre-wrap; line-height:1.55;}
  #termlog .c-dim{color:#5f6a8f;} #termlog .c-err{color:var(--red);} #termlog .c-ok{color:var(--teal);} #termlog .c-warn{color:var(--amber);}
  #terminput{display:flex; gap:8px; margin-top:6px; align-items:center;}
  #terminput .ps{color:var(--teal); white-space:nowrap;}
  #terminput input{
    flex:1; background:transparent; border:none; outline:none; color:#eaf6ff;
    font:inherit; caret-color:var(--cyan);
  }

  /* ---------- 假蓝屏 ---------- */
  #crash{
    position:fixed; inset:0; z-index:100; display:none; background:#0078d7; color:#fff;
    padding:12vh 10vw; font-family:"Segoe UI",sans-serif; cursor:pointer;
  }
  #crash.show{display:block;}
  #crash .sad{font-size:110px; font-weight:200;}
  #crash h1{font-size:26px; font-weight:400; margin:24px 0 14px; line-height:1.5;}
  #crash .pct{font-size:15px; margin-bottom:40px;}
  #crash .tip{font-size:14px; opacity:.85;}
  #crashbar{width:320px; height:4px; background:rgba(255,255,255,.25); margin-top:12px; display:none;}
  #crashbar i{display:block; height:100%; width:0%; background:#fff; transition:width .3s;}

  /* ---------- 触屏虚拟按键（移动端） ---------- */
  #touchui{position:absolute; inset:0; display:none; pointer-events:none; z-index:15;}
  body.touchdev #touchui{display:block;}
  .tbtn{
    position:absolute; pointer-events:auto; touch-action:none;
    width:64px; height:64px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:#e8ecff; font-size:22px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent; user-select:none;
    backdrop-filter:blur(2px);
  }
  .tbtn:active{background:rgba(255,255,255,.22);}
  .tbtn.small{width:48px; height:48px; font-size:15px; color:#9aa3c7;}
  .tbtn.on{background:rgba(122,140,255,.35); border-color:rgba(122,140,255,.6); color:#fff;}
  #tbLeft{left:18px; bottom:88px;} #tbRight{left:100px; bottom:88px;}
  #tbJump{right:18px; bottom:88px; width:74px; height:74px;}
  #tbEcho{right:104px; bottom:96px;}
  #tbPred{right:30px; bottom:180px;}
  #tbPause{left:18px; top:14px;}
  /* ---------- 造忆工坊 ---------- */
  #workshop{position:fixed;inset:0;z-index:50;display:none;pointer-events:none;}
  #workshop.show{display:block;}
  .ws-bar{position:absolute;top:12px;right:12px;bottom:12px;width:min(330px,42vw);background:rgba(13,16,34,.96);border:1px solid var(--line);border-radius:16px;padding:12px 14px;pointer-events:auto;overflow:auto;display:flex;flex-direction:column;gap:8px;}
  .ws-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .ws-head h2{font-size:19px;letter-spacing:2px;margin-right:auto;}
  #ws-name{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;color:#e8ecff;padding:6px 10px;font:inherit;font-size:13px;width:110px;}
  #ws-palette{display:flex;flex-wrap:wrap;gap:5px;}
  .ws-tool{padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);cursor:pointer;font-size:12.5px;color:#aab3d6;}
  .ws-tool.on{background:rgba(122,140,255,.4);color:#fff;}
  .ws-row{display:flex;flex-wrap:wrap;gap:6px;}
  #ws-msg{font-size:12.5px;color:#9fb0d8;line-height:1.5;}
  #ws-msg textarea{width:100%;height:56px;margin-top:4px;background:#0b0e20;color:#c7e9ff;border:1px solid var(--line);border-radius:8px;font:12px monospace;padding:6px;}
  #game.wsview{width:min(62vw,820px);margin-right:min(30vw,370px);}
  ::-webkit-scrollbar{width:9px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14); border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="toasts"></div>

  <div class="veil" id="veil"><div class="panel" id="panel"></div></div>

  <div id="term">
    <div id="termlog"></div>
    <div id="terminput">
      <span class="ps">幽灵@昨日之我:~$</span>
      <input id="termin" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div id="crash">
    <div class="sad">:(</div>
    <h1>ECHOES_OF_ME 遇到了问题，需要重新收集记忆。<br>我们只收集了部分回声，正在为你重播。</h1>
    <div class="pct"><span id="crashpct">0</span>% 完成</div>
    <div id="crashbar"><i id="crashfill"></i></div>
    <div class="tip">（按任意键或点击返回——放心，什么都没有坏。）</div>
  </div>

  <div id="touchui">
    <button class="tbtn small" id="tbPause">II</button>
    <button class="tbtn" id="tbLeft">◀</button>
    <button class="tbtn" id="tbRight">▶</button>
    <button class="tbtn" id="tbJump">⤒</button>
    <button class="tbtn" id="tbEcho">👻</button>
    <button class="tbtn" id="tbPred">👁</button>
  </div>

  <div id="workshop">
    <div class="ws-bar">
      <div class="ws-head">
        <h2>✎ 造忆工坊</h2>
        <input id="ws-name" maxlength="12" placeholder="给回忆起名">
        <button class="ws-tool" id="ws-close">✕</button>
      </div>
      <div id="ws-palette"></div>
      <div class="ws-row">
        <button class="ws-tool" id="ws-test">▶ 测试</button>
        <button class="ws-tool" id="ws-undo">↩ 撤销</button>
        <button class="ws-tool" id="ws-clear">清空</button>
        <button class="ws-tool" id="ws-copy">📋 时空码</button>
        <button class="ws-tool" id="ws-importbtn">📥 导入</button>
      </div>
      <div id="ws-msg">左键画 / 右键擦 / 拖拽连刷。放一个 P（出生）和一个 E（出口）就能测试。</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   昨日之我 · Echoes of Me —— 纯离线单文件小游戏
   核心机制：死亡/按 R 会把这段行动录成"幽灵回声"，回声会重播并替你压机关
   ===================================================================== */

/* ---------------- 基础常量 ---------------- */
const W = 960, H = 540, T = 48, COLS = 20, ROWS = 11, OY = 12;
const STEP = 1/60;
const GRAV = 2300, JUMPV = -830, SPEED = 340, MAXFALL = 980;
const COYOTE = 0.10, JBUF = 0.12, GHOST_MAX = 6, REC_MAX = 60*60;
const TIMED_WINDOW = 4.0;          // 粉色门开启时长（秒）
const RHYTHM_PERIOD = 2.4;         // 节拍尖刺周期

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const overlap=(a,b)=>a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

/* ---------------- 静态层预渲染（低配置流畅性） ---------------- */
let _bgGrads={}, tileLayer=null, titleLayer=null, vignette=null;
let winFlash=0, memCard=null, curtainT=0;
const dustMotes=[];{let sd=99;const rr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let i=0;i<26;i++)dustMotes.push({x:rr()*W,y:rr()*H*.85,spd:6+rr()*14,ph:rr()*6.28,a:.04+rr()*.07,s:1+rr()*1.6});}
const glowCache={};
function glowFor(hue){
  if(glowCache[hue])return glowCache[hue];
  const c=document.createElement('canvas');c.width=64;c.height=64;
  const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,2,32,32,30);
  r.addColorStop(0,'hsla('+hue+',80%,75%,.5)');r.addColorStop(1,'hsla('+hue+',80%,75%,0)');
  g.fillStyle=r;g.fillRect(0,0,64,64);
  glowCache[hue]=c;return c;
}
function bakeVignette(){
  vignette=document.createElement('canvas');vignette.width=W;vignette.height=H;
  const g=vignette.getContext('2d');
  const r=g.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.85);
  r.addColorStop(0,'rgba(4,6,16,0)');r.addColorStop(1,'rgba(4,6,16,.42)');
  g.fillStyle=r;g.fillRect(0,0,W,H);
}
function drawMemCard(){
  const c=memCard;if(!c)return;
  const t=c.t;
  const a=t<.4?t/.4:(t>2.8?Math.max(0,(3.4-t)/.6):1);
  ctx.globalAlpha=a;ctx.textAlign='center';
  ctx.strokeStyle='rgba(165,180,255,.25)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-95,126);ctx.lineTo(W/2+95,126);
  ctx.moveTo(W/2-95,163);ctx.lineTo(W/2+95,163);ctx.stroke();
  ctx.fillStyle='rgba(195,206,255,.6)';ctx.font='12px Georgia,serif';
  ctx.fillText(c.date,W/2,120);
  ctx.fillStyle='#eef1ff';ctx.font='25px "Microsoft YaHei",sans-serif';
  ctx.fillText('「'+c.name+'」',W/2,155);
  ctx.fillStyle='rgba(220,228,255,.72)';ctx.font='14px Georgia,serif';
  ctx.fillText(c.memo,W/2,182);
  ctx.globalAlpha=1;ctx.textAlign='left';
}
function bakeTiles(){
  tileLayer=document.createElement('canvas');tileLayer.width=W;tileLayer.height=H;
  const c=tileLayer.getContext('2d');
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(cur.grid[y][x]!=='#')continue;
    const px=x*T,py=y*T;
    const g=c.createLinearGradient(px,py,px,py+T);
    g.addColorStop(0,'#323a63');g.addColorStop(1,'#252b4c');
    c.fillStyle=g;
    c.beginPath();c.moveTo(px+8,py+1);c.arcTo(px+T-1,py+1,px+T-1,py+T-1,7);c.arcTo(px+T-1,py+T-1,px+1,py+T-1,7);c.arcTo(px+1,py+T-1,px+1,py+1,7);c.arcTo(px+1,py+1,px+T-1,py+1,7);c.closePath();
    c.fill();
    c.fillStyle='rgba(255,255,255,.07)';c.fillRect(px+3,py+2,T-6,3);
    c.strokeStyle='rgba(10,13,30,.8)';c.lineWidth=1.5;c.stroke();
  }
}
function bakeTitle(){
  titleLayer=document.createElement('canvas');titleLayer.width=440;titleLayer.height=110;
  const c=titleLayer.getContext('2d');
  c.font='bold 64px "Microsoft YaHei","Segoe UI",sans-serif';
  c.textAlign='center';c.textBaseline='middle';
  const g=c.createLinearGradient(0,10,0,100);
  g.addColorStop(0,'#ffffff');g.addColorStop(1,'#9fb0ff');
  c.fillStyle=g;c.shadowColor='rgba(122,140,255,.55)';c.shadowBlur=26;
  c.fillText('昨 日 之 我',220,58);
  c.shadowBlur=0;c.fillText('昨 日 之 我',220,58);
}

/* ---------------- 存档 ---------------- */
const SAVE_KEY='echoes_of_me_save_v1';
let save={v:1,unlocked:13,bonus:false,stars:{},deaths:0,visits:0,eggs:{}};
try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(raw){ const s=JSON.parse(raw); if(s && s.v===1) save=Object.assign(save,s); }
}catch(e){}
save.unlocked=Math.max(save.unlocked||0,13);
save.visits=(save.visits||0)+1;
function persist(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(save)); }catch(e){} }

/* ---------------- 音效（WebAudio 合成） ---------------- */
let AC=null, masterGain=null, muted=false, mPresses=0;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); masterGain=AC.createGain(); masterGain.gain.value=.5; masterGain.connect(AC.destination); startMusic(); }catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function beep(f0,f1,dur,type='sine',vol=.2,delay=0){
  if(muted||!audio())return;
  try{
    const t0=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0);
    if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(masterGain); o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const S={
  jump(){beep(300,520,.12,'square',.12);},
  die(){beep(240,50,.4,'sawtooth',.22);},
  rewind(){beep(700,180,.35,'sawtooth',.14); beep(900,300,.3,'sine',.1,.05);},
  plate(){beep(660,660,.07,'square',.1);},
  door(){beep(340,720,.25,'sine',.14);},
  star(){beep(880,880,.1,'sine',.16); beep(1174,1174,.12,'sine',.16,.09); beep(1568,1568,.16,'sine',.16,.18);},
  win(){[523,659,784,1046].forEach((f,i)=>beep(f,f,.18,'triangle',.2,i*.11));},
  egg(){beep(880,880,.09,'sine',.18); beep(1318,1318,.18,'sine',.18,.1);},
  tick(){beep(1100,1100,.04,'square',.07);},
  meow(){beep(760,560,.28,'sine',.14);},
  hug(){[660,830,990,1320].forEach((f,i)=>beep(f,f,.12,'sine',.12,i*.07));},
  latch(){beep(520,780,.18,'triangle',.16);},
  clear(){beep(500,120,.4,'sine',.14);},
};

/* ---------------- 程序化背景音乐（Am-F-C-G 环境 pad + 琶音） ---------------- */
let musicGain=null, musicFilter=null, musicTimer=null, musicStep=0, nextNote=0;
const CHORDS=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const mf=m=>440*Math.pow(2,(m-69)/12);
function startMusic(){
  if(!AC||musicTimer)return;
  musicGain=AC.createGain(); musicGain.gain.value=.16;
  musicFilter=AC.createBiquadFilter(); musicFilter.type='lowpass'; musicFilter.frequency.value=3200;
  musicGain.connect(musicFilter); musicFilter.connect(masterGain);
  nextNote=AC.currentTime+.1;
  musicTimer=setInterval(musicSchedule,180);
}
// 死亡时整个世界发闷，再慢慢醒来 —— 失败有声音的重量
function duckMusic(){
  if(!AC||!musicFilter)return;
  const t=AC.currentTime;
  try{
    musicFilter.frequency.cancelScheduledValues(t);
    musicFilter.frequency.setValueAtTime(Math.max(400,musicFilter.frequency.value),t);
    musicFilter.frequency.linearRampToValueAtTime(560,t+.08);
    musicFilter.frequency.linearRampToValueAtTime(3200,t+1.9);
  }catch(e){}
}
// 拥抱：一小节大和弦 —— 和过去的你和好的那一秒
function hugChord(){
  if(muted||!audio())return;
  try{[57,61,64,69].forEach((m,i)=>pluck(mf(m),AC.currentTime+i*.06,.07));}catch(e){}
}
function musicSchedule(){
  if(!AC)return;
  while(nextNote<AC.currentTime+.4){
    if(!muted)musicPlay(musicStep,nextNote);
    musicStep=(musicStep+1)%64;
    nextNote+=60/72/4;
  }
}
function padTone(f,t,dur){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.05,t+dur*.3);
  g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+dur+.05);
}
function pluck(f,t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='triangle';o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+.28);
  o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+.3);
}
function musicPlay(st,t){
  const bar=Math.floor(st/16)%4, pos=st%16;
  if(pos===0)CHORDS[bar].forEach(m=>padTone(mf(m-12),t,60/72*4.2));
  if(pos%2===0)pluck(mf(CHORDS[bar][(pos/2)%3]+12),t,.055);
  // 回声声部：幽灵越多，高音越密 —— "过去的你加入合唱"
  if(cur&&cur.ghosts.length){
    const n=Math.min(3,cur.ghosts.length);
    if(pos%2===1&&(pos>>1)%3<n)pluck(mf(CHORDS[bar][2]+24-(pos%4===3?5:0)),t,.04);
  }
}

function loadLevel(i,defOverride){
  const L=defOverride||LEVELS[i];
  cur={
    idx:defOverride?-1:i,grid:L.map.map(r=>r.split('')),name:L.name,hint:L.hint,secret:!!L.secret,hue:L.hue||225,custom:!!L.custom,
    spawn:{x:0,y:0},exit:{x:0,y:0},
    plates:[],doors:{A:[],B:[],C:[],K:[],T:[]},
    doorOpen:{A:false,B:false,C:false,K:false,T:false},
    latch:false,doorTimer:0,
    stars:[],ghosts:[],recorder:[],
    time:0,deaths:0,timeAcc:0,
  };
  const savedStars=(save.stars[i]||[]);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=L.map[y][x];
    if(ch==='P')cur.spawn={x:x*T+10,y:y*T+T-34.001};
    else if(ch==='E')cur.exit={x:x*T,y:y*T};
    else if(ch==='a'||ch==='b'||ch==='c'||ch==='k'||ch==='t')cur.plates.push({ch,tx:x,ty:y,was:false});
    else if('ABCKT'.includes(ch))cur.doors[ch].push({tx:x,ty:y});
    else if(ch==='s')cur.stars.push({tx:x,ty:y,got:!!savedStars[cur.stars.length]});
  }
  bakeTiles();
  memCard={name:L.name,date:L.date,memo:L.memo,t:0};
  cur.endless=!!L.endless;
  cur.custom=!!L.custom;
  if(cur.endless){cur.sliders=[];cur.spawnT=1.2;cur.exit={x:-9999,y:-9999};}
  // 门是整根能量柱：从地面那格向上延伸到顶或实体，跳不过去
  cur.doorGrid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  for(const dc of 'ABCKT'){
    for(const d of cur.doors[dc]){
      for(let y=d.ty;y>=0;y--){
        if(cur.grid[y][d.tx]==='#')break;
        cur.doorGrid[y][d.tx]=dc;
      }
    }
  }
  resetRun();
  hintQ=L.hint?[{text:L.hint,t:0,dur:6}]:[];
}

/* ---------------- 玩家 ---------------- */
const player={x:0,y:0,w:26,h:34,vx:0,vy:0,face:1,grounded:false,coyote:0,jbuf:0,dead:false,deadT:0,squash:0,blink:3};
// 冲刺：一次向前的爆发
let dashT=0, dashCharges=1, dashDir=1;

function solidAt(tx,ty){
  if(tx<0||tx>=COLS)return true;
  if(ty<0||ty>=ROWS)return false;
  const dch=cur.doorGrid[ty][tx];
  if(dch)return !cur.doorOpen[dch];
  return cur.grid[ty][tx]==='#';
}
function moveEntity(e,dt){
  e.x+=e.vx*dt;
  let y0=Math.floor(e.y/T), y1=Math.floor((e.y+e.h-0.001)/T);
  if(e.vx>0){ const tx=Math.floor((e.x+e.w-0.001)/T);
    for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w-0.001;e.vx=0;break;} }
  else if(e.vx<0){ const tx=Math.floor(e.x/T);
    for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T+0.001;e.vx=0;break;} }
  e.x=clamp(e.x,0,W-e.w);

  const wasGround=e.grounded;
  e.y+=e.vy*dt; e.grounded=false;
  let x0=Math.floor(e.x/T), x1=Math.floor((e.x+e.w-0.001)/T);
  if(e.vy>0){ const ty=Math.floor((e.y+e.h-0.001)/T);
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){e.y=ty*T-e.h-0.001;e.vy=0;e.grounded=true;break;} }
  else if(e.vy<0){ const ty=Math.floor(e.y/T);
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){e.y=(ty+1)*T+0.001;e.vy=0;break;} }
  if(!wasGround&&e.grounded&&e.vy===0){ e.squash=Math.min(.4,Math.abs(e.landV||0)/1600); if(e===player&&e.squash>.12)dust(e.x+e.w/2,e.y+e.h); }
  e.landV=e.vy;
}
function dust(x,y){for(let i=0;i<6;i++)particles.push({x,y,vx:rnd(-60,60),vy:rnd(-90,-20),life:rnd(.3,.5),max:.5,c:'#8f97c4',s:rnd(1.5,3),g:300});}
function confetti(x,y,n){const cols=['#ffb454','#b28cff','#4cd6c1','#ff7eb6','#6be3ff'];for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-220,220),vy:rnd(-320,-60),life:rnd(.6,1.1),max:1.1,c:cols[i%5],s:rnd(2,4),g:600});}

function rhythmOn(ch,t){
  const ph=t%RHYTHM_PERIOD;
  return ch==='%'?ph<RHYTHM_PERIOD/2:ph>=RHYTHM_PERIOD/2;
}

function playerTick(dt){
  const p=player;
  if(p.dead){ p.deadT-=dt; if(p.deadT<=0)commitGhostAndReset(true); return; }

  let dir=0;
  if(keys.left)dir-=1; if(keys.right)dir+=1;
  if(REVERSED)dir=-dir;

  if(dashT>0){
    dashT-=dt;
    p.jbuf-=dt;
    if(p.jbuf>0){ // 冲刺跳：带着动量跃出
      dashT=0; p.jbuf=0; p.vy=JUMPV*0.92; p.vx=dashDir*500; p.grounded=false; S.jump();
      particles.push({x:p.x+13,y:p.y+20,vx:0,vy:20,life:.3,max:.3,c:'#8fd8ff',s:3});
    }
    if(dashT>0){
      p.vx=dashDir*640; p.vy=0;
      particles.push({x:p.x+13,y:p.y+16,vx:rnd(-15,15),vy:rnd(-15,15),life:.3,max:.3,c:'#8fd8ff',s:rnd(2,3.5)});
    }
    moveEntity(p,dt);
    if(dashT<=0&&p.vy>0)p.vx=dashDir*SPEED;
  }else{
    const target=dir*SPEED;
    const a=(p.grounded?4200:2600);
    if(target>p.vx)p.vx=Math.min(target,p.vx+a*dt); else if(target<p.vx)p.vx=Math.max(target,p.vx-a*dt);
    if(dir!==0)p.face=dir;

    p.jbuf-=dt;p.coyote-=dt;
    if(p.grounded)p.coyote=COYOTE;
    if(p.jbuf>0&&p.coyote>0){
      p.vy=JUMPV;p.jbuf=0;p.coyote=0;p.grounded=false;S.jump();
      p.squash=-.25;
    }
    const g=GRAV*(moonMode?0.42:1);
    p.vy=Math.min(p.vy+g*dt,MAXFALL);
    const preVy=p.vy;
    moveEntity(p,dt);
    p.landV=preVy;
  }
  if(p.grounded)dashCharges=1;
  p.squash*=Math.pow(.001,dt);
  p.blink-=dt;if(p.blink<-0.12)p.blink=rnd(2.4,4.5);

  // 录制
  if(cur.recorder.length<REC_MAX)cur.recorder.push({x:p.x,y:p.y,f:p.face});

  // 尖刺
  const bx=p.x+4,by=p.y+6,bw=p.w-8,bh=p.h-10;
  const body={x:bx,y:by,w:bw,h:bh};
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const ch=cur.grid[ty][tx];
    if(ch==='^'||ch==='%'||ch==='&'){
      if(ch!=='^'&&!rhythmOn(ch,cur.time))continue;
      const z={x:tx*T+8,y:ty*T+T*0.5,w:T-16,h:T*0.5};
      if(overlap(body,z)){die();return;}
    }
  }
  // 被关上的门夹住
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const dc=cur.doorGrid[ty][tx];
    if(dc&&!cur.doorOpen[dc]&&overlap(body,{x:tx*T,y:ty*T,w:T,h:T})){die('被门夹住了。');return;}
  }
  // 掉出世界
  if(p.y>H+80){die();return;}

  // 星星
  for(const st of cur.stars){
    if(st.got)continue;
    const z={x:st.tx*T+8,y:st.ty*T+8,w:T-16,h:T-16};
    if(overlap(body,z)){
      st.got=true;S.star();confetti(st.tx*T+T/2,st.ty*T+T/2,14);
      checkStarAll();
    }
  }
  // 出口
  const ez={x:cur.exit.x+4,y:cur.exit.y,w:T-8,h:T};
  if(overlap(body,ez)){winLevel();return;}

  // 拥抱检测
  hugTick(dt);
}
function die(msg){
  const p=player;if(p.dead)return;
  p.dead=true;p.deadT=0.55;
  save.deaths++;cur.deaths++;persist();
  if(save.deaths===10)markEgg('deaths10');
  if(save.deaths===50)markEgg('deaths50');
  S.die();duckMusic();shake=Math.min(10,4+cur.deaths%5);
  for(let i=0;i<18;i++)particles.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:rnd(-260,260),vy:rnd(-340,80),life:rnd(.4,.8),max:.8,c:i%3?'#f5f7ff':'#ff5d73',s:rnd(2,4),g:800});
  if(msg||cur.deaths%2===0)hintQ.push({text:msg||DEATH_LINES[deathMsgI++%DEATH_LINES.length],t:0,dur:2.2});
  if(cur.deaths===5&&LEVEL_TIPS[cur.idx])hintQ.push({text:'提示：'+LEVEL_TIPS[cur.idx],t:0,dur:7});
  if(cur.deaths===15&&!cur.endless)toast('卡住了？按 P 去选关歇会儿——昨天跑不掉，随时可以回来。',true);
  sleeping=false;
}
function commitGhostAndReset(fromDeath){
  triggerRewindFX();
  if(fromDeath&&cur.endless){ endEndlessRun(); return; }
  const rec=cur.recorder;
  if(rec.length>10){

function ghostsTick(dt){
  for(const g of cur.ghosts){
    if(g.done)continue;
    g.t+=dt;
    const idx=Math.floor(g.t*60);
    if(idx>=g.frames.length){g.done=true;const l=g.frames[g.frames.length-1];g.x=l.x;g.y=l.y;g.f=l.f;}
    else{const f=g.frames[idx];g.x=f.x;g.y=f.y;g.f=f.f;
      g.trail=g.trail||[];
      if(Math.floor(g.t*60)%3===0){g.trail.push({x:g.x,y:g.y});if(g.trail.length>12)g.trail.shift();}
    }
  }
  // 压板
  const pbody={x:player.x+2,y:player.y+4,w:player.w-4,h:player.h-4};
  let anyChange=false;
  for(const pl of cur.plates){
    const zone={x:pl.tx*T+3,y:pl.ty*T+T-24,w:T-6,h:24};
    const pPress=overlap(pbody,zone);
    let pressed=pPress;
    if(!pressed)for(const g of cur.ghosts){
      const gb={x:g.x+2,y:g.y+4,w:player.w-4,h:player.h-4};
      if(overlap(gb,zone)){pressed=true;break;}
    }
    if(pressed&&!pl.was){
      S.plate();anyChange=true;
      if(!pPress)save.statHelped=(save.statHelped||0)+1;   // 是回声替你按的
      particles.push({x:pl.tx*T+T/2,y:pl.ty*T+T-14,ring:true,life:.5,max:.5,col:(pl.ch==='k'?'#7ddf8a':pl.ch==='t'?'#ff7eb6':'#ffb454')});
    }
    if(pPress&&pl.ch==='k'&&!cur.latch){cur.latch=true;S.latch();hintQ.push({text:'绿色圆盘记住了你。',t:0,dur:3});}
    if(pressed&&pl.ch==='t'&&!pl.was){cur.doorTimer=TIMED_WINDOW;S.door();}
    pl.was=pressed;
  }
  // 门状态
  const before=JSON.stringify(cur.doorOpen);
  const hold={A:false,B:false,C:false};
  for(const pl of cur.plates)if(hold.hasOwnProperty(pl.ch.toUpperCase())&&pl.was)hold[pl.ch.toUpperCase()]=true;
  cur.doorOpen.A=hold.A;cur.doorOpen.B=hold.B;cur.doorOpen.C=hold.C;

  const after=JSON.stringify(cur.doorOpen);
  if(before!==after&&!anyChange)S.door();
}

/* ---------------- 预知：推演"如果现在留下回声" ---------------- */
let predictOn=false, pred={frames:[],dead:null};
function computePrediction(){
  const frames=[];let dead=null;
  const s={x:player.x,y:player.y,vx:player.vx,vy:player.vy,grounded:player.grounded,w:player.w,h:player.h,squash:0,landV:0};
  let dir=(keys.right?1:0)-(keys.left?1:0);
  if(REVERSED)dir=-dir;
  for(let i=0;i<150;i++){
    const target=dir*SPEED,a=(s.grounded?4200:2600);
    if(target>s.vx)s.vx=Math.min(target,s.vx+a*STEP);
    else if(target<s.vx)s.vx=Math.max(target,s.vx-a*STEP);
    s.vy=Math.min(s.vy+GRAV*STEP,MAXFALL);
    moveEntity(s,STEP);
    if(s.y>H+80){dead={x:s.x,y:H-60};break;}
    const body={x:s.x+4,y:s.y+6,w:s.w-8,h:s.h-10};
    let hit=false;
    for(let ty=0;ty<ROWS&&!hit;ty++)for(let tx=0;tx<COLS;tx++){
      if(cur.grid[ty][tx]==='^'&&overlap(body,{x:tx*T+8,y:ty*T+T*0.5,w:T-16,h:T*0.5})){hit=true;break;}
    }
    if(!hit)for(let ty=0;ty<ROWS&&!hit;ty++){
      const dc=cur.doorGrid[ty][Math.floor((s.x+s.w/2)/T)];
      if(dc&&!cur.doorOpen[dc]&&overlap(body,{x:Math.floor((s.x+s.w/2)/T)*T,y:ty*T,w:T,h:T}))hit=true;
    }
    if(hit){dead={x:s.x,y:s.y};break;}
    if(i%6===0)frames.push({x:s.x,y:s.y});
  }
  return{frames,dead};
}
function drawPrediction(){
  ctx.fillStyle='#8fa3ff';
  pred.frames.forEach((f,i)=>{
    ctx.globalAlpha=Math.max(0,.55-i*.03);
    ctx.beginPath();ctx.arc(f.x+13,f.y+17,2.5,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(pred.dead){
    const dx=pred.dead.x+13,dy=pred.dead.y+17;
    ctx.strokeStyle='#ff5d73';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(dx-7,dy-7);ctx.lineTo(dx+7,dy+7);
    ctx.moveTo(dx+7,dy-7);ctx.lineTo(dx-7,dy+7);ctx.stroke();
  }else if(pred.frames.length){
    const l=pred.frames[pred.frames.length-1];
    ctx.globalAlpha=.3;ctx.fillStyle='#8fa3ff';
    rounded(l.x,l.y,26,34,8);ctx.fill();ctx.globalAlpha=1;
  }
}

  let dt=(now-lastT)/1000;lastT=now;
  if(dt>0.1)dt=0.1;
  acc+=dt;
  let n=0;
  while(acc>=STEP&&n<5){tick(STEP);acc-=STEP;n++;}
  if(n===5)acc=0;
  render(dt);
}
function tick(dt){
  window.__tickN=(window.__tickN||0)+1;
  if(memCard){memCard.t+=dt;if(memCard.t>3.4)memCard=null;}
  particlesTick(dt);hintTick(dt);
  if(shake>0)shake=Math.max(0,shake-dt*22);
  if(mirrorT>0)mirrorT-=dt;
  if(mode==='title'){titleGhostsTick(dt);titleTick(dt);idleCheck(dt);return;}
  if(mode==='curtain'){ curtainT+=dt; if(curtainT>4.6){ mode='win'; openPanel('complete'); } return; }
  if(mode!=='play')return;
  cur.timeAcc+=dt;cur.time+=dt;
  playerTick(dt);
  ghostsTick(dt);
  if(predictOn&&!player.dead)pred=computePrediction();
  if(cur.endless)endlessTick(dt);
  catTick(dt);
  idleCheck(dt);
}
let idleT=0;
function idleCheck(dt){
  if(performance.now()-lastInput>25000){
    if(!sleeping){sleeping=true;markEgg('sleep');}
    if(sleeping&&Math.random()<dt*0.7){
      const p=mode==='title'?tChar:player;
      particles.push({x:p.x+20+rnd(-8,8),y:p.y-6,vx:rnd(-12,12),vy:-36,life:1.4,max:1.4,c:'#aab3d6',s:0,g:-10,zz:true,zi:1});
    }
  }
}

   渲 染
   ===================================================================== */
const bgStars=[];{let sd=7;const rr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  for(let i=0;i<70;i++)bgStars.push({x:rr()*W,y:rr()*H*0.8,r:rr()*1.4+0.4,tw:rr()*6});}

function render(dt){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  // 背景（按关卡记忆染色）
  const hueNow=(mode==='title'||!cur)?225:cur.hue;
  let bg=_bgGrads[hueNow];
  if(!bg){
    bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'hsl('+hueNow+',42%,14%)');
    bg.addColorStop(.6,'hsl('+hueNow+',48%,9%)');
    bg.addColorStop(1,'hsl('+hueNow+',55%,6%)');
    _bgGrads[hueNow]=bg;
  }
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  // 星星（随记忆染色）+ 浮尘
  const now=performance.now()/1000;
  for(const s of bgStars){
    ctx.globalAlpha=.25+.35*Math.abs(Math.sin(now*.7+s.tw));
    ctx.fillStyle=rainbowMode?('hsl('+((now*80+s.tw*40)%360)+',80%,75%)'):('hsl('+hueNow+',45%,78%)');
    ctx.fillRect(s.x,s.y,s.r,s.r);
  }
  ctx.fillStyle='#cdd8ff';
  for(const m of dustMotes){
    let x=(m.x-now*m.spd)%W;if(x<0)x+=W;
    ctx.globalAlpha=m.a;
    ctx.fillRect(x,m.y+Math.sin(now*m.ph)*10,m.s,m.s);
  }
  ctx.globalAlpha=1;

  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));

  if(wsView){renderWorkshopView(now);}
  else if(mode==='title'){renderTitle(now);}
  else if(mode==='curtain'){renderCurtain(now);}
  else renderWorld(now);

  // 回溯残影
  if(rewindFX){
    rewindFX.t+=dt;const k=rewindFX.t/.5;
    if(k>=1)rewindFX=null;
    else{
      const sc=1+k*.06,w2=W*sc,h2=H*sc;
      ctx.globalAlpha=(1-k)*.5;
      ctx.drawImage(rewindFX.img,(W-w2)/2,(H-h2)/2,w2,h2);
      ctx.globalAlpha=(1-k)*.22;
      ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
      ctx.drawImage(rewindFX.img,(W-w2)/2,(H-h2)/2,w2,h2);
      ctx.restore();ctx.globalAlpha=1;
    }
  }

  ctx.restore();
  // 记忆卡片 + 通关白闪 + 暗角
  if(mode==='play')drawMemCard();
  if(winFlash>0){
    winFlash=Math.max(0,winFlash-dt*1.3);
    ctx.fillStyle='rgba(255,255,255,'+(winFlash*.8).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(vignette&&!wsView)ctx.drawImage(vignette,0,0);
  // 镜像提示
  if(mirrorT>0&&mode!=='title'){
    ctx.fillStyle='rgba(255,126,182,.9)';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText('镜像世界 '+mirrorT.toFixed(1)+'s',W/2,26);
  }
  renderHints();
  if(mode==='play'||mode==='win')renderHUD();
}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function renderWorld(now){
  ctx.save();
  if(mirrorT>0){ctx.translate(W,0);ctx.scale(-1,1);}
  ctx.translate(0,OY);

  const t=cur.time;
  // 瓦片（静态层一次绘制，伪墙单独动态闪烁）
  if(tileLayer)ctx.drawImage(tileLayer,0,0);
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const ch=cur.grid[y][x];const px=x*T,py=y*T;
    if(ch==='~')drawTile(px,py,true,now);
    else if(ch==='^'){
      drawSpike(px,py,true,true);
    }else if(ch==='%'||ch==='&'){
      const on=rhythmOn(ch,t);
      const ph=t%RHYTHM_PERIOD;
      const offPhase=ch==='%'?ph>=RHYTHM_PERIOD/2:ph<RHYTHM_PERIOD/2;
      const pre=offPhase&&((ch==='%'?ph-RHYTHM_PERIOD/2:ph)>RHYTHM_PERIOD/2-0.35);
      drawSpike(px,py,on,false,pre);
    }
  }
  // 门（整根能量柱）
  for(let ty=0;ty<ROWS;ty++)for(let tx=0;tx<COLS;tx++){
    const dc=cur.doorGrid[ty][tx];
    if(dc)drawDoor({tx,ty},dc,cur.doorOpen[dc],now);
  }
  // 压板
  for(const pl of cur.plates)drawPlate(pl);
  // 星星
  for(const st of cur.stars)if(!st.got)drawStar(st.tx*T+T/2,st.ty*T+T/2,now);
  // 出口
  drawExit(cur.exit.x,cur.exit.y,now);
  // 幽灵
  cur.ghosts.forEach((g,i)=>drawGhost(g,i,now));
  // 预知轨迹
  if(predictOn&&!player.dead)drawPrediction();
  // 猫
  if(cat)drawCat(now);
  // 无尽回廊的浪头
  if(cur.endless)for(const s of cur.sliders)drawSlider(s);
  // 玩家
  if(!player.dead)drawPlayer(player,now,false,sleeping);
  // 粒子
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    if(p.ring){
      ctx.strokeStyle=p.col;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(p.x,p.y,4+(1-p.life/p.max)*24,0,7);ctx.stroke();
    }
    else if(p.zz){ctx.fillStyle='#aab3d6';ctx.font='16px sans-serif';ctx.fillText('Z'.repeat(Math.min(3,1+Math.floor((1-p.life/p.max)*3))),p.x,p.y);}
    else{ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s);}
  }
  ctx.globalAlpha=1;

  // 计时门倒计时
  if(cur.doorTimer>0){
    const pl=cur.plates.find(q=>q.ch==='t');
    if(pl){
      const px=pl.tx*T+T/2,py=pl.ty*T-14;
      ctx.strokeStyle='rgba(255,126,182,.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px,py,8,-Math.PI/2,-Math.PI/2+Math.PI*2*(cur.doorTimer/TIMED_WINDOW));ctx.stroke();
    }
  }
  ctx.restore();
}
function drawTile(px,py,fake,now){
  if(fake){
    const ph=Math.sin(now*0.9+px*0.13);
    if(ph>0.985)ctx.globalAlpha=.72;
  }
  const g=ctx.createLinearGradient(px,py,px,py+T);
  g.addColorStop(0,'#323a63');g.addColorStop(1,'#252b4c');
  ctx.fillStyle=g;rounded(px+1,py+1,T-2,T-2,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(px+3,py+2,T-6,3);
  ctx.strokeStyle='rgba(10,13,30,.8)';ctx.lineWidth=1.5;rounded(px+1,py+1,T-2,T-2,7);ctx.stroke();
  ctx.globalAlpha=1;
}
function drawSpike(px,py,up,static_,pre){
  if(up){
    ctx.fillStyle=static_?'#8a3a4c':'#ff5d73';
    for(let i=0;i<3;i++){
      const x0=px+4+i*(T-8)/3;
      ctx.beginPath();ctx.moveTo(x0,py+T);ctx.lineTo(x0+(T-8)/6,py+T*0.42);ctx.lineTo(x0+(T-8)/3,py+T);ctx.closePath();ctx.fill();
    }
  }else{
    ctx.fillStyle='#3c2f45';
    for(let i=0;i<3;i++){
      const x0=px+6+i*(T-12)/3;
      ctx.beginPath();ctx.moveTo(x0,py+T);ctx.lineTo(x0+(T-12)/6,py+T-8);ctx.lineTo(x0+(T-12)/3,py+T);ctx.closePath();ctx.fill();
    }
  }
  if(pre){
    ctx.fillStyle='#ffd27e';ctx.globalAlpha=.45+.55*Math.sin(performance.now()/40);
    ctx.fillRect(px+3,py+T-14,T-6,3);ctx.globalAlpha=1;
  }
}
function drawDoor(d,dc,open,now){
  if(open)return;

  ctx.globalAlpha=.8;ctx.fillStyle=g;

function drawPlate(pl){
  const px=pl.tx*T,py=pl.ty*T;

function drawStar(x,y,now){
  const r=10+Math.sin(now*3)*2;
  ctx.save();ctx.translate(x,y+Math.sin(now*2)*3);ctx.rotate(now*1.2);
  ctx.fillStyle='#ffd27e';
  ctx.beginPath();
  for(let i=0;i<10;i++){const rr=i%2?r*0.45:r;const a=i*Math.PI/5;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
  ctx.closePath();ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(255,210,126,.25)';ctx.beginPath();ctx.arc(x,y,16,0,7);ctx.fill();
}
function drawExit(px,py,now){
  const g=ctx.createLinearGradient(px,py,px,py+T);
  g.addColorStop(0,'#0e1330');g.addColorStop(1,'#1b2350');
  ctx.fillStyle=g;rounded(px+2,py-6,T-4,T+6,8);ctx.fill();
  ctx.strokeStyle='#6be3ff';ctx.lineWidth=2;ctx.globalAlpha=.6+.4*Math.sin(now*3);
  rounded(px+2,py-6,T-4,T+6,8);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle='#6be3ff';
  for(let i=0;i<3;i++){
    const yy=py+T-((now*30+i*16)%T);

function drawPlayer(p,now,isTitle,sleep){
  const sq=p.squash||0;
  const w=p.w*(1+sq*.5),h=p.h*(1-sq*.4);
  const x=p.x-(w-p.w)/2,y=p.y+(p.h-h);
  ctx.save();
  // 彩虹拖尾
  if(rainbowMode&&!isTitle){
    ctx.fillStyle='hsl('+(now*160%360)+',85%,65%)';ctx.globalAlpha=.3;
    ctx.beginPath();ctx.arc(x+w/2,y+h/2,w*.7,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.fillStyle='#f5f7ff';rounded(x,y,w,h,8);ctx.fill();
  ctx.strokeStyle='rgba(20,25,60,.5)';ctx.lineWidth=1.5;rounded(x,y,w,h,8);ctx.stroke();
  const ex=p.face>0?x+w*0.58:x+w*0.18;
  if(sleep){
    ctx.strokeStyle='#141a3a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ex-6,y+11);ctx.quadraticCurveTo(ex-2,y+14,ex+2,y+11);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ex+5,y+11);ctx.quadraticCurveTo(ex+9,y+14,ex+13,y+11);ctx.stroke();
  }else if(p.blink<0){
    ctx.strokeStyle='#141a3a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(ex-2,y+11);ctx.lineTo(ex+4,y+11);ctx.stroke();
    ctx.beginPath();ctx.moveTo(ex+8,y+11);ctx.lineTo(ex+14,y+11);ctx.stroke();
  }else{
    ctx.fillStyle='#141a3a';
    ctx.beginPath();ctx.arc(ex+2,y+11,3,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(ex+10,y+11,3,0,7);ctx.fill();
  }
  ctx.restore();
}
function drawGhost(g,i,now){
  const bob=Math.sin(now*2.5+i*1.7)*3;
  const p={x:g.x,y:g.y+bob,w:player.w,h:player.h};
  const hue=g.hue||300;
  // 柔光（过去的你自带存在感）
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=.45+.15*Math.sin(now*2.5+i*1.7);
  ctx.drawImage(glowFor(hue),p.x+13-36,p.y+17-36,72,72);
  ctx.restore();
  // 运动残影轨迹
  const tr=g.trail||[];
  for(let k=0;k<tr.length;k++){
    ctx.globalAlpha=.04+.035*k;
    ctx.fillStyle='hsl('+hue+',70%,72%)';
    rounded(tr[k].x+4,tr[k].y+6,18,22,6);ctx.fill();
  }
  ctx.globalAlpha=.34;
  ctx.fillStyle='hsl('+hue+',70%,70%)';
  rounded(p.x,p.y,p.w,p.h-6,8);ctx.fill();
  // 波浪下摆
  ctx.beginPath();ctx.moveTo(p.x,p.y+p.h-8);
  for(let k=0;k<=4;k++)ctx.lineTo(p.x+k*p.w/4,p.y+p.h-8+((k%2)?5:-2)+Math.sin(now*5+k)*2);
  ctx.lineTo(p.x+p.w,p.y+p.h-14);ctx.lineTo(p.x+p.w,p.y);ctx.lineTo(p.x,p.y);ctx.closePath();ctx.fill();
  ctx.globalAlpha=.75;
  ctx.fillStyle='hsl('+hue+',70%,30%)';
  const ex=g.f>0?p.x+p.w*0.56:p.x+p.w*0.16;
  ctx.beginPath();ctx.arc(ex+2,p.y+12,2.6,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(ex+10,p.y+12,2.6,0,7);ctx.fill();
  ctx.restore();
}
function drawCat(now){

/* ---------------- 无尽回廊：时间的浪头 ---------------- */
function endlessTick(dt){
  cur.spawnT-=dt;
  if(cur.spawnT<=0){
    cur.spawnT=Math.max(.55,1.5-cur.time*.02);
    const fromL=Math.random()<.5;
    const spd=rnd(120,190)+Math.min(160,cur.time*2.2);
    cur.sliders.push({x:fromL?-40:W+40,vx:(fromL?1:-1)*spd,y:408,w:26,h:24});
  }
  for(let i=cur.sliders.length-1;i>=0;i--){
    const s=cur.sliders[i];
    s.x+=s.vx*dt;
    if(s.x<-60||s.x>W+60){cur.sliders.splice(i,1);continue;}
    if(!player.dead&&overlap({x:player.x+4,y:player.y+6,w:player.w-8,h:player.h-10},{x:s.x,y:s.y,w:s.w,h:s.h}))die('被时间的浪头吞没。');
  }
}
function drawSlider(s){
  ctx.fillStyle='#5c2436';rounded(s.x,s.y+8,s.w,s.h-8,4);ctx.fill();
  ctx.fillStyle='#ff5d73';
  for(let k=0;k<3;k++){const bx=s.x+2+k*8;ctx.beginPath();ctx.moveTo(bx,s.y+10);ctx.lineTo(bx+4,s.y);ctx.lineTo(bx+8,s.y+10);ctx.closePath();ctx.fill();}
}
let endlessResult={t:0,best:0,newBest:false};
function endEndlessRun(){
  const t=Math.round(cur.time*10)/10;
  const nb=t>(save.endlessBest||0);
  if(nb)save.endlessBest=t;
  persist();
  endlessResult={t,best:save.endlessBest||t,newBest:nb};
  openPanel('endless');
}
function buildEndlessOver(){
  const h=document.createElement('h2');h.textContent='⏱ 无尽回廊 · 到此为止';panel.appendChild(h);
  const s=document.createElement('div');s.className='sub';
  s.textContent='你坚持了 '+endlessResult.t.toFixed(1)+' 秒'+(endlessResult.newBest?' · 🏅 新纪录！':' · 最佳 '+endlessResult.best.toFixed(1)+' 秒');

function renderWorkshopView(now){

      drawSpike(px,py,on,false,!on);

  for(let c=0;c<=20;c++){ctx.moveTo(c*T,0);ctx.lineTo(c*T,11*T);}

/* ---------------- ✎ 造忆工坊：把你的昨天，造成一个关卡 ---------------- */
const WS_TOOLS=[
 {c:'.',n:'橡皮'},{c:'#',n:'墙'},{c:'~',n:'虚墙'},{c:'^',n:'尖刺'},
 {c:'%',n:'节拍A'},{c:'&',n:'节拍B'},{c:'s',n:'星星'},
 {c:'a',n:'板a'},{c:'A',n:'门A'},{c:'b',n:'板b'},{c:'B',n:'门B'},{c:'c',n:'板c'},{c:'C',n:'门C'},
 {c:'k',n:'铭记板'},{c:'K',n:'铭记门'},{c:'t',n:'计时板'},{c:'T',n:'计时门'},
 {c:'P',n:'出生点'},{c:'E',n:'出口'},
];
const WS_COLORS={'#':'#8a93b8','~':'#5f6a92','^':'#ff5d73','%':'#ff7eb6','&':'#ff7eb6','s':'#ffd27e','a':'#ffb454','A':'#ffb454','b':'#b28cff','B':'#b28cff','c':'#4cd6c1','C':'#4cd6c1','k':'#7ddf8a','K':'#7ddf8a','t':'#ff9db8','T':'#ff9db8','P':'#f5f7ff','E':'#6be3ff','.':'#454d70'};
let wsTool='#', wsPainting=false, wsErase=false, wsUndoStack=[], wsView=false, wsHover=null;
let workshop=(function(){
  let m=null;
  try{ m=JSON.parse(localStorage.getItem('eom.ws')||'null'); }catch(e){}
  if(!m||!Array.isArray(m.map)||m.map.length!==11){
    m={name:'未命名回忆'};
    m.map=[
    "....................","....................","....................","....................",
    "....................","....................","....................","....................",
    ".P................E.","####################","####################"];
  }
  return m;
})();
function wsSave(){ try{ localStorage.setItem('eom.ws',JSON.stringify(workshop)); }catch(e){} }
function wsPushUndo(){ wsUndoStack.push(workshop.map.slice()); if(wsUndoStack.length>30)wsUndoStack.shift(); }
function wsUndo(){
  const m=wsUndoStack.pop();
  if(!m){ wsMsg('没有可撤销的操作。'); return; }
  workshop.map=m; wsSave(); wsMsg('已撤销。');
}
function wsMsg(html){ document.getElementById('ws-msg').innerHTML=html; }
function wsBlankMap(){
  const m=[]; for(let r=0;r<11;r++)m.push(r>=9?"####################":"....................");
  m[8]=".P................E."; return m;
}
function openWorkshop(){
  if(veilOpen())closePanel();          // 强制关闭残留面板，绝不让两个窗口叠着

}
function closeWorkshop(){
  wsView=false; cv.classList.remove('wsview');
  if(mode==='pause')mode='play';
  document.getElementById('workshop').classList.remove('show');
  wsSave();
}
function renderWsPalette(){
  const pal=document.getElementById('ws-palette'); pal.innerHTML='';
  WS_TOOLS.forEach(t=>{
    const b=document.createElement('button');
    b.className='ws-tool'+(wsTool===t.c?' on':'');
    b.innerHTML='<span style="color:'+(WS_COLORS[t.c]||'#fff')+'">'+(t.c==='.'?'·':t.c)+'</span> '+t.n;
    b.addEventListener('click',()=>{ wsTool=t.c; renderWsPalette(); });
    pal.appendChild(b);
  });
}
let wsCvBound=false;
function bindWsCanvas(){
  if(wsCvBound)return; wsCvBound=true;
  cv.addEventListener('pointerdown',e=>{
    if(!wsView)return;
    e.preventDefault();
    wsPainting=true; wsErase=(e.button===2); wsPushUndo();
    const p=wsCellFromEvent(e);
    if(p)wsPaint(p.r,p.c,wsErase);
  });
  cv.addEventListener('pointermove',e=>{
    if(!wsView)return;
    wsHover=wsCellFromEvent(e);
    if(wsPainting&&wsHover)wsPaint(wsHover.r,wsHover.c,wsErase);
  });
  cv.addEventListener('pointerleave',()=>{ wsHover=null; });
  cv.addEventListener('pointerup',()=>{ wsPainting=false; wsErase=false; });
  cv.addEventListener('contextmenu',e=>{ if(wsView)e.preventDefault(); });
}
function wsCellFromEvent(e){
  const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(cv.width/rect.width);
  const y=(e.clientY-rect.top)*(cv.height/rect.height)-OY;
  const c=Math.floor(x/T), r=Math.floor(y/T);
  if(r<0||r>=11||c<0||c>=20)return null;
  return {r,c};
}
function wsPaint(r,c,erase){
  const ch=erase?'.':wsTool;
  if(ch==='P'||ch==='E'){
    workshop.map=workshop.map.map(row=>row.split('').map(x=>x===ch?'.':x).join(''));
  }
  const row=workshop.map[r].split('');
  row[c]=ch;
  workshop.map[r]=row.join('');
  wsSave();
}
function wsValidate(){
  const rows=workshop.map, all=rows.join('');
  const errs=[];
  if(rows.length!==11||rows.some(r=>r.length!==20))errs.push('地图尺寸必须是 11×20。');
  if(!all.includes('P'))errs.push('缺少出生点 P。');
  if(!all.includes('E'))errs.push('缺少出口 E。');
  for(const d of ['A','B','C','K','T']) if(all.includes(d)&&!all.includes(d.toLowerCase())) errs.push(d+' 门没有对应的 '+d.toLowerCase()+' 压板，它将永远关着。');
  return errs;
}
function wsTest(){
  const errs=wsValidate();
  if(errs.length){ wsMsg('⚠ '+errs.join('<br>⚠ ')); return; }
  wsSave(); closeWorkshop(); startCustomLevel();
}
function wsClear(){
  if(!confirm('清空画布？'))return;
  workshop.map=wsBlankMap(); wsSave(); wsMsg('画布已清空。');
}
function wsCopyCode(){
  const code='EOM1.'+btoa(workshop.map.join('\n'));
  wsMsg('你的时空码（复制给朋友，他们在工坊里「导入时空码」即可游玩）：<textarea readonly id="ws-code">'+code+'</textarea>');
  const ta=document.getElementById('ws-code');
  ta.addEventListener('click',()=>{ta.select();try{document.execCommand('copy');}catch(e){}});
  ta.select();
}
function wsImportFromText(){
  const ta=document.getElementById('ws-import');
  if(!ta||!ta.value.trim()){ wsMsg('请先把时空码粘贴进输入框。'); return; }
  let code=ta.value.trim();
  try{
    if(code.startsWith('EOM1.'))code=code.slice(5);
    const rows=atob(code).split('\n');
    if(rows.length!==11||rows.some(r=>r.length!==20))throw 0;
    for(const row of rows)for(const ch of row)if(!' .#~^%&sabcABCKTtPE'.includes(ch))throw 0;
    wsPushUndo();
    workshop.name='导入的回忆';
    workshop.map=rows;
    wsSave();
    document.getElementById('ws-name').value=workshop.name;
    wsMsg('✅ 导入成功！点击「▶ 测试游玩」开始。');
  }catch(e){ wsMsg('⚠ 时空码无效。'); }
}
function startCustomLevel(){
  const def={name:(workshop.name||'未命名回忆'),hue:55,date:'由你创造',memo:'这一段记忆，来自另一个你。',hint:'',map:workshop.map.slice(),custom:true};
  loadLevel(0,def);
  mode='play';
}
(function(){
  window.addEventListener('pointerup',()=>{ wsPainting=false; wsErase=false; });
  window.addEventListener('pointercancel',()=>{ wsPainting=false; wsErase=false; });

  g.addColorStop(0,'#171c3c');g.addColorStop(1,'#0a0d20');

  let sd=7;const rr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};
  x.fillStyle='#b4c3ff';
  for(let i=0;i<70;i++){x.globalAlpha=.15+rr()*.45;x.fillRect(rr()*760,rr()*300,rr()<.5?1:2,rr()<.5?1:2);}
  x.globalAlpha=1;
  const mg=x.createRadialGradient(648,66,4,648,66,40);
  mg.addColorStop(0,'rgba(255,236,190,.9)');mg.addColorStop(1,'rgba(255,236,190,0)');
  x.fillStyle=mg;x.beginPath();x.arc(648,66,40,0,7);x.fill();
  x.fillStyle='#ffeec2';x.beginPath();x.arc(648,66,20,0,7);x.fill();
  x.textAlign='center';
  x.fillStyle='#f2f5ff';x.font='bold 42px "Microsoft YaHei",sans-serif';
  x.fillText('昨 日 之 我',380,104);
  x.fillStyle='rgba(154,163,199,.9)';x.font='15px Georgia,serif';
  x.fillText('Echoes of Me · '+new Date().toLocaleDateString(),380,136);
  x.strokeStyle='rgba(165,180,255,.3)';x.beginPath();x.moveTo(180,168);x.lineTo(580,168);x.stroke();
  let tot=0,got=0;
  for(let i=0;i<MAIN_LEVELS;i++){
    const n=LEVELS[i].map.join('').split('s').length-1;
    tot+=n;got+=Math.min(n,(save.stars[i]||[]).filter(Boolean).length);
  }
  x.fillStyle='#eef1ff';x.font='20px "Microsoft YaHei",sans-serif';
  x.fillText('总死亡  '+save.deaths+' 次',380,214);
  x.fillText('星星  '+got+' / '+tot,380,248);
  x.fillText('彩蛋  '+eggCount()+' / '+EGG_TOTAL,380,282);
  x.fillStyle='rgba(205,214,245,.88)';x.font='16px Georgia,serif';
  x.fillText('失败不是重来，是留下帮你的人。',380,330);
  x.fillStyle='rgba(143,151,196,.9)';x.font='14px Georgia,serif';
  const hp=save.statHelped||0;
  x.fillText('你在昨天死过 '+save.deaths+' 次。'+(hp>0?'你的回声替你按住了 '+hp+' 次门。':'')+'今天，他们都在你身后。',380,360);
  x.fillStyle='rgba(110,120,160,.6)';x.font='11px sans-serif';
  x.fillText('纯离线单机 · 截下这张卡，替昨天的自己骄傲一下',380,406);
}

/* =====================================================================
   终端
   ===================================================================== */
const termEl=document.getElementById('term'),termLog=document.getElementById('termlog'),termIn=document.getElementById('termin');
function termOpen(){return termEl.classList.contains('show');}
function openTerm(){
  if(termOpen())return;
  termEl.classList.add('show');
  if(mode==='play')mode='pause';
  tprint('EchoShell v1.0 —— 输入 help 查看命令。','c-dim');
  markEgg('terminal');
  termIn.focus();
}
function closeTerm(){
  termEl.classList.remove('show');
  if(mode==='pause'&&!veilOpen())mode='play';
  termIn.blur();
  if(document.activeElement)document.activeElement.blur();
}
function tprint(txt,cls){
  const d=document.createElement('div');
  if(cls)d.className=cls;
  d.textContent=txt;
  termLog.appendChild(d);
  termLog.scrollTop=termLog.scrollHeight;
}
const TERM_FILES=['README.md','彩蛋.txt','存档.dat','猫.png','昨日之我.exe','幽灵/'];
termIn.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Escape'){closeTerm();return;}
  if(e.key==='Enter'){
    const raw=termIn.value.trim();
    termIn.value='';
    if(!raw)return;
    tprint('幽灵@昨日之我:~$ '+raw,'c-dim');
    runCmd(raw);
  }
});
function runCmd(raw){
  const [cmd,...rest]=raw.split(/\s+/);
  const arg=rest.join(' ');
  termUsed.add(cmd.toLowerCase());
  if(termUsed.size>=5)markEgg('term_master');
  const c=cmd.toLowerCase();
  switch(c){
    case 'help':
      tprint('可用命令：help ls cat whoami sudo echo clear date pwd ping goto ghosts exit\n彩蛋命令自己探索 :)（试试打 moon / mirror / crash / cat / 42）','c-ok');break;
    case 'ls':
      tprint(TERM_FILES.join('   '));break;
    case 'cat':
      if(arg==='README.md')tprint('《昨日之我》：一个关于"和过去的自己合作"的小游戏。\n每次失败都会留下一个回声，它会重播你的操作，并替你压住机关。\n—— 没有一次失败是白费的。');
      else if(arg==='彩蛋.txt'||arg==='easter.txt'){tprint('【彩蛋提示（半剧透）】','c-warn');
        for(const id in EGGS)tprint((save.eggs[id]?'[√] '+EGGS[id].n:'[ ] ？？？')+' —— '+EGGS[id].h,save.eggs[id]?'c-ok':'c-dim');}
      else if(arg==='猫.png'){tprint('（这是一张猫的图片。真的。）\n喵~','c-warn');if(!cat){markEgg('cat');spawnCat();}}
      else if(arg==='存档.dat')tprint('关卡进度 '+save.unlocked+'/'+MAIN_LEVELS+' · 总死亡 '+save.deaths+' · 彩蛋 '+eggCount()+'/'+EGG_TOTAL+' · 来访 '+save.visits+' 次');
      else if(arg==='昨日之我.exe')tprint('拒绝执行：你已经在游戏里了。');
      else tprint('cat: '+arg+': 没有那个文件','c-err');
      break;
    case 'whoami':tprint('现在的你（也可能是昨天的你，谁分得清呢）');break;
    case 'pwd':tprint('C:\\昨日之我\\现在');break;
    case 'date':tprint(new Date().toLocaleString()+' （你所在的时间线）');break;
    case 'echo':tprint(arg||'');break;
    case 'ping':tprint('pong。（这里没有网络，也永远不需要）','c-ok');break;
    case 'sudo':markEgg('sudo');tprint('sudo: 身份验证失败 —— 你无法假装成昨天的你。','c-err');break;
    case 'vim':case 'vi':tprint('你进入了 vim。恭喜，你再也出不去了。\n……开玩笑的，输入 :q 退出。','c-warn');break;
    case ':q':case ':q!':case ':wq':tprint('好孩子。','c-ok');break;
    case 'rm':tprint(arg.includes('-rf')?'删除失败：这里的记忆是删不掉的（存档也是）。':'rm: 拒绝删除。','c-err');break;
    case 'goto':{
      const n=parseInt(arg,10);
      if(isNaN(n)){tprint('用法：goto 关卡数字（1-'+MAIN_LEVELS+'）','c-err');break;}
      if(n<1||n>MAIN_LEVELS){tprint('那里没有关卡。','c-err');break;}
      if(n>save.unlocked){tprint('你还没梦到这里。（先通关解锁，或者……）','c-err');break;}
      closeTerm();closePanel();startLevel(n-1);break;}
    case 'ghosts':
      tprint(cur?('当前关卡回声：'+cur.ghosts.length+'/'+GHOST_MAX+(cur.ghosts.length?'（它们还在走）':'（空空如也）')):'（还不在关卡里）');break;
    case '42':markEgg('answer42');tprint('42。问题呢？','c-warn');break;
    case 'moon':toggleMoon();tprint(moonMode?'重力已请假。':'重力已返岗。');break;
    case 'mirror':toggleMirror();tprint('镜子擦亮了。10 秒。');break;
    case 'crash':fakeCrash();break;
    case 'cat':if(arg){tprint('cat: '+arg+': 没有那个文件','c-err');}else{markEgg('cat');spawnCat();tprint('喵。','c-warn');}break;
    case 'wipe':tprint('如果真想清档：去彩蛋图鉴面板最下面有一个小按钮。','c-warn');break;
    case 'clear':termLog.innerHTML='';break;
    case 'exit':case 'q':closeTerm();break;
    default:tprint(c+': command not found（假装这是个真 shell）','c-err');
  }
}

/* ---------------- 假蓝屏 ---------------- */
const crashEl=document.getElementById('crash'),crashPct=document.getElementById('crashpct'),
      crashFill=document.getElementById('crashfill'),crashBar=document.getElementById('crashbar');
let crashTimer=null,crashArmed=false;
function fakeCrash(){
  if(crashEl.classList.contains('show'))return;
  markEgg('crash');
  crashEl.classList.add('show');
  crashPct.textContent='0';crashFill.style.width='0%';crashBar.style.display='none';
  crashArmed=false;
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.floor(rnd(4,18));if(p>100)p=100;
    crashPct.textContent=p;
    if(p>=100){
      clearInterval(iv);crashBar.style.display='block';
      setTimeout(()=>crashArmed=true,600);
    }
  },240);
  crashTimer=iv;
}
function dismissCrash(){
  if(!crashArmed)return;
  crashEl.classList.remove('show');
  if(crashTimer)clearInterval(crashTimer);
  toast('什么都没有坏。骗到你了 :) ',true);
}
crashEl.addEventListener('click',dismissCrash);
window.addEventListener('keydown',e=>{if(crashEl.classList.contains('show')){if(crashArmed){e.stopPropagation();dismissCrash();}}},true);

// 地图合法性自检（开发保险）
(function validate(){
  LEVELS.forEach((L,i)=>{
    if(L.map.length!==ROWS)console.error('关卡 '+i+' 行数错误');
    L.map.forEach((r,y)=>{
      if(r.length!==COLS)console.error('关卡 '+i+' 第 '+y+' 行长度='+r.length);
      for(const ch of r)if(!' #~^%&PEabcktsABCKT'.includes(ch))console.error('关卡 '+i+' 非法字符 '+ch);
    });
    if(!L.map.join('').includes('P'))console.error('关卡 '+i+' 缺少出生点');
    if(!L.map.join('').includes('E'))console.error('关卡 '+i+' 缺少出口');
  });
})();
